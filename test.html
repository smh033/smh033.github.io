<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="robots" content="noindex"><title>Retro Football · TEST</title></head>
<body style="background:#000;color:#fff;font:14px monospace"><div id="ld" style="padding:20px">LOADING TEST SITE...</div>
<script>
/* Test site: loads the real game (index.html) with the not-yet-live features switched on. Its saves, tokens and skins are kept apart from the real game. */
fetch('index.html?t='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{document.open();document.write(t);document.close();}).catch(e=>{document.getElementById('ld').textContent='COULD NOT LOAD THE GAME: '+e.message;});
</script></body></html>
