name: Update NFL rosters
on:
  schedule:
    - cron: "17 9 * * 2"   # every Tuesday 09:17 UTC (after the weekend's games)
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_rosters.py 2026
      - name: Commit if changed
        run: |
          git config user.name "roster-bot"
          git config user.email "roster-bot@users.noreply.github.com"
          git add nfl-rosters.json
          git diff --cached --quiet || (git commit -m "Update NFL rosters" && git push)
