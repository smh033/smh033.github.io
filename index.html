<style>
:root{--bl:#2f63e6;--bl2:#2856d4;--bl3:#1f45ad;--nv:#13286e;--yl:#e3d915;--yl2:#fff36b;--rd:#e8423a;--gr:#3fd04f;--wh:#fff;--dk:#20222e;--dk2:#4d5068;--cy:#7fd0ff;--tx:#fff;--dim:#b7c8ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;color:var(--tx);font-size:8px;line-height:1.5}
#root{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:640px;height:360px;flex:none;background:var(--bl);overflow:hidden;transform-origin:center center}
#lg{position:absolute;left:0;top:0;width:640px;height:360px;display:none;pointer-events:none}
#cv{position:absolute;left:0;top:0;width:640px;height:360px;image-rendering:pixelated;image-rendering:crisp-edges;display:none;touch-action:none}

.screen{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;gap:6px;padding:7px 10px 8px;background:var(--bl) repeating-linear-gradient(0deg,rgba(0,0,30,.06) 0 1px,transparent 1px 3px)}
.row{display:flex;gap:6px;align-items:center}.col{display:flex;flex-direction:column;gap:6px}

.dim{color:var(--dim)}.yl{color:var(--yl2)}.rdt{color:#ff7a70}.grt{color:#7dff8a}.cyt{color:var(--cy)}

.tst{display:inline-flex;gap:1px}.tst i{display:inline-block;width:12px;height:12px;clip-path:polygon(50% 0,62% 34%,98% 36%,69% 58%,80% 94%,50% 73%,20% 94%,31% 58%,2% 36%,38% 34%)}
.tst i.r{background:#e3342f}.tst i.w{background:#fff}.tst i.n{background:#14286b}
.box{border:2px solid #fff;position:relative;padding:9px 6px 5px;box-shadow:0 2px 0 rgba(0,0,40,.35)}

.bt.ico{padding:5px 6px}

.stars{display:inline-flex;gap:1px;vertical-align:middle}
.stars i{display:inline-block;width:8px;height:8px;background:#1d2f78;clip-path:polygon(50% 0,62% 34%,98% 36%,69% 58%,80% 94%,50% 73%,20% 94%,31% 58%,2% 36%,38% 34%)}
.stars.lg i{width:11px;height:11px}.stars.xs i{width:6px;height:6px}
.stars i.f{background:var(--yl2)}.stars i.h{background:linear-gradient(90deg,var(--yl2) 50%,#1d2f78 50%)}
.stars.o i.f{background:#6ad6ff}.stars.o i.h{background:linear-gradient(90deg,#6ad6ff 50%,#1d2f78 50%)}
.stars.d i.f{background:#ff4a3d}.stars.d i.h{background:linear-gradient(90deg,#ff4a3d 50%,#1d2f78 50%)}
.bar{height:12px;border:2px solid #000;background:#000;position:relative;overflow:hidden}.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--yl)}
.segs{display:flex;gap:2px;border:2px solid #000;background:#000;padding:0}.segs i{flex:1;height:14px;background:#33386a}.segs i.on{background:var(--yl)}
.pips{display:inline-flex;gap:2px}.pips i{width:7px;height:8px;background:#1d2f78}.pips i.on{background:var(--yl2)}
.face{image-rendering:pixelated;display:inline-block;vertical-align:middle}
.tbl{width:100%;border-collapse:collapse;font-size:8px}

.tbl td.r,.tbl th.r{text-align:right}.tbl td.c,.tbl th.c{text-align:center}

.scroll{overflow-y:auto;overflow-x:hidden;min-height:0;touch-action:pan-y;-webkit-overflow-scrolling:touch}

.pcard .ph{height:56px;position:relative;background:#8cc8f5;overflow:hidden;display:flex;justify-content:center;align-items:flex-end}

.pcard .ph .fc{position:absolute;right:3px;top:3px}

.pcard .ph .tg{position:absolute;left:3px;bottom:3px;font-size:6px;padding:2px 2px 1px;line-height:1}

.tg.inj{background:var(--rd);color:#fff}.tg.sp{background:var(--yl);color:#000}.tg.ex{background:#fff;color:#000}

.tile.dk{background:var(--dk);border-color:#3c3f52;color:#5d6079;cursor:default}
.tile.dk .stars i.f,.tile.dk .stars i.h{opacity:.55}
.chip{font:inherit;font-size:7px;padding:4px 5px 3px;border:2px solid #fff;background:var(--bl);color:#fff;cursor:pointer;touch-action:manipulation}
.mp.cmp{gap:6px;padding-top:10px;padding-bottom:10px}.mp.cmp .row{gap:4px}.mp.cmp .row>span:first-child{width:118px!important;flex:none}.mp.cmp .chip{padding:3px 5px 2px;white-space:nowrap}.mp.cmp .bt{padding:5px 7px 4px}
body.mobile .mp.cmp .chip{padding:5px 6px 4px}body.mobile .mp.cmp .bt{padding:6px 8px 5px}
.chip.on{background:var(--yl);text-shadow:1px 1px 0 #7a7300}
.modal{position:absolute;inset:0;background:rgba(0,0,30,.6);display:flex;align-items:center;justify-content:center;z-index:60;pointer-events:auto}
.mp{background:var(--bl);border:2px solid #fff;box-shadow:0 4px 0 rgba(0,0,40,.5);padding:10px;display:flex;flex-direction:column;gap:7px;max-width:620px;max-height:350px}
input.txt{font:inherit;font-size:10px;background:var(--nv);border:2px solid #fff;color:#fff;padding:6px 7px;outline:none;width:100%;text-transform:uppercase;-webkit-user-select:text;user-select:text}
.sw{width:15px;height:15px;border:2px solid #000;cursor:pointer;display:inline-block}.sw.on{outline:2px solid #fff}
.ava{image-rendering:pixelated;display:block}
.toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:var(--nv);border:2px solid #fff;padding:6px 9px;z-index:90;font-size:8px;pointer-events:none;animation:fin .2s;white-space:normal;max-width:88%;width:max-content;text-align:center;line-height:1.5}
@keyframes fin{from{opacity:0}}
@keyframes pulse{50%{opacity:.35}}.blink{animation:pulse 1s steps(2) infinite}
/* timeline */
.tl{background:var(--yl);height:66px;position:relative;margin:0 -10px;color:#fff;text-shadow:1px 1px 0 #6d6700;cursor:pointer}
.tl .ln{position:absolute;left:0;right:0;top:36px;height:4px;background:#fff}
.tl.tls{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x}.tl.tls::-webkit-scrollbar{display:none}.tl .tlin{position:relative;height:100%}
.tl .ln i{position:absolute;left:0;top:0;bottom:0;background:var(--gr)}
.tl .nd{position:absolute;top:0;width:216px;transform:translateX(-50%);text-align:center;display:flex;flex-direction:column;align-items:center}
.tl .nd .a{font-size:8px;margin-top:5px;white-space:nowrap}.tl .nd .b{font-size:8px;margin-top:3px;white-space:nowrap}
.tl .nd .dot{width:22px;height:12px;border-radius:50%;background:#ddd;border:2px solid #fff;margin-top:4px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.tl .nd .dot.w{background:var(--gr)}.tl .nd .dot.l{background:var(--rd)}.tl .nd .dot.c{background:#fff;width:26px;height:14px}
.tl .nd .r{font-size:8px;margin-top:3px}
/* in-game layer */
.gl{position:absolute;inset:0;pointer-events:none}
.gl .bt,.gl .pe{pointer-events:auto}
.gtop{position:absolute;left:0;right:0;top:0;height:0;pointer-events:none}
/* TV scoreboard: sits over the stands at the top, never over the field */
.sbw{position:absolute;top:3px;left:50%;transform:translateX(-50%)}
.sb{position:relative;display:flex;align-items:stretch;height:36px;background:linear-gradient(#262c44,#0f1324);border:1px solid rgba(255,255,255,.55);box-shadow:0 2px 0 rgba(0,0,0,.5);white-space:nowrap}
.sb .tm{display:flex;align-items:center;gap:5px;padding:0 7px}
.sb .bdg{width:26px;height:26px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:6px;line-height:1;font-style:normal;letter-spacing:-0.5px;text-shadow:none;box-shadow:0 1px 0 rgba(0,0,0,.5)}
.sb .nflsb-logo{display:block;flex:none;width:30px;height:27px;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.55))}
.sb .sc{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:30px}
.sb .sc b{font-weight:normal;font-size:16px;line-height:1;text-shadow:2px 2px 0 #000}
.sb .to{display:flex;gap:2px}.sb .to i{width:7px;height:3px;background:#5a5f78}.sb .to i.on{background:#f0f0f0}
.sb .pos{width:5px;height:4px;border-radius:50%;background:#a0561c;box-shadow:0 0 0 1px #000;margin-top:-1px}
.sb .clk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 9px;background:rgba(0,0,0,.45);border-left:1px solid rgba(255,255,255,.25);border-right:1px solid rgba(255,255,255,.25)}
.sb .clk b{font-weight:normal;font-size:10px;line-height:1}.sb .clk span{font-size:7px;line-height:1;color:#cfd6ff}
.sbd{position:absolute;left:calc(100% + 4px);top:0;display:flex;align-items:center;gap:6px;height:16px;padding:0 6px;background:#13286e;border:1px solid rgba(255,255,255,.55);font-size:7px;line-height:1;white-space:nowrap}
.sbd .pc{color:#ffe94a}.sbd .pc.lo{color:#ff6a5c}
.gbot{position:absolute;left:0;right:0;bottom:0;height:18px;background:#0b2a10;display:flex;align-items:center;gap:6px;padding:0 6px;font-size:8px;white-space:nowrap}
.gl .gpause,body.mobile .gl .gpause{position:absolute;right:2px;top:1px;width:28px;height:14px;padding:0;font-size:7px;line-height:1;border-width:1px;box-shadow:none;display:flex;align-items:center;justify-content:center;z-index:30}
.gpause::after{content:'';position:absolute;left:-12px;right:-3px;top:-2px;bottom:-14px}
.gctrl{position:absolute;right:6px;bottom:22px;display:flex;gap:5px;align-items:flex-end}
.ghint{position:absolute;left:0;right:0;bottom:52px;text-align:center;font-size:7px;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;color:#fff;pointer-events:none}
.gban{position:absolute;left:0;right:0;top:20%;text-align:center;pointer-events:none}
.gban div{display:inline-block;font-size:16px;color:#fff;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 3px 0 #000;animation:fin .15s;line-height:1.3}
.gban small{display:block;font-size:8px;margin-top:5px}
.gov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,30,.45);pointer-events:auto;z-index:20}
.gov .mp{width:470px}
.pbp{font-size:7px;line-height:1.9;height:118px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.pbp div{border-bottom:1px solid rgba(255,255,255,.18);animation:fin .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bracket{display:flex;gap:5px;align-items:stretch}.bracket .rd{display:flex;flex-direction:column;justify-content:space-around;gap:4px;flex:1}
.bm{border:2px solid #fff;font-size:7px;background:var(--bl3)}.bm div{display:flex;justify-content:space-between;padding:3px 4px 2px;gap:4px}
.bm div.w{color:var(--yl2)}.bm div.me{background:#3b6cf0}
#fw{position:absolute;inset:0;width:640px;height:360px;image-rendering:pixelated;pointer-events:none}
body.mobile .bt{padding:8px 9px 7px}body.mobile .chip{padding:6px 7px 5px}
.ngc .chip{padding:4px 7px 3px}.ngc input.txt{padding-top:3px;padding-bottom:2px}
.nwi{white-space:normal;overflow-wrap:anywhere;line-height:1.35;flex:none}
</style>

<script>
'use strict';
/* =====================================================================
   RETRO FOOTBALL — core: data, players, rosters, league, sim, offseason
   ===================================================================== */
const $=(s,r)=>(r||document).querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,u)=>a+(b-a)*u;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const fmtM=v=>Math.round(v)+'M';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const _SH=new Map();
function shade(hex,amt){const key=hex+amt;let v=_SH.get(key);if(v)return v;let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');const n=parseInt(c,16);const r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);v='#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);_SH.set(key,v);return v;}
function lum(hex){const n=parseInt(hex.replace('#',''),16);return((n>>16)*0.299+((n>>8)&255)*0.587+(n&255)*0.114);}
function colDist(a,b){const x=parseInt(a.slice(1),16),y=parseInt(b.slice(1),16);return Math.hypot((x>>16)-(y>>16),((x>>8)&255)-((y>>8)&255),(x&255)-(y&255));}
const ROMAN=n=>{const m=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(const[v,r]of m)while(n>=v){s+=r;n-=v;}return s;};

/* ---------- CONFIG (edit names here) ---------- */
const CFG={champ:'SUPER BOWL',game:'RETRO FOOTBALL',startYear:2026,saveKey:'pixelGridiron_v2',cap:150,capMax:260,capStep:5,capCost:10};
const DIVS=['EAST','NORTH','SOUTH','WEST'];
/* Official NFL franchise identities. Team IDs and order intentionally stay
   stable so existing Pixel Gridiron saves keep pointing at the same clubs. */
const TEAM_DATA=[
 ['Buffalo','Bills','BUF','#00338D','#C60C30'],['Miami','Dolphins','MIA','#008E97','#FC4C02'],['New England','Patriots','NE','#002244','#C60C30'],['New York','Jets','NYJ','#125740','#FFFFFF'],
 ['Baltimore','Ravens','BAL','#241773','#9E7C0C'],['Cincinnati','Bengals','CIN','#FB4F14','#000000'],['Cleveland','Browns','CLE','#311D00','#FF3C00'],['Pittsburgh','Steelers','PIT','#FFB612','#101820'],
 ['Houston','Texans','HOU','#03202F','#A71930'],['Indianapolis','Colts','IND','#002C5F','#A2AAAD'],['Jacksonville','Jaguars','JAX','#006778','#D7A22A'],['Tennessee','Titans','TEN','#0C2340','#4B92DB'],
 ['Denver','Broncos','DEN','#FB4F14','#002244'],['Kansas City','Chiefs','KC','#E31837','#FFB81C'],['Las Vegas','Raiders','LV','#000000','#A5ACAF'],['Los Angeles','Chargers','LAC','#0080C6','#FFC20E'],
 ['Dallas','Cowboys','DAL','#003594','#869397'],['New York','Giants','NYG','#0B2265','#A71930'],['Philadelphia','Eagles','PHI','#004C54','#A5ACAF'],['Washington','Commanders','WAS','#5A1414','#FFB612'],
 ['Chicago','Bears','CHI','#0B162A','#C83803'],['Detroit','Lions','DET','#0076B6','#B0B7BC'],['Green Bay','Packers','GB','#203731','#FFB612'],['Minnesota','Vikings','MIN','#4F2683','#FFC62F'],
 ['Atlanta','Falcons','ATL','#A71930','#000000'],['Carolina','Panthers','CAR','#0085CA','#101820'],['New Orleans','Saints','NO','#D3BC8D','#101820'],['Tampa Bay','Buccaneers','TB','#D50A0A','#34302B'],
 ['Arizona','Cardinals','ARI','#97233F','#000000'],['Los Angeles','Rams','LA','#003594','#FFA300'],['San Francisco','49ers','SF','#AA0000','#B3995D'],['Seattle','Seahawks','SEA','#002244','#69BE28'],
];
const TEAMS=TEAM_DATA.map((d,i)=>({id:i,city:d[0],nickname:d[1],name:d[0]+' '+d[1],city0:d[0],nick0:d[1],abbr:d[2],c1:d[3],c2:d[4],conf:i<16?'AFC':'NFC',div:DIVS[Math.floor(i/4)%4],di:Math.floor(i/4)}));

/* ---------- NFL midfield stadium logos ----------
   The midfield badge is always the home franchise's logo: the user's team for
   home games, and the opponent's team for away games. Logos load on demand from
   ESPN's public logo CDN, and the local abbreviation mark is used as a fallback.
*/
const NFL_LOGO_ESPN_SLUGS={LA:'lar',WAS:'wsh'};
const NFL_FIELD_LOGOS=Object.create(null);
const NFL_FIELD_LOGO_PENDING=new Set();
const NFL_FIELD_LOGO_FAILED=new Set();
const CUST_LOGO={team:null,src:null};
function loadFieldLogo(teamId){

   try{if(athlete?.['$ref'])athlete=await fetchJson(athlete['$ref']);}catch(e){return null;}
   const position=athlete?.position?.abbreviation||athlete?.position?.name||obj?.position?.abbreviation||obj?.position?.name||'';

  const a=pick(ids),b=pick(ids.filter(x=>x!==a)),RA=rosterOf(a),RB=rosterOf(b);if(RA.length<4||RB.length<4)continue;

/* How a player performed last season compared with what his rating should produce (per full game).

function perfGrade(p){

 if(p.pos==='QB')g=(pg('pyd')-(150+o*12))/70+(pg('ptd')-1.6*pg('pint')-0.6)*0.8;
 else if(p.pos==='RB')g=(pg('ryd')+pg('wyd')-(35+o*7))/30+(pg('rtd')+pg('wtd')-0.4);

function progressPlayer(p,perf){

 /* age curve: young players grow, prime years hold, then a decline that speeds up after 32 (QBs and Ks age slower) */
 const a=p.age-(p.pos==='QB'||p.pos==='K'?3:0);
 let n=a<=24?ri(1,3):a<=27?ri(0,2):a<=29?ri(0,1):a<=31?-ri(0,1):a<=33?-ri(1,2):-ri(1,3);

/* ---------- retirement ----------

 for(let i=0,n=ri(2,5);i<n;i++)aiTrade();

/* ---------- job offers ---------- */
/* You can change teams every other season, and only to teams that need a head coach:
   clubs that fired theirs after a bad year, plus the odd one whose coach retired or left. */
function offersDue(){return L.season-L.lastOffer>=2;}
function genOffers(){
 const h=L.hist[0],good=h?(h.w+h.t*0.5)/17+(h.res==='CHAMPIONS'?0.25:inPlayoffs(L.user)?0.1:0):0.4;
 const ids=L.teams.map(t=>t.id).filter(t=>t!==L.user),why={},out=[];
 // worst records fire their coach most often
 const byRec=ids.slice().sort((a,b)=>tpct(L.teams[a])-tpct(L.teams[b])||((L.teams[a].pf-L.teams[a].pa)-(L.teams[b].pf-L.teams[b].pa)));
 byRec.forEach((t,i)=>{const R=L.teams[t],p=tpct(R)>0.6?0:i<4?0.75:i<8?0.4:i<14?0.12:0.02;if(Math.random()<p&&!(L.po&&L.po.champ===t)){out.push(t);why[t]='FIRED COACH AFTER '+R.w+'-'+R.l+(R.t?'-'+R.t:'');}});
 // a coach retires or leaves for another job somewhere else (more likely to be a good team if you won)
 const extra=ids.filter(t=>!out.includes(t));const nx=good>0.6?2:1;
 for(let i=0;i<nx&&extra.length;i++){const ranked=extra.sort((a,b)=>tpct(L.teams[b])-tpct(L.teams[a]));const k=Math.floor(Math.pow(Math.random(),good>0.6?2:1)*ranked.length);const t=ranked.splice(k,1)[0];out.push(t);why[t]=pick(['COACH RETIRED','COACH LEFT FOR COLLEGE','COACH STEPPED DOWN']);}
 while(out.length<3){const left=byRec.filter(t=>!out.includes(t));const t=left[0];out.push(t);why[t]='FIRED COACH AFTER '+L.teams[t].w+'-'+L.teams[t].l;}
 const list=out.slice(0,7);L.jobWhy={};for(const t of list)L.jobWhy[t]=why[t];
 L.lastOffer=L.season;return list;
}

 for(const p of rosterOf(t))p.mor=70;
 news('Coach '+L.coach+' leaves '+teamName(old)+' to take the '+T(t).name+' job!');

}

/* Save slots: slot 1 keeps the original key so existing saves stay in slot 1. */
const SLOTS_N=5;
let SLOT=(()=>{try{return clamp(+localStorage.getItem('rf_slot')||1,1,SLOTS_N);}catch(e){return 1;}})();
const slotKey=n=>n===1?CFG.saveKey:CFG.saveKey+'_s'+n;
function setSlot(n){SLOT=n;try{localStorage.setItem('rf_slot',String(n));}catch(e){}}
function save(){if(!L||L.exh)return;   /* Head to Head games are never saved */L.savedAt=Date.now();const c=Object.assign({},L);delete c.pmap;const js=JSON.stringify(c);
 try{localStorage.setItem(slotKey(SLOT),js);}catch(e){
  /* browser storage full: drop the re-downloadable NFL roster copy and try again, otherwise tell the player */
  try{localStorage.removeItem(NFL_CACHE_KEY);localStorage.setItem(slotKey(SLOT),js);}catch(e2){if(!window.__fullWarn||Date.now()-window.__fullWarn>60000){window.__fullWarn=Date.now();toast('STORAGE FULL · DELETE AN OLD SAVE SLOT');}}}}
function loadSave(n){try{const s=localStorage.getItem(slotKey(n||SLOT));if(!s)return null;const o=JSON.parse(s);if(!o||o.v!==2)return null;migrate(o);return o;}catch(e){return null;}}

function migrate(o){
 if(!o.picks)o.picks=[1,1,1];if(!o.settings.dir)o.settings.dir='S';if(o.settings.replay==null)o.settings.replay=true;
 for(const p of o.players){const a=p.a;if(a.arm!=null){if(a.str==null)a.str=a.arm;delete a.arm;}if(a.kpw!=null){a.str=a.kpw;delete a.kpw;}
  const have=Object.values(a),avg=have.length?have.reduce((x,y)=>x+y,0)/have.length:4;for(const k of POSDEF[p.pos])if(a[k]==null)a[k]=clamp(Math.round(avg+rnd(-1,1)),1,10);}
}

function uniCol(t){try{const u=uniformsFor(t)[0],wh=c=>lum(c)>215;let c1=u.jersey;if(wh(c1))c1=wh(u.helm)?u.trim:u.helm;let c2=u.trim&&colDist(u.trim,c1)>40?u.trim:(u.helm&&colDist(u.helm,c1)>40?u.helm:teamCol(t).c2);return{c1,c2};}catch(e){return teamCol(t);}}
function uniformsFor(t){
 if(T(t).college){const c=teamCol(t);return[
  {n:'HOME',helm:c.c1,stripe:c.c2,jersey:c.c1,trim:c.c2,pants:'#ededed',socks:c.c1},
  {n:'AWAY',helm:c.c1,stripe:c.c2,jersey:'#eeeeee',trim:c.c1,pants:'#eeeeee',socks:c.c1},
  {n:'ALT',helm:c.c2,stripe:c.c1,jersey:c.c2,trim:c.c1,pants:c.c2,socks:c.c2}
 ];}
 if(L&&t===L.user&&L.custom&&Array.isArray(L.custom.unis)&&L.custom.unis.length)return L.custom.unis.map(u=>Object.assign({},u));
 const ab=T(t).abbr,c=teamCol(t);let raw=UNI_RAW[ab];
 if(!raw||(t===L?.user&&L?.custom&&L.custom.c1))raw=[['HOME',c.c1,c.c2,c.c1,c.c2,'#e2e2e2',c.c1],['COLOR RUSH',c.c1,c.c2,c.c1,c.c2,c.c1,c.c1],['BLACKOUT','#111111',c.c1,'#111111',c.c1,'#111111','#111111']];
 const mk=r=>({n:r[0],helm:r[1],stripe:r[2],jersey:r[3],trim:r[4],pants:r[5],socks:r[6]});
 const H=mk(raw[0]),away={n:'AWAY',helm:H.helm,stripe:H.stripe,jersey:'#f0f0f0',trim:H.jersey==='#f2f2f2'?H.trim:H.jersey,pants:H.pants,socks:H.socks};
 if(H.jersey==='#f2f2f2'){/* white-at-home teams: their "away" is the colour jersey listed next */}
 return[H,away,...raw.slice(1).map(mk)];

function defaultUnis(g){const H=uniformsFor(g.h),A=uniformsFor(g.a);let ua=1;
 if(colDist(H[0].jersey,A[ua].jersey)<80){for(let i=0;i<A.length;i++)if(colDist(H[0].jersey,A[i].jersey)>=80){ua=i;break;}}

function lookFor(p,t,away,alt){

  lk.key=[lk.helm,lk.stripe,lk.jersey,lk.trim,lk.pants,lk.socks,lk.mask||'',lk.skin,'team'+t].join('');loadFieldLogo(t);return lk;}
 let c=teamCol(t);if(alt)c={c1:c.c2,c2:c.c1};const pl=lum(c.c2);
 const lk={helm:c.c1,stripe:c.c2,jersey:away?'#f0f0f0':c.c1,trim:away?c.c1:c.c2,pants:away?'#d9d9d9':(pl>70&&pl<215?c.c2:'#e2e2e2'),socks:c.c1,skin:SKIN[p?p.skin:2],teamId:t};

function tlNodes(){
 const t=L.user,nodes=[];
 const wk=w=>{const g=teamGame(w,t);if(!g)return{a:'WEEK '+w,b:'BYE',res:null,w};const home=g.h===t,op=home?g.a:g.h;let res=null;if(g.hs!=null){const us=home?g.hs:g.as,th=home?g.as:g.hs;res={c:us>th?'w':us<th?'l':'t',txt:(us>th?'W':us<th?'L':'T')+' '+us+'-'+th};}return{a:'WEEK '+w,b:(home?'vs ':'at ')+T(op).name.toUpperCase(),res,w};};
 if(L.phase==='REG'){const w=L.week;nodes.push(w>1?wk(w-1):null,wk(w),w<18?wk(w+1):{a:L.cfbTeams?ROUNDS[0]:T(t).conf+' WILD CARD',b:'',res:null});}
 else if(L.phase==='PO'){const r=L.po.cur,g=L.po.rounds[r].find(x=>x.h===t||x.a===t);
  const pr=r>0?L.po.rounds[r-1].find(x=>x.h===t||x.a===t):null;
  const lbl=i=>i===3?champName():L.cfbTeams?ROUNDS[i]:T(t).conf+' '+ROUNDS[i];
  const nd=(gg,i)=>{if(!gg)return{a:lbl(i),b:'',res:null};const home=gg.h===t,op=home?gg.a:gg.h;let res=null;if(gg.hs!=null){const us=home?gg.hs:gg.as,th=home?gg.as:gg.hs;res={c:us>th?'w':'l',txt:(us>th?'W ':'L ')+us+'-'+th};}return{a:lbl(i),b:(home?'vs ':'at ')+T(op).name.toUpperCase(),res};};
  nodes.push(r>0?nd(pr,r-1):{a:'WEEK 18',b:'',res:null},nd(g,r),r<3?{a:lbl(r+1),b:'',res:null}:null);}
 return nodes;
}
/* every week of the season plus the playoff rounds, for the scrollable strip on the hub */
function tlAll(){
 const t=L.user,nodes=[];
 for(let w=1;w<=L.sched.length;w++){const g=teamGame(w,t);if(!g){nodes.push({a:'WEEK '+w,b:'BYE',res:null});continue;}
  const home=g.h===t,op=home?g.a:g.h;let res=null;if(g.hs!=null){const us=home?g.hs:g.as,th=home?g.as:g.hs;res={c:us>th?'w':us<th?'l':'t',txt:(us>th?'W':us<th?'L':'T')+' '+us+'-'+th};}
  nodes.push({a:'WEEK '+w,b:(home?'vs ':'at ')+T(op).name.toUpperCase(),res});}
 const lbl=i=>i===3?champName():L.cfbTeams?ROUNDS[i]:T(t).conf+' '+ROUNDS[i];
 for(let r=0;r<4;r++){const gg=L.phase==='PO'&&L.po&&L.po.rounds[r]?L.po.rounds[r].find(x=>x.h===t||x.a===t):null;
  if(!gg){nodes.push({a:lbl(r),b:'',res:null});continue;}
  const home=gg.h===t,op=home?gg.a:gg.h;let res=null;if(gg.hs!=null){const us=home?gg.hs:gg.as,th=home?gg.as:gg.hs;res={c:us>th?'w':'l',txt:(us>th?'W ':'L ')+us+'-'+th};}
  nodes.push({a:lbl(r),b:(home?'vs ':'at ')+T(op).name.toUpperCase(),res});}
 const cur=L.phase==='PO'&&L.po?L.sched.length+L.po.cur:Math.min(L.sched.length,L.week)-1;
 return{nodes,cur};
}

/* Automatic weekly rating updates for NFL saves: the site's roster file is rebuilt every week
   from real production. Each real player keeps his team in your save; only the change in his
   real rating since the last update is added on top, so skill points you spent stay. Stops
   once your save moves past the real season. */
/* Automatic roster refresh for NFL saves: whenever the site's roster file is rebuilt (every week,
   or when a team gets hand-picked changes), every OTHER team is reset to its current real roster
   and depth chart. Players keep their stats, rings and skill points when they move. Your own
   team is never touched. Stops once your save moves past the real season. */
function syncNFLRosters(){
 if(!L||L.rosterMode!=='NFL'||L.exh||L.year!==CFG.startYear||L.draft||window.__rosSync||window.__rosDone)return;window.__rosSync=true;
 fetch('nfl-rosters.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{
  if(!j||!L||!j.builtAt||j.builtAt===L.rostersAt||UI.scr==='game')return;
  const data=normalizeNFLRows(j.rows||[]);if(j.teamPower){NFL_POWER=j.teamPower;L.nflPower=NFL_POWER;}
  const key=p=>nflNameKey(p.fn+' '+p.ln),mineK=new Set(rosterOf(L.user).map(key));
  const notMine=r=>!mineK.has(nflNameKey(r.full_name||`${r.first_name} ${r.last_name}`));
  for(const a in data.teams)data.teams[a]=data.teams[a].filter(notMine);data.freeAgents=(data.freeAgents||[]).filter(notMine);
  const was=new Map(),pool=new Map();
  for(const p of L.players.slice()){if(!p.nfl||p.team===L.user)continue;was.set(p.id,p.team);pool.set(key(p),p);removePlayer(p);}
  NFL_REUSE=pool;
  try{
   for(const t of L.teams)if(t.id!==L.user)buildNFLTeamRoster(t.id,data);
   const seen=new Set();for(const r of data.freeAgents){const k=rowIdentity(r);if(!k||seen.has(k))continue;seen.add(k);const p=makeNFLPlayer(r,-1);if(p){p.nflFreeAgent=true;p.yrs=Math.max(1,p.yrs||1);}}
  }finally{NFL_REUSE=null;}
  for(const p of pool.values()){p.team=-1;addPlayer(p);}   /* no longer on any real roster: free agent */
  {let n=L.players.filter(p=>p.team===-1).length;while(n<34){addFA();n++;}}
  const moves=L.players.filter(p=>was.has(p.id)&&was.get(p.id)!==p.team&&p.team>=0);
  if(L.rostersAt||moves.length)news('NFL rosters refreshed to the latest real depth charts'+(moves.length?': '+moves.slice(0,3).map(p=>p.pos+' '+fullname(p)+' to '+abbr(p.team)).join(', ')+(moves.length>3?' and '+(moves.length-3)+' more moves.':'.'):'.'));
  L.rostersAt=j.builtAt;PRC.clear();for(const k in AVC)delete AVC[k];SPC.clear();save();if(UI.scr!=='game')render();
 }).catch(()=>{}).finally(()=>{window.__rosSync=false;window.__rosDone=true;});
}
function syncNFLRatings(){
 if(!L||L.rosterMode!=='NFL'||L.year!==CFG.startYear||window.__rateSync||window.__rateDone)return;window.__rateSync=true;
 fetch('nfl-rosters.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{
  if(!j||!L)return;   // runs on every page load: ratings follow the latest real stats, rosters never move
  if(j.teamPower){NFL_POWER=j.teamPower;L.nflPower=NFL_POWER;}
  const by=new Map();for(const r of j.rows||[]){const k=nflNameKey(r.full_name||'');if(k&&!by.has(k))by.set(k,r);}
  let up=0,down=0;
  for(const p of L.players){if(!p.nfl)continue;const r=by.get(nflNameKey(p.fn+' '+p.ln));if(!r)continue;
   const pos=mapNFLPosition(r.position)||p.pos,q=nflQuality(r,pos);
   // Shift his attributes by how much his real rating changed. Skill points you spent stay on top,
   // because only the change in the real rating is applied (first time: measured from his current overall).
   const base=p.nflQ!=null?p.nflQ:ovr(p);const d=clamp(q-base,-3,3);p.nflQ=q;if(Math.abs(d)<0.01)continue;
   p.nflAcc=(p.nflAcc||0)+d;const st=Math.round(p.nflAcc);if(!st)continue;p.nflAcc-=st;
   for(const k of POSDEF[p.pos])p.a[k]=clamp(p.a[k]+st,1,10);p.peak=Math.max(p.peak||0,ovr(p));if(ovr(p)>p.pot)p.pot=Math.min(10,ovr(p)+0.2);   /* real-life breakout raises his ceiling */if(st>0)up++;else down++;}
  L.ratingsAt=j.builtAt;
  if(up||down)news('NFL ratings updated from this week\'s real stats: '+up+' up, '+down+' down.');
  save();if(UI.scr!=='game')render();
 }).catch(()=>{}).finally(()=>{window.__rateSync=false;window.__rateDone=true;});
}
/* Existing saves: give every NFL player his real attribute profile once, keeping his overall
   (and potential) - only the mix between his attributes changes. Your own skill-point spending
   stays in his overall. */
function syncNFLQBPot(){
 if(!L||L.rosterMode!=='NFL'||L.qbPotV===1||window.__qbpSync)return;window.__qbpSync=true;
 fetch('nfl-rosters.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{
  if(!j||!L)return;const by=new Map();for(const r of j.rows||[]){const k=nflNameKey(r.full_name||'');if(k&&!by.has(k))by.set(k,r);}
  for(const p of L.players){if(p.pos!=='QB'||!p.nfl||p.qbPotV)continue;const r=by.get(nflNameKey(p.fn+' '+p.ln));if(r)nflQBPot(p,r);}
  L.qbPotV=1;save();if(UI.scr!=='game')render();
 }).catch(()=>{}).finally(()=>{window.__qbpSync=false;});
}
function syncNFLProfiles(){
 if(!L||L.rosterMode!=='NFL'||L.profV===1||window.__profSync)return;window.__profSync=true;
 fetch('nfl-rosters.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{
  if(!j||!L)return;const by=new Map();for(const r of j.rows||[]){const k=nflNameKey(r.full_name||'');if(k&&r.tilt&&!by.has(k))by.set(k,r.tilt);}
  let n=0;for(const p of L.players){if(!p.nfl||p.profV===1)continue;const t=by.get(nflNameKey(p.fn+' '+p.ln));if(!t)continue;
   const base=ovr(p),ks=POSDEF[p.pos];p.tilt=t;
   for(const k of ks)p.a[k]=clamp(Math.round(base+(t[k]||0)*TILT_K),1,10);
   // nudge the rounding so his overall stays where it was
   for(let it=0;it<4;it++){const d=ovr(p)-base;if(Math.abs(d)<0.2)break;const k=d>0?ks.reduce((a,b)=>p.a[a]-(t[a]||0)>=p.a[b]-(t[b]||0)?a:b):ks.reduce((a,b)=>p.a[a]-(t[a]||0)<=p.a[b]-(t[b]||0)?a:b);p.a[k]=clamp(p.a[k]+(d>0?-1:1),1,10);}
   p.profV=1;n++;}
  L.profV=1;save();if(UI.scr!=='game')render();
 }).catch(()=>{}).finally(()=>{window.__profSync=false;});
}
function syncNFLLooks(){
 if(!L||L.rosterMode!=='NFL'||L.looksV===1||window.__lookSync)return;window.__lookSync=true;
 fetch('nfl-rosters.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{
  if(!j||!L)return;const by=new Map();for(const r of j.rows||[])if(r.look)by.set(String(r.full_name||'').toUpperCase(),r.look);
  for(const p of L.players){if(!p.nfl)continue;const lk=by.get((p.fn+' '+p.ln).toUpperCase());if(lk){[p.skin,p.hair,p.hc,p.beard]=lk.map(Number);}applySavedLook(p);}
  L.looksV=1;PRC.clear();for(const k in AVC)delete AVC[k];SPC.clear();save();if(UI.scr!=='game')render();
 }).catch(()=>{}).finally(()=>{window.__lookSync=false;});
}

function simStats(us,th){
 const lu=lineup(L.user),ps={},S=p=>p?(ps[p.id]=ps[p.id]||{xp:0}):null,add=(p,k,v)=>{const s=S(p);if(s)s[k]=(s[k]||0)+v;};
 const tds=Math.floor(us/7),py=Math.round(rnd(140,300)*(0.7+us/60)),ry=Math.round(rnd(50,140));
 const qb=lu.QB[0];add(qb,'pyd',py);add(qb,'att',ri(20,34));add(qb,'cmp',ri(13,24));
 const recs=[lu.WR[0],lu.WR[1],lu.TE[0],lu.RB[0]];let left=py;recs.forEach((p,i)=>{const y=i===3?left:Math.round(left*rnd(0.25,0.45));left-=y;add(p,'wyd',Math.max(0,y));add(p,'rec',ri(1,6));});
 add(lu.RB[0],'ryd',ry);add(lu.RB[0],'car',ri(10,22));
 for(let i=0;i<tds;i++){const r=Math.random();if(r<0.6){add(qb,'ptd',1);add(pick(recs.filter(Boolean))||null,'wtd',1);}else add(lu.RB[0],'rtd',1);}
 if(Math.random()<0.4)add(qb,'pint',1);
 for(const k of['DL','LB','DB'])for(const p of lu[k]){add(p,'tkl',ri(1,6));if(k==='DL'&&Math.random()<0.4)add(p,'sck',1);if(k==='DB'&&Math.random()<0.15)add(p,'dint',1);}
 const K=lu.K[0];const fg=Math.floor((us%7)/3);add(K,'fga',fg);add(K,'fgm',fg);
 for(const id in ps){const s=ps[id];s.xp=Math.round((s.pyd||0)*0.1+(s.ryd||0)*0.18+(s.wyd||0)*0.14+((s.ptd||0)+(s.rtd||0)+(s.wtd||0))*8+(s.tkl||0)*2+(s.sck||0)*6+(s.dint||0)*8+(s.fgm||0)*5);}
 void th;return ps;
}

/* ---------- player-for-player trades with any team ----------
   Value grows faster than linearly with rating so one star is worth more than two
   average players. Young players with high potential are worth more, old ones less.
   The other team says yes when what it gets is worth a bit more than what it gives,
   and it won't give up its only player at a position without getting one back. */
function trVal(p){if(!p)return 0;const o=ovr(p)+(p.age<=26?Math.max(0,p.pot-ovr(p))*0.4:0)-Math.max(0,p.age-29)*0.45;return Math.pow(Math.max(0.5,o-2),2.2);}
const PICK_V=[Math.pow(5.1,2.2),Math.pow(3.9,2.2),Math.pow(2.8,2.2)];
/* Other teams' draft picks for this season (everyone starts with one per round; trades move them). */
function aiPk(t){L.aiPicks=L.aiPicks||{};return L.aiPicks[t]||(L.aiPicks[t]=[1,1,1]);}
function trEval(t,give,get,pk,gpk){gpk=gpk||[0,0,0];
 const G=give.map(P).filter(Boolean),R=get.map(P).filter(Boolean);
 let vIn=G.reduce((s,p)=>s+trVal(p),0)+pk.reduce((s,n,i)=>s+n*PICK_V[i],0),vOut=0;
 const theirs=rosterOf(t);
 for(const p of R){const left=theirs.filter(q=>q.pos===p.pos&&!get.includes(q.id)).length,back=G.filter(q=>q.pos===p.pos).length;vOut+=trVal(p)*(left===0&&back===0?1.45:1);}
 vOut+=gpk.reduce((s,n,i)=>s+n*PICK_V[i]*1.1,0);   /* they value their own picks a bit more */
 const need=vOut*1.08+(R.length||gpk.some(x=>x)?0.5:0);
 const myN=rosterOf(L.user).length-G.length+R.length,thN=theirs.length-R.length+G.length;
 const cap=capUsed(L.user)-G.reduce((s,p)=>s+p.sal,0)+R.reduce((s,p)=>s+p.sal,0);
 return{vIn,vOut,need,ratio:need>0?vIn/need:vIn>0?9:0,ok:vIn>=need&&(G.length+R.length+pk.reduce((a,b)=>a+b,0)+gpk.reduce((a,b)=>a+b,0))>0,myN,thN,cap,capOk:cap<=L.cap+0.01,rosOk:myN<=rmax()};
}

/* ---------- records book ----------
   Records set by players on the team you coach: single game, single season and career,
   plus team records. Game records come from games you play (not simmed ones). */
const REC_CATS=[['pyd','PASSING YARDS'],['ptd','PASSING TDS'],['cmp','COMPLETIONS'],['ryd','RUSHING YARDS'],['rtd','RUSHING TDS'],['rec','RECEPTIONS'],['wyd','RECEIVING YARDS'],['wtd','RECEIVING TDS'],['tkl','TACKLES'],['sck','SACKS'],['dint','INTERCEPTIONS'],['fgm','FIELD GOALS MADE']];
const TEAM_RECS=[['pts','MOST POINTS IN A GAME'],['marg','BIGGEST WIN MARGIN'],['wins','MOST WINS IN A SEASON'],['pf','MOST POINTS IN A SEASON'],['strk','LONGEST WIN STREAK']];
function recBook(){if(!L.records)L.records={game:{},season:{},career:{},team:{}};return L.records;}
/* 0 = no change, 1 = set (first mark, or the holder extending his own), 2 = broke an existing record. */
function recTry(scope,k,v,p,extra){
 if(!(v>0))return 0;const B=recBook()[scope],cur=B[k];
 if(cur&&(cur.v>v||(cur.v===v&&(!p||cur.id!==p.id))))return 0;
 if(cur&&cur.v===v)return 0;
 const same=cur&&p&&cur.id===p.id&&scope!=='game';
 B[k]=Object.assign({v,id:p?p.id:null,name:p?fullname(p):'',pos:p?p.pos:'',team:abbr(L.user),year:L.year},extra||{});
 return cur&&!same?2:1;
}
function recGameCheck(R,res){
 const out=[];if(R.simmed)return out;
 for(const p of rosterOf(L.user)){const s=R.ps[p.id];if(!s)continue;for(const[k,lab]of REC_CATS)if(recTry('game',k,s[k]||0,p)===2)out.push(pname(p).toUpperCase()+' '+(s[k])+' '+lab);}
 const us=R.sc[0],th=R.sc[1],T0=recBook().team;
 if(!T0.pts||us>T0.pts.v){const had=!!T0.pts;T0.pts={v:us,team:abbr(L.user),year:L.year,vs:abbr(R.op)};if(had)out.push('TEAM '+us+' POINTS');}
 if(us>th&&(!T0.marg||us-th>T0.marg.v)){T0.marg={v:us-th,team:abbr(L.user),year:L.year,vs:abbr(R.op),sc:us+'-'+th};}
 const st=L.teams[L.user].strk;if(st>0&&(!T0.strk||st>T0.strk.v))T0.strk={v:st,team:abbr(L.user),year:L.year};
 void res;return out;
}
/* Season and career records are refreshed from current stat lines (season so far). */
function recLiveCheck(announce){
 const out=[];
 for(const p of rosterOf(L.user)){for(const[k,lab]of REC_CATS){
  if(recTry('season',k,p.s[k]||0,p)===2&&announce)out.push(pname(p).toUpperCase()+' '+p.s[k]+' '+lab+' (SEASON)');
  const c=(p.c[k]||0)+(p.s[k]||0);if(recTry('career',k,c,p)===2&&announce)out.push(pname(p).toUpperCase()+' '+c+' '+lab+' (CAREER)');}}
 const R=L.teams[L.user],T0=recBook().team;
 if(R.w&&(!T0.wins||R.w>T0.wins.v))T0.wins={v:R.w,team:abbr(L.user),year:L.year,rec:R.w+'-'+R.l+(R.t?'-'+R.t:'')};
 if(R.pf&&(!T0.pf||R.pf>T0.pf.v))T0.pf={v:R.pf,team:abbr(L.user),year:L.year};
 return out;
}
SCR.records=()=>{
 recLiveCheck(false);const tab=UI.sub.tab||'game',B=recBook();
 const tabs=[['game','SINGLE GAME'],['season','SEASON'],['career','CAREER'],['team','TEAM']].map(([k,l])=>`<span class="chip ${tab===k?'on':''}" data-a="recTab" data-k="${k}">${l}</span>`).join('');
 let rows;
 if(tab==='team')rows=TEAM_RECS.map(([k,l])=>{const r=B.team[k];return`<tr><td>${l}</td><td class="r yl">${r?r.v:'-'}</td><td>${r?r.team+' '+r.year+(r.vs?' VS '+r.vs:'')+(r.rec?' ('+r.rec+')':'')+(r.sc?' ('+r.sc+')':''):'<span class="dim">NOT SET</span>'}</td></tr>`;}).join('');
 else rows=REC_CATS.map(([k,l])=>{const r=B[tab][k];const live=r&&r.id!=null&&P(r.id)&&P(r.id).team===L.user;return`<tr><td>${l}</td><td class="r yl">${r?r.v:'-'}</td><td>${r?esc(r.name.toUpperCase())+' <span class="dim">'+r.pos+' · '+r.team+' '+r.year+'</span>'+(live&&tab!=='game'?' <span class="grt">ACTIVE</span>':''):'<span class="dim">NOT SET</span>'}</td></tr>`;}).join('');
 return`<div class="screen"><div class="row"><button class="bt ico" data-a="go" data-s="hof">${ICON.back}</button><div class="grow">${ttl('RECORDS')}</div><div style="width:32px"></div></div>

 <div class="box grow scroll" style="padding:4px 8px"><table class="tbl"><tr><th>RECORD</th><th class="r">MARK</th><th>HELD BY</th></tr>${rows}</table></div>
 </div>`;};

ACT.nflSync2=async()=>{modal(`<div class="mp" style="width:300px;align-items:center;text-align:center">${ttl('UPDATING…',true)}<div class="s7 dim">LOADING CURRENT ROSTERS</div></div>`);
 try{const data=await fetchNFLRosterFresh();NFL_POWER=data.power||{};L.nflPower=NFL_POWER;

function logoFile(inp){const f=inp&&inp.files&&inp.files[0];if(!f)return;const url=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{const S=160,c=document.createElement('canvas');c.width=S;c.height=S;const g=c.getContext('2d');const k=Math.min(S/im.naturalWidth,S/im.naturalHeight),w=im.naturalWidth*k,h=im.naturalHeight*k;
  g.imageSmoothingQuality='high';g.drawImage(im,(S-w)/2,(S-h)/2,w,h);URL.revokeObjectURL(url);UI.edit.logo=c.toDataURL('image/png');modal(editHTML());};
 im.onerror=()=>{URL.revokeObjectURL(url);toast('COULD NOT OPEN THAT PHOTO');};im.src=url;}
/* remove a plain background: flood-fill from the edges with the corner colour, then trim and re-centre */
function cutLogoBg(src){return new Promise(res=>{const im=new Image();im.onload=()=>{const S=im.naturalWidth,H=im.naturalHeight,c=document.createElement('canvas');c.width=S;c.height=H;const g=c.getContext('2d');g.drawImage(im,0,0);
 const D=g.getImageData(0,0,S,H),d=D.data,at=(x,y)=>(y*S+x)*4;
 /* background colour = the corners of the photo itself (inside any transparent letterbox) */
 let bx0=S,by0=H,bx1=-1,by1=-1;for(let y=0;y<H;y++)for(let x=0;x<S;x++)if(d[at(x,y)+3]>10){if(x<bx0)bx0=x;if(x>bx1)bx1=x;if(y<by0)by0=y;if(y>by1)by1=y;}
 if(bx1<0)return res(null);const cs=[[bx0,by0],[bx1,by0],[bx0,by1],[bx1,by1],[(bx0+bx1)>>1,by0],[(bx0+bx1)>>1,by1],[bx0,(by0+by1)>>1],[bx1,(by0+by1)>>1]].map(([x,y])=>at(x,y)).filter(i=>d[i+3]>10);
 if(!cs.length)return res(null);const bg=[0,1,2].map(k=>cs.reduce((a,i)=>a+d[i+k],0)/cs.length),tol=62;
 const near=i=>d[i+3]>10&&Math.abs(d[i]-bg[0])+Math.abs(d[i+1]-bg[1])+Math.abs(d[i+2]-bg[2])<tol;
 const seen=new Uint8Array(S*H),st=[];for(let x=0;x<S;x++){st.push(x,0,x,H-1);}for(let y=0;y<H;y++){st.push(0,y,S-1,y);}
 while(st.length){const y=st.pop(),x=st.pop();if(x<0||y<0||x>=S||y>=H)continue;const p=y*S+x;if(seen[p])continue;seen[p]=1;const i=p*4;if(d[i+3]<=10||near(i)){d[i+3]=0;st.push(x+1,y,x-1,y,x,y+1,x,y-1);}}
 g.putImageData(D,0,0);let x0=S,y0=H,x1=-1,y1=-1;for(let y=0;y<H;y++)for(let x=0;x<S;x++)if(d[at(x,y)+3]>10){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
 if(x1<0)return res(null);const w=x1-x0+1,h=y1-y0+1,o=document.createElement('canvas');o.width=160;o.height=160;const k=Math.min(152/w,152/h);o.getContext('2d').drawImage(c,x0,y0,w,h,(160-w*k)/2,(160-h*k)/2,w*k,h*k);res(o.toDataURL('image/png'));};im.onerror=()=>res(null);im.src=src;});}

 const pk=D.rounds.join(' - ');

 <div class="row ctr" style="gap:3px">${['ALL',...POSL].map(x=>`<span class="chip ${f===x?'on':''}" data-a="dff" data-f="${x}">${x}</span>`).join('')}</div>

  <div class="col" style="width:178px;gap:10px">
   ${box('YOUR TEAM '+rosterOf(L.user).length+'/'+rmax(),`<div class="col s7 scroll" style="gap:3px;max-height:96px">${mine}</div>`,'padding:10px 6px 5px')}

 {w:'win',q:'YOUR OFFENSE LOOKED UNSTOPPABLE. WHAT IS THE SECRET?',a:[['HARD WORK IN PRACTICE.',()=>{for(const p of rosterOf(L.user))gainXP(p,10);},'+10 XP TO EVERYONE'],['WE HAVE THE BEST PLAYERS.',()=>teamMorAdd(6),'+ TEAM MORALE'],['GREAT COACHING, OBVIOUSLY.',()=>{fanAdd(4);teamMorAdd(-3);},'+ FANS, - MORALE']]},
 {w:'loss',pl:1,q:'SHOULD {P} BE WORRIED ABOUT HIS JOB?',a:[['NO. I FULLY TRUST HIM.',p=>{p.mor=clamp(p.mor+15,0,100);},'+ {P} MORALE'],['EVERYONE IS BEING EVALUATED.',p=>{p.mor=clamp(p.mor-8,0,100);teamMorAdd(2);},'- {P} MORALE'],['NEXT QUESTION.',()=>fanAdd(-2),'- FANS']]},

const teamMorAdd=v=>{for(const p of rosterOf(L.user))p.mor=clamp(p.mor+v,0,100);};
const fanAdd=v=>{L.fan=clamp(L.fan+v,2,100);};
function gainXP(p,x){const side=sideOf(p.pos),co=side==='O'?L.oc:side==='D'?L.dc:null;const mult=1+0.12*(L.fac.train-1)+(co?co.stars*0.08:0);p.xp+=Math.round(x*mult);let up=0;while(p.xp>=xpNeed(p.lvl)&&p.lvl<30){p.xp-=xpNeed(p.lvl);p.lvl++;if(!isMaxed(p)){p.sp++;up++;}}if(isMaxed(p))p.sp=0;return up;}
function gameRating(p,s,res){
 const pos=p.pos;let r=5;
 if(pos==='QB')r=3+(s.pyd||0)/70+(s.ptd||0)*1.1-(s.pint||0)*1.4+(s.ryd||0)/40;
 else if(pos==='RB')r=3+((s.ryd||0)+(s.wyd||0))/32+((s.rtd||0)+(s.wtd||0))*1.2-(s.fum||0)*2;
 else if(pos==='WR'||pos==='TE')r=3+(s.wyd||0)/26+(s.wtd||0)*1.3+(s.rec||0)*0.2-(s.fum||0)*2;
 else if(pos==='K')r=4+(s.fgm||0)*1.2-((s.fga||0)-(s.fgm||0))*1.5;
 else if(pos==='OL')r=5+(res==='W'?1.5:res==='L'?-1:0)+rnd(-1,1.5);
 else r=3+(s.tkl||0)*0.6+(s.sck||0)*1.6+(s.dint||0)*2.2;
 return clamp(Math.round(r),1,10);
}
function postGame(g,R){
 const home=g.h===L.user,us=R.sc[0],th=R.sc[1];
 finishGame(g,home?us:th,home?th:us);
 const res=us>th?'W':us<th?'L':'T',lu=starterSet(L.user),rows=[];
 for(const p of rosterOf(L.user)){
  const ps=R.ps[p.id]||{},played=lu.has(p.id);
  let x=(ps.xp||0)+(played?14:5)+(res==='W'?8:0);
  for(const k in ps)if(k!=='xp'&&p.s[k]!=null)p.s[k]+=ps[k];
  if(played){p.s.gp++;p.cond=clamp(p.cond-rnd(8,18)*(1.35-attr(p,'stm')*0.07),20,100);}
  const xpb=p.xp,lv0=p.lvl,up=gainXP(p,x);void xpb;
  p.mor=clamp(p.mor+(res==='W'?3:res==='L'?-3:0),0,100);
  let inj=false;if(played&&Math.random()<0.022+(p.cond<50?0.03:0)-L.fac.rehab*0.0015){p.inj=Math.max(1,ri(1,4)-Math.floor(L.fac.rehab/4));inj=true;news(fullname(p)+' ('+p.pos+') is injured for '+p.inj+' week'+(p.inj>1?'s':'')+'.');}
  rows.push({id:p.id,pos:p.pos,nm:pname(p).toUpperCase(),mor:p.mor,cnd:Math.round(p.cond),yds:(ps.pyd||0)+(ps.ryd||0)+(ps.wyd||0),tds:(ps.ptd||0)+(ps.rtd||0)+(ps.wtd||0),tck:ps.tkl||0,is:p.pos==='QB'?(ps.pint||0)+'/'+(ps.sacked||0):['DL','LB','DB'].includes(p.pos)?(ps.dint||0)+'/'+(ps.sck||0):'-',fum:ps.fum||0,rat:played?gameRating(p,ps,res):'-',xp:Math.round(x*(1+0.12*(L.fac.train-1))),up:up>0,inj,played});
 }
 rows.sort((a,b)=>POSL.indexOf(a.pos)-POSL.indexOf(b.pos));
 let recs=[];try{recs=[...recGameCheck(R,res),...recLiveCheck(true)].slice(0,6);for(const r of recs)news('NEW RECORD: '+r);}catch(e){console.error(e);}
 let cc=(res==='W'?2:res==='T'?1:0)+Math.floor(L.fac.stad/4)+(L.fan>=80?1:0)+(L.phase==='PO'&&res==='W'?2:0);   /* coins are scarce: ~2-3 per win */
 if(R.simmed)cc=Math.max(0,cc-1);
 L.cc+=cc;fanAdd((res==='W'?3:res==='L'?-3:0)*(1+0.08*(L.fac.stad-1)));
 if(L.settings.diff===3&&!R.simmed){const m=us-th;L.dyn=clamp(L.dyn+(m>=14?2:m>0?1:m<=-14?-2:m<0?-1:0),1,20);}
 news((res==='W'?'WIN':res==='L'?'LOSS':'TIE')+' '+(home?'vs ':'at ')+abbr(R.op)+' '+us+'-'+th+'.');
 let press=-1,pp=null;
 if(!R.simmed&&Math.random()<0.7){const pool=PRESS.map((q,i)=>i).filter(i=>PRESS[i].w==='any'||(PRESS[i].w==='win'&&res==='W')||(PRESS[i].w==='loss'&&res==='L'));press=pick(pool);if(PRESS[press].pl){const c=rows.filter(r=>r.played).sort((a,b)=>(b.rat==='-'?0:b.rat)-(a.rat==='-'?0:a.rat)).slice(0,4);pp=c.length?pick(c).id:null;if(!pp)press=-1;}}
 const lab=L.phase==='REG'?'END OF WEEK '+L.week:'END OF '+(g.conf==='SB'?CFG.champ:ROUNDS[L.po.cur]);
 L.lastPost={lab,us,th,res,op:R.op,home,rows,cc,press,pp,simmed:!!R.simmed,recs};
 save();go('endweek');
}

function startFireworks(){

 const cols=['#ffe94a','#7dff8a','#ff6ad5','#6ad6ff','#ffffff','#ff8a3a'];
 const tick=()=>{if(!FW||FW.c!==c||!document.body.contains(c))return;
  if(Math.random()<0.08){const x=rnd(30,290),y=rnd(20,110),col=pick(cols);for(let i=0;i<40;i++){const a=Math.random()*Math.PI*2,s=rnd(10,45);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(0.8,1.6),col});}}
  if(Math.random()<0.3)parts.push({x:rnd(0,320),y:rnd(0,180),vx:0,vy:0,l:0.6,col:'#9fc4ff'});
  g.fillStyle='rgba(42,93,240,.35)';g.fillRect(0,0,320,180);

  for(let i=parts.length-1;i>=0;i--)if(parts[i].l<=0)parts.splice(i,1);
  requestAnimationFrame(tick);};
 sfx('td');tick();
}

function buildEzStands(only){
 /* End-zone stands, joined to the sideline stands as one L-shaped bowl: the top band uses the

  g.fillStyle='#161830';g.fillRect(0,0,W,HH);
  let seed=29;const R=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const misc=['#e8e8e8','#c04040','#3a6ac0','#d0b040','#40a060'];
  const fan=r=>r<0.55?hc.c1:r<0.75?hc.c2:r<0.85?oc.c1:misc[Math.floor(R()*5)];
  // corner/top band: rows exactly like the sideline stands so they continue straight across
  for(let row=0;row<4;row++){const y=2+row*5;g.fillStyle=row%2?'#202346':'#262a55';g.fillRect(0,y+3,W,2);
   for(let i=(row%2)*2;i<W;i+=4){const r=R(),r3=R();if(r<0.08)continue;const up=f===1&&((i*7+row*13)%10)<4?1:0;

  // end-zone section below it: seat columns facing the field
  for(let col=0;col*6<W-14;col++){const x=W-14-col*6;g.fillStyle=col%2?'#202346':'#262a55';g.fillRect(x-2,TH,2,HH-TH);
   for(let y=TH+(col%2)*2;y<HH;y+=4){const r=R(),r3=R();if(r<0.08)continue;const up=f===1&&((y*7+col*13)%10)<4?1:0;

function ctlTap(){

  if(dl<2.2){if(!(f.jump>0)){f.jump=0.45;f.reach=0.3;sfx('juke');}return;}
  if(dl<11&&!f.eng){f.diveQ=true;return;}}   /* break on the ball and lay out for it at the right moment (ballDive) */

 if(c&&d2(f,c)<2.8&&!f.eng){const lead=0.3,px=c.x+c.vx*lead,py=c.y+c.vy*lead,dp=Math.hypot(px-f.x,py-f.y)||1,T=0.34,v=Math.min(dp/T,f.spd*1.45);
  f.dove=true;f.dive=T;f.dv=T;f.vx=(px-f.x)/dp*v;f.vy=(py-f.y)/dp*v;f.dtk=false;sfx('juke');return;}
 if(f.eng)return;
 {const sp=Math.hypot(f.vx,f.vy),T=0.38;let ux,uy;if(sp>0.8){ux=f.vx/sp;uy=f.vy/sp;}else{const t=c||M.qb;if(t){const d=Math.hypot(t.x-f.x,t.y-f.y)||1;ux=(t.x-f.x)/d;uy=(t.y-f.y)/d;}else{ux=-1;uy=0;}}

}

function aiQB(q,dt){

 {const u=M.ctl;if(u&&!(u.stun>0)&&!(u.down>0)){const du=d2(u,q);if(du<1.8)return;   /* you're on him: no throw */
  /* closing in fast: a quick QB may still get it off (once), otherwise he holds it and goes down */
  if(du<3.2&&!S.hurry){S.hurry=true;if(Math.random()>0.25+A(q,'acc')*0.03){S.frozen=true;}}if(S.frozen&&du<3.2)return;}}   /* your defender has him wrapped up: no throw, it's a sack */

 if(S.t>0&&press>2.0)return;

  if(r.x>119.3)continue;   /* already out the back of the end zone */
  const T=Math.hypot(r.x-q.x,r.y-q.y)/20+0.25,px=Math.min(r.x+r.vx*T,118.3),py=clamp(r.y+r.vy*T,1.5,51.8);if(px<M.los-1.5)continue;   /* lead him, but never past the end line or sideline */

  const sc=open*1.25+clamp(gain,-3,30)*0.1+(px>=M.fdX?1.1:0)+(px>=110?2:0)+rnd(-0.8,0.8);
  if(!best||sc>best.sc)best={r,px,py,open,sc};}

 if(best&&(best.open>=2.3||(press<1.6&&best.open>=1.2)||(late&&best.open>=1.0)))return aiThrow(q,best.px,best.py,best.open);

function aiThrow(q,tx,ty,open,away){

 let best=null;const gx0=wx(tx)-wx(q.x),gy0=wy(ty)-wy(q.y),l0=Math.hypot(gx0,gy0)||1;
 for(let pull=PASS.PULL_MIN;pull<=PASS.PULL_MAX+10;pull+=3){const a={sx:320,sy:200,cx:320-gx0/l0*pull,cy:200-gy0/l0*pull};const ai=aimInfo(a);if(ai.run)continue;const e=Math.hypot(ai.tx-tx,ai.ty-ty);if(!best||e<best.e)best={e,ai};}

/* ---------- diving tackles ----------
   A defender who is close but can't quite get his hands on a ball carrier

   One dive per defender per play; a whiff leaves him on the turf. */
function maybeDefDive(f,dt){
 const c=M.carrier;if(!c||M.phase!=='live'||f.dove||f.eng||f.shed>0||c.dive>0||c.down>0||c.hurdle>0)return;
 if(M.play==='run'&&M.pt<0.5)return;
 const d=d2(f,c);if(d<0.9||d>2.4)return;
 const lead=0.3,px=c.x+c.vx*lead,py=c.y+c.vy*lead,dp=Math.hypot(px-f.x,py-f.y);
 const sp=Math.hypot(c.vx,c.vy);if(sp<2.5)return;                 // only on a moving runner
 const closing=((c.x-f.x)*(f.vx-c.vx)+(c.y-f.y)*(f.vy-c.vy))/(d||1); // > 0 means he's gaining
 if(closing>2.2&&d<2)return;                                        // he'll get there on foot
 if(Math.random()>dt*(2.2+A(f,'tkl')*0.15))return;                  // reaction / decision
 const T=0.34,v=Math.min(dp/T,f.spd*1.45);
 f.dove=true;f.dive=T;f.dv=T;f.vx=(px-f.x)/(dp||1)*v;f.vy=(py-f.y)/(dp||1)*v;f.dtk=false;sfx('juke');

function stepDefDive(f,dt){
 f.dive-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;const c=M.carrier;
 if(c&&!f.dtk&&!(c.dive>0)&&!(c.hurdle>0)&&!(c.down>0)&&d2(f,c)<1.05){f.dtk=true;
  const pt=clamp(0.62+(A(f,'tkl')-A(c,'str'))*0.03+(c.jk>0?-0.25:0)+(c.role==='QB'&&!M.scramble?0.1:0)+(M.def?0.1:0),0.3,0.9);
  if(Math.random()<pt){c.down=1;M.shake=4;sfx('hit');pop('DIVING TACKLE!',c.x,c.y,'#ff8a8a');creditD(f,'tkl',4);endPlay('tackle',c.x+0.3,c.y);return true;}
  pop('MISSED!',c.x,c.y,'#7fffd4');hurdle(c);xpG(c.pl,2);}
 if(!c&&!f.dtk&&M.play==='pass'&&!M.thrown&&M.qb&&!(M.qb.down>0)&&d2(f,M.qb)<1.15){const q=M.qb;f.dtk=true;
  if(f.side==='D'&&(M.def||Math.random()<0.7)){M.aim=null;q.down=1;M.shake=5;sfx('hit');cr(q.pl,'sacked',1);pop('SACK!',q.x,q.y,'#ff8a8a');creditD(f,'sck',8);creditD(f,'tkl',0);endPlay('sack',q.x,q.y);return true;}}

function tackleAttempt(d,c){

 if(Math.random()<pb){d.stun=0.9;d.down=0.9;c.vx*=0.55;c.vy*=0.55;c.slow=0.3;pop('BROKEN TACKLE!',c.x,c.y,'#7fffd4');M.shake=3;sfx('hit');xpG(c.pl,3);return;}

 if(stick){M.shake=10;sfx('hit');pop('HIT STICK!',c.x,c.y,'#ff5c5c');if(Math.random()<0.5)popHelmet(c,c.x>=d.x?1:-1);c.vx*=0.2;c.vy*=0.2;}

/* ---------- fumbles ----------

   Whoever gets to it first can scoop it (or bobble it). If your guy comes up with it

function startFumble(c,label){
 M.fum={t:0,c,x0:c.x,label,tries:new Map()};M.carrier=null;M.ball=null;M.aim=null;M.steer=null;M.input=null;M.comp=M.comp||null;
 c.down=Math.max(c.down||0,0.9);if(!M.loose)looseBall(c.x,c.y,1,rnd(-2,3),rnd(-4,4),rnd(4,7));
 for(const f of M.O){f.blk=null;f.route=null;}for(const f of M.D){f.eng=null;f.hawk=false;}
 banner(label||'FUMBLE!','BALL IS LOOSE!','#ff8a8a',1.0);crowd(1.1,.1);M.slowmo=Math.max(M.slowmo||0,0.35);}
function upFumble(dt){
 const F=M.fum,b=M.loose;M.pt+=dt;M.clock-=dt;F.t+=dt;

 // out of bounds / out of the end zones

 if(b.y<0||b.y>53.33){const ox=clamp(Math.min(b.x,F.x0),0.5,119.5);return fumOver(ox<10?'safety':'oob',ox,clamp(b.y,0,53.33));}

 for(const f of all){tickF(f,dt);
  if(f.dive>0){f.dive-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.dive<=0){f.dive=0;f.down=0.7;f.vx=f.vy=0;}continue;}
  if(f.stun>0||f.down>0)continue;
  const lead=Math.min(0.5,Math.hypot(b.x-f.x,b.y-f.y)/Math.max(f.spd,1)),tx=b.x+b.vx*lead,ty=b.y+b.vy*lead;
  const dd=Math.hypot(tx-f.x,ty-f.y);

  if(b.z<0.6&&dd>0.9&&dd<2.4&&Math.random()<dt*2.5){const v=Math.min(dd/0.3,f.spd*1.8);f.dive=0.3;f.dv=0.3;f.vx=(tx-f.x)/dd*v;f.vy=(ty-f.y)/dd*v;continue;}
  steer(f,tx,ty,f.spd,f.acc||30,dt);}
 separate(M.O);separate(M.D);
 for(const f of all){f.y=clamp(f.y,-1,54.3);f.x=clamp(f.x,-2,121);}
 if(F.t<0.25||b.z>1.4)return;   // it has to come down first
 // nearest player in reach gets a shot at it (one try every ~0.3s each)
 let best=null,bd=1.0;for(const f of all){if(f.stun>0||(f.down>0&&!(f.dive>0)))continue;const d=Math.hypot(f.x-b.x,f.y-b.y);if(d<bd){bd=d;best=f;}}
 if(!best)return;const last=F.tries.get(best)||-9;if(F.t-last<0.3)return;F.tries.set(best,F.t);

 if(Math.random()<clamp(0.5+hands*0.04+(best.dive>0?0.15:0)-(best.side==='O'?0.2:0),0.3,0.9))return fumRecover(best);   /* the defense is usually facing the ball, the offense is scrambling back for it */

function fumOver(kind,x,y){const F=M.fum;M.fum=null;M.loose=null;if(kind==='oob'){M.carrier=F.c;return endPlay('oob',x,y,'FUMBLE OUT OF BOUNDS');}return endPlay(kind,x,y);}

/* Play call from the playbook. Pass plays redraw the routes (snap by pulling back as usual);
   run plays snap right away. */

/* ---------- main loop ---------- */
let lastT=performance.now();
function loop(now){
 /* Real-time even on slow devices: a long frame is split into small steps instead of being capped
    (capping is what made the game run in slow motion when the iPad couldn't hold 30fps). */
 const fdt=Math.min(0.1,Math.max(0,(now-lastT)/1000));lastT=now;const ns=Math.max(1,Math.ceil(fdt/0.034)),dt=fdt/ns;
 if(UI.scr==='game'&&M){try{if(!M.paused)for(let i=0;i<ns&&M&&!M.paused&&UI.scr==='game';i++)step(dt);if(M){draw();hud();}}catch(err){console.error(err);}}
 requestAnimationFrame(loop);
}

const COLLEGE_MAP = Object.fromEntries(COLLEGE_TEAMS.map(t=>[t.id,t]));
const COLLEGE_NFL_SLOTS = {13:TEAMS[13],30:TEAMS[30]};
const COLLEGE_CACHE = new Map();
const COLLEGE_STATE={youId:'ohio-state',oppId:'michigan',home:true,diff:1,mode:'off',qlen:180,dynSize:12,uU:0,uO:1,choose:'you',conf:'ALL',search:'',last:''};
const COLLEGE_CONFS=['ALL',...new Set(COLLEGE_TEAMS.map(t=>t.conference))];
let COLLEGE_INDEX_LOADING=null;
function collegeRefreshIndex(){
 if(COLLEGE_INDEX_LOADING)return COLLEGE_INDEX_LOADING;
 COLLEGE_INDEX_LOADING=fetch('college/teams.json',{cache:'no-cache'}).then(r=>{
  if(!r.ok)throw new Error('Index not available');return r.json();
 }).then(data=>{
  if(!data||data.season!==2026||!Array.isArray(data.teams)||data.teams.length!==138)return;
  for(const updated of data.teams){const target=COLLEGE_MAP[updated.id];if(target)Object.assign(target,updated);}
  if(UI.scr==='college'||UI.scr==='collegeTeams')render();
 }).catch(err=>console.warn('College metadata fallback (built-in list):',err.message));
 return COLLEGE_INDEX_LOADING;
}

function collegeClearLogo(t){
 delete NFL_FIELD_LOGOS[t];NFL_FIELD_LOGO_FAILED.delete(t);NFL_FIELD_LOGO_PENDING.delete(t);
 for(const k in LOGO_MINI)if(k.startsWith(t+'|'))delete LOGO_MINI[k];
 if(typeof SPR_CACHE!=='undefined'&&SPR_CACHE&&SPR_CACHE.clear)SPR_CACHE.clear();
 if(M&&M.fieldCvs)M.fieldCvs=[];
}
function collegeRestoreTeams(){
 for(const t of [13,30]){if(TEAMS[t]!==COLLEGE_NFL_SLOTS[t]){TEAMS[t]=COLLEGE_NFL_SLOTS[t];collegeClearLogo(t);}}
}
function collegeSetTeams(y,o){
 collegeRestoreTeams();
 for(const [index,col] of [[13,y],[30,o]]){
  const base=COLLEGE_NFL_SLOTS[index];
  TEAMS[index]={...base,city:col.school,nickname:col.mascot,
   name:col.school+' '+col.mascot,city0:col.school,nick0:col.mascot,
   abbr:col.abbr,c1:col.c1,c2:col.c2,conf:col.conference,
   college:true,collegeLogo:col.logo};
  collegeClearLogo(index);
 }
}
function collegeBadge(t,size=38){
 const w=Math.max(18,size),font=size>=65?11:9;
 const logo=esc(t.logo),short=esc(t.abbr);
 return `<div style="background:#f1f3f7;width:${w}px;height:${w}px;flex:none;border:2px solid ${esc(t.c1)};display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border-radius:5px">
  <b style="font-size:${font}px;color:#fff;text-shadow:1px 1px #000;visibility:hidden">${short}</b>
  <img src="${logo}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain" onerror="this.previousElementSibling.style.visibility='visible';this.remove()">
 </div>`;
}

 if(![2025,2026,'2025-26'].includes(data.season)||!Array.isArray(data.players)||!data.players.length)
  throw new Error('The '+team.school+' roster file has no supported historical or 2026 players.');

 return ((avg-5.7)*.22)+((CD.coaches.OC?.stars||0)+(CD.coaches.DC?.stars||0))*.085+(CD.facilities.training-1)*.07 + (CD.fans-50)*.005;

 CD.funds+=revenue;CD.fans=clamp(CD.fans+(win?ri(1,4):-ri(1,3)),10,100);

 const active=colMgmtActivePlayers().filter(p=>!p.bench);

 for(const role of ['QB','RB','WR','LB','DB','DL'])statpick(role,score);

ACT.colMgmtRelease=d=>{const arr=colMgmtActivePlayers();if(arr.length<=10)return toast('MINIMUM ROSTER IS 10 PLAYERS');const i=arr.findIndex(x=>x.key===d.key);if(i<0)return;const [p]=arr.splice(i,1);colMgmtNews('RELEASED '+p.fn+' '+p.ln);CD.tab='roster';colDynSave();UI.modal=null;render();};
ACT.colMgmtRenameAsk=d=>{const p=colMgmtActivePlayers().find(x=>x.key===d.key);if(!p)return;modal(`<div class="mp" style="width:400px">${ttl('EDIT PLAYER',true)}<div class="s7 dim">CHANGES APPLY ONLY TO THIS FICTIONAL DYNASTY SAVE; A REAL PLAYER NAME WAS IMPORTED FROM THE HISTORICAL/2026 ROSTER.</div><input id="cpmF" class="txt" maxlength="32" value="${esc(p.fn)}" placeholder="FIRST NAME"><input id="cpmL" class="txt" maxlength="32" value="${esc(p.ln)}" placeholder="LAST NAME"><input id="cpmN" class="txt" type="number" min="0" max="99" value="${p.num}"><div class="row end"><button class="bt" data-a="close">CANCEL</button><button class="bt y" data-a="colMgmtRename" data-key="${esc(p.key)}">SAVE</button></div></div>`);};
ACT.colMgmtRename=d=>{const p=colMgmtActivePlayers().find(x=>x.key===d.key);if(!p)return;p.fn=($('#cpmF').value||p.fn).trim().slice(0,32);p.ln=($('#cpmL').value||p.ln).trim().slice(0,32);p.num=clamp(Number($('#cpmN').value)||0,0,99);p.real=false;p.edited=true;colDynSave();colMgmtPlayerModal(p.key);};
ACT.colMgmtFacility=d=>{const k=d.key;if(!COL_MGMT_FACS[k])return;const lv=CD.facilities[k],cost=7+lv*6;if(lv>=10||!colMgmtSpend(cost))return;CD.facilities[k]++;colMgmtNews('UPGRADED '+k.toUpperCase()+' TO LEVEL '+CD.facilities[k]);colMgmtSave();};
ACT.colMgmtCap=()=>{if(!colMgmtSpend(20))return;CD.nilCap+=10;colMgmtSave();toast('NIL LIMIT RAISED TO '+CD.nilCap);};
ACT.colMgmtFans=()=>{if(!colMgmtSpend(12))return;CD.fans=clamp(CD.fans+9,0,100);colMgmtSave();};
ACT.colMgmtHire=d=>{const c=CD.staffMarket.find(x=>x.key===d.key);if(!c||!colMgmtSpend(c.cost))return;CD.coaches[c.role]={...c};CD.staffMarket=CD.staffMarket.filter(x=>x.key!==c.key);colMgmtNews('HIRED '+c.fn+' '+c.ln+' ('+c.role+')');colMgmtSave();};
ACT.colMgmtPortal=d=>{if(CD.phase!=='OFF')return;const p=colMgmtPortalOptions().find(x=>x.key===d.key);if(!p||CD.portalSigned.some(x=>x.key===p.key))return;if(CD.portalSigned.length>=3)return toast('MAX THREE PORTAL SIGNEES');if(colMgmtNILRoom()<p.nil)return toast('NOT ENOUGH NIL ROOM');if(!colMgmtSpend(p.cost))return;CD.portalSigned.push({...p});colMgmtNews('SIGNED TRANSFER '+p.fn+' '+p.ln);colMgmtSave();};
const colMgmtOldSign=ACT.colDynSign;
ACT.colDynSign=d=>{if(CD.phase!=='OFF')return toast('RECRUITING OPENS AFTER PLAYOFFS');const p=colDynRecruitOptions().find(x=>x.key===d.key);if(!p)return;const signed=CD.recruitsPicked.includes(d.key);if(!signed&&colMgmtNILRoom()<p.nil)return toast('NIL LIMIT REACHED');colMgmtOldSign(d);};
ACT.colMgmtSet=d=>{const s=CD.managementSettings;let v=d.value==='true'?true:d.value==='false'?false:isNaN(+d.value)?d.value:+d.value;s[d.key]=v;COLLEGE_STATE[d.key==='play'?'mode':d.key]=v;colMgmtSave();};
ACT.colMgmtBrand=()=>{CD.programName=($('#colMgmtName')?.value||'').trim().slice(0,25)||null;CD.programC1=$('#colMgmtPrimary')?.value||null;CD.programC2=$('#colMgmtSecondary')?.value||null;colMgmtSave();toast('CUSTOM PROGRAM DETAILS SAVED');};
ACT.colMgmtQuit=()=>{colDynSave();ACT.colDynExit();};
ACT.colMgmtJobs=()=>{if(CD.phase!=='OFF')return toast('WAIT UNTIL OFFSEASON');const offers=COLLEGE_TEAMS.filter(t=>t.id!==CD.school&&Math.abs((CD.power[t.id]||5)-(CD.power[CD.school]||5))<2.0).sort((a,b)=>colDynHash(a.id+CD.year)-colDynHash(b.id+CD.year)).slice(0,5);
 modal(`<div class="mp" style="width:480px">${ttl('COACHING JOBS',true)}<div class="s7 dim">TAKE A NEW JOB NEXT SEASON. THE NEW SCHOOL MUST HAVE A ROSTER FILE TO PLAY GAMES.</div>${offers.map(t=>`<div class="row" style="gap:8px"><span class="s7" style="flex:1">${esc(t.school.toUpperCase())}</span><span class="s7">POWER ${CD.power[t.id].toFixed(1)}</span><button class="chip" data-a="colMgmtJob" data-school="${esc(t.id)}">ACCEPT</button></div>`).join('')}<button class="bt" data-a="close">DECLINE / STAY</button></div>`);};
ACT.colMgmtJob=async d=>{const t=COLLEGE_MAP[d.school];if(!t)return;UI.modal=null;try{await colDynRoster(d.school);CD.school=d.school;CD.career.unshift({year:CD.year+1,school:d.school,action:'ACCEPTED HEAD COACH JOB'});CD.tab='schedule';colMgmtNews('NEW COACHING JOB AT '+t.school);colDynSave();render();toast('WELCOME TO '+t.school.toUpperCase());}catch(e){collegeError('Cannot accept job without roster file for '+t.school+'. '+e.message);}};
// Extend season/offseason lifecycle: incentives, staff deals, player hall of fame, portal and scholarships.
const colMgmtOldYear=colDynNewYear;
colDynNewYear=function(){if(!CD||CD.phase!=='OFF')return;colMgmtEnsure();
 const retiring=colMgmtActivePlayers().filter(p=>p.grade>=4&&colMgmtOvr(p)>=7.0);for(const p of retiring)CD.hof.unshift({name:p.fn+' '+p.ln,pos:p.pos,year:CD.year});CD.hof.length=Math.min(CD.hof.length,70);
 const transfers=CD.portalSigned||[];const previousFill=colDynFillRoster;
 colDynFillRoster=function(id,picks){return previousFill(id,id===CD.school?[...(picks||[]),...transfers]:(picks||[]));};
 try{colMgmtOldYear();}finally{colDynFillRoster=previousFill;}
 colMgmtEnsure();CD.funds+=20+Math.floor(CD.prestige/15);CD.portalPool=[];CD.portalSigned=[];CD.staffMarket=colMgmtStaffMarket();CD.scoutRemaining=3+Math.floor(CD.facilities.scouting/2);
 for(const role of ['OC','DC'])if(CD.coaches[role]){CD.coaches[role].years--;if(CD.coaches[role].years<=0){colMgmtNews(role+' COORDINATOR CONTRACT EXPIRED');CD.coaches[role]=null;}}
 for(const p of colMgmtActivePlayers())if(p.grade<=3){if(Math.random()<.2+(CD.facilities.training-1)*.04){const ks=POSDEF[p.pos].filter(k=>p.a[k]<10);if(ks.length)p.a[pick(ks)]++;}p.cond=100;p.mor=clamp(p.mor+10,0,100);}
 colMgmtNews('NEW SEASON · +PROGRAM FUNDS');colDynSave();go('collegeDynasty');};
// Add UI controls and training effects without disrupting other modes.
const colMgmtOldTrain=ACT.colDynTrain;
ACT.colDynTrain=d=>{const p=colMgmtActivePlayers().find(x=>x.key===d.key);if(!p)return;const prior=colMgmtOvr(p);colMgmtOldTrain(d);if(colMgmtOvr(p)>prior){p.xp+=25+(CD.facilities.training-1)*5;p.mor=clamp(p.mor+2,0,100);colDynSave();}};
const colMgmtOldPlay=ACT.colDynPlay;
ACT.colDynPlay=async()=>{if(CD){colMgmtEnsure();COLLEGE_STATE.diff=CD.managementSettings.diff;COLLEGE_STATE.qlen=CD.managementSettings.qlen;COLLEGE_STATE.mode=CD.managementSettings.play;}
 await colMgmtOldPlay();if(L&&L.collegeDynasty){for(const p of rosterOf(13)){const src=colMgmtActivePlayers().find(r=>r.fn===p.fn&&r.ln===p.ln);if(src){p.mor=src.mor;p.cond=src.cond;p.bench=src.bench;}}L.settings.replay=CD.managementSettings.replay;}}
const colMgmtOldNew=ACT.colDynNew;
ACT.colDynNew=async()=>{await colMgmtOldNew();if(CD){colMgmtEnsure();colDynSave();render();}};
const colMgmtOldContinue=ACT.colDynContinue;
ACT.colDynContinue=()=>{colMgmtOldContinue();if(CD){colMgmtEnsure();colDynSave();}};

go('title');
requestAnimationFrame(loop);
</script>
