<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f63e6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Retro Football</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bl:#2f63e6;--bl2:#2856d4;--bl3:#1f45ad;--nv:#13286e;--yl:#e3d915;--yl2:#fff36b;--rd:#e8423a;--gr:#3fd04f;--wh:#fff;--dk:#20222e;--dk2:#4d5068;--cy:#7fd0ff;--tx:#fff;--dim:#b7c8ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;color:var(--tx);font-size:8px;line-height:1.5}
#root{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:640px;height:360px;flex:none;background:var(--bl);overflow:hidden;transform-origin:center center}
#lg{position:absolute;left:0;top:0;width:640px;height:360px;display:none;pointer-events:none}
#cv{position:absolute;left:0;top:0;width:640px;height:360px;image-rendering:pixelated;image-rendering:crisp-edges;display:none;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none}
.screen{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;gap:6px;padding:7px 10px 8px;background:var(--bl) repeating-linear-gradient(0deg,rgba(0,0,30,.06) 0 1px,transparent 1px 3px)}
.row{display:flex;gap:6px;align-items:center}.col{display:flex;flex-direction:column;gap:6px}
.grow{flex:1;min-width:0;min-height:0}.sp{flex:1}.ctr{justify-content:center}.end{justify-content:flex-end}.stretch{align-items:stretch}
.s16{font-size:16px}.s12{font-size:12px}.s10{font-size:10px}.s7{font-size:7px}.s6{font-size:6px}
.dim{color:var(--dim)}.yl{color:var(--yl2)}.rdt{color:#ff7a70}.grt{color:#7dff8a}.cyt{color:var(--cy)}
.ttl{display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;line-height:1;text-shadow:2px 2px 0 var(--nv);white-space:nowrap}
.ttl.sm{font-size:12px}
.tst{display:inline-flex;gap:1px}.tst i{display:inline-block;width:12px;height:12px;clip-path:polygon(50% 0,62% 34%,98% 36%,69% 58%,80% 94%,50% 73%,20% 94%,31% 58%,2% 36%,38% 34%)}
.tst i.r{background:#e3342f}.tst i.w{background:#fff}.tst i.n{background:#14286b}
.box{border:2px solid #fff;position:relative;padding:9px 6px 5px;box-shadow:0 2px 0 rgba(0,0,40,.35)}
.box>.lbl{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:var(--bl);padding:0 4px;white-space:nowrap;line-height:1;font-size:8px}
.box.c{display:flex;align-items:center;justify-content:center;gap:5px}
.bt{font:inherit;font-size:8px;line-height:1.2;color:#fff;background:var(--bl);border:2px solid #fff;padding:7px 8px 6px;box-shadow:0 3px 0 rgba(0,0,40,.45);cursor:pointer;text-transform:uppercase;position:relative;top:0;outline:none;white-space:nowrap;touch-action:manipulation}
.bt:hover{background:var(--bl2)}.bt:active{top:2px;box-shadow:0 1px 0 rgba(0,0,40,.45)}
.bt.y{background:var(--yl);color:#fff;text-shadow:1px 1px 0 #7a7300}.bt.g{background:#2fae3e}.bt.r{background:#c8322b}
.bt.big{font-size:10px;padding:10px 12px 9px}.bt.xl{font-size:12px;padding:12px 16px 11px}
.bt.ico{padding:5px 6px}
.bt:disabled,.bt.dk{background:var(--dk);color:#6c6f88;border-color:#565970;cursor:default;text-shadow:none}
.coin{border:2px solid #fff;padding:4px 7px 3px;display:inline-flex;gap:5px;align-items:center;font-size:10px;line-height:1;white-space:nowrap}
.cc{display:inline-block;width:10px;height:10px;background:var(--yl);border-radius:50%;box-shadow:inset -2px -2px 0 #9c8f00,0 0 0 1px #6e6500;vertical-align:-1px}
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.stars i{display:inline-block;width:8px;height:8px;background:#1d2f78;clip-path:polygon(50% 0,62% 34%,98% 36%,69% 58%,80% 94%,50% 73%,20% 94%,31% 58%,2% 36%,38% 34%)}
.stars.lg i{width:11px;height:11px}.stars.xs i{width:6px;height:6px}
.stars i.f{background:var(--yl2)}.stars i.h{background:linear-gradient(90deg,var(--yl2) 50%,#1d2f78 50%)}
.stars.o i.f{background:#6ad6ff}.stars.o i.h{background:linear-gradient(90deg,#6ad6ff 50%,#1d2f78 50%)}
.stars.d i.f{background:#ff4a3d}.stars.d i.h{background:linear-gradient(90deg,#ff4a3d 50%,#1d2f78 50%)}
.bar{height:12px;border:2px solid #000;background:#000;position:relative;overflow:hidden}.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--yl)}
.segs{display:flex;gap:2px;border:2px solid #000;background:#000;padding:0}.segs i{flex:1;height:14px;background:#33386a}.segs i.on{background:var(--yl)}
.pips{display:inline-flex;gap:2px}.pips i{width:7px;height:8px;background:#1d2f78}.pips i.on{background:var(--yl2)}
.face{image-rendering:pixelated;display:inline-block;vertical-align:middle}
.tbl{width:100%;border-collapse:collapse;font-size:8px}
.tbl th{text-align:left;padding:3px 3px;font-weight:normal;color:#fff;position:sticky;top:0;background:var(--bl)}
.tbl td{padding:3px 3px;white-space:nowrap;vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}.tbl td.c,.tbl th.c{text-align:center}
.tbl tr.me td{color:var(--yl2)}.tbl tr.clk{cursor:pointer}.tbl tr.clk:hover td{background:rgba(255,255,255,.08)}
.scroll{overflow-y:auto;overflow-x:hidden;min-height:0;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:#fff}.scroll::-webkit-scrollbar-track{background:var(--bl3)}
.pcard{width:98px;border:2px solid #fff;background:var(--nv);cursor:pointer;display:flex;flex-direction:column;position:relative;box-shadow:0 3px 0 rgba(0,0,40,.45);top:0}
.pcard:active{top:2px}
.pcard .ph{height:56px;position:relative;background:#8cc8f5;overflow:hidden;display:flex;justify-content:center;align-items:flex-end}
.pcard.D .ph{background:#e88686}.pcard.K .ph{background:#d6a067}
.pcard .ph .pos{position:absolute;left:3px;top:3px;font-size:10px;color:#fff;text-shadow:1px 1px 0 #000}
.pcard .ph .fc{position:absolute;right:3px;top:3px}
.pcard .ph .tg{position:absolute;left:3px;bottom:3px;font-size:6px;padding:2px 2px 1px;line-height:1}
.pcard .nm{text-align:center;font-size:7px;padding:3px 2px 1px;white-space:nowrap;overflow:hidden}
.pcard .st{text-align:center;padding-bottom:3px;line-height:1}
.pcard .cb{height:5px;background:#555}.pcard .cb i{display:block;height:100%;background:var(--gr)}
.pcard.sm{width:86px}.pcard.sm .ph{height:46px}
.pcard.dis{opacity:.45}
.tg.inj{background:var(--rd);color:#fff}.tg.sp{background:var(--yl);color:#000}.tg.ex{background:#fff;color:#000}
.tile{border:2px solid #fff;background:var(--bl);padding:6px 4px 5px;text-align:center;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,40,.45);position:relative;top:0;display:flex;flex-direction:column;gap:4px;align-items:center;font:inherit;color:#fff}
.tile:active{top:2px}.tile .tn{font-size:8px;white-space:nowrap;overflow:hidden;max-width:100%}
.tile.dk{background:var(--dk);border-color:#3c3f52;color:#5d6079;cursor:default}
.tile.dk .stars i.f,.tile.dk .stars i.h{opacity:.55}
.chip{font:inherit;font-size:7px;padding:4px 5px 3px;border:2px solid #fff;background:var(--bl);color:#fff;cursor:pointer;touch-action:manipulation}
.chip.on{background:var(--yl);text-shadow:1px 1px 0 #7a7300}
.modal{position:absolute;inset:0;background:rgba(0,0,30,.6);display:flex;align-items:center;justify-content:center;z-index:60;pointer-events:auto}
.mp{background:var(--bl);border:2px solid #fff;box-shadow:0 4px 0 rgba(0,0,40,.5);padding:10px;display:flex;flex-direction:column;gap:7px;max-width:620px;max-height:350px}
input.txt{font:inherit;font-size:10px;background:var(--nv);border:2px solid #fff;color:#fff;padding:6px 7px;outline:none;width:100%;text-transform:uppercase;-webkit-user-select:text;user-select:text}
.sw{width:15px;height:15px;border:2px solid #000;cursor:pointer;display:inline-block}.sw.on{outline:2px solid #fff}
.ava{image-rendering:pixelated;display:block}
.toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:var(--nv);border:2px solid #fff;padding:6px 9px;z-index:90;font-size:8px;pointer-events:none;animation:fin .2s;white-space:nowrap}
@keyframes fin{from{opacity:0}}
@keyframes pulse{50%{opacity:.35}}.blink{animation:pulse 1s steps(2) infinite}
/* timeline */
.tl{background:var(--yl);height:66px;position:relative;margin:0 -10px;color:#fff;text-shadow:1px 1px 0 #6d6700;cursor:pointer}
.tl .ln{position:absolute;left:0;right:0;top:36px;height:4px;background:#fff}
.tl .ln i{position:absolute;left:0;top:0;bottom:0;background:var(--gr)}
.tl .nd{position:absolute;top:0;width:200px;transform:translateX(-50%);text-align:center;display:flex;flex-direction:column;align-items:center}
.tl .nd .a{font-size:8px;margin-top:5px;white-space:nowrap}.tl .nd .b{font-size:8px;margin-top:3px;white-space:nowrap}
.tl .nd .dot{width:22px;height:12px;border-radius:50%;background:#ddd;border:2px solid #fff;margin-top:4px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.tl .nd .dot.w{background:var(--gr)}.tl .nd .dot.l{background:var(--rd)}.tl .nd .dot.c{background:#fff;width:26px;height:14px}
.tl .nd .r{font-size:8px;margin-top:3px}
/* in-game layer */
.gl{position:absolute;inset:0;pointer-events:none}
.gl .bt,.gl .pe{pointer-events:auto}
.gtop{position:absolute;left:0;right:0;top:0;height:0;pointer-events:none}
/* TV scoreboard: sits over the stands at the top, never over the field */
.sbw{position:absolute;top:3px;left:50%;transform:translateX(-50%)}
.sb{position:relative;display:flex;align-items:stretch;height:36px;background:linear-gradient(#262c44,#0f1324);border:1px solid rgba(255,255,255,.55);box-shadow:0 2px 0 rgba(0,0,0,.5);white-space:nowrap}
.sb .tm{display:flex;align-items:center;gap:5px;padding:0 7px}
.sb .bdg{width:26px;height:26px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:6px;line-height:1;font-style:normal;letter-spacing:-0.5px;text-shadow:none;box-shadow:0 1px 0 rgba(0,0,0,.5)}
.sb .nflsb-logo{display:block;flex:none;width:30px;height:27px;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.55))}
.sb .sc{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:30px}
.sb .sc b{font-weight:normal;font-size:16px;line-height:1;text-shadow:2px 2px 0 #000}
.sb .to{display:flex;gap:2px}.sb .to i{width:7px;height:3px;background:#5a5f78}.sb .to i.on{background:#f0f0f0}
.sb .pos{width:5px;height:4px;border-radius:50%;background:#a0561c;box-shadow:0 0 0 1px #000;margin-top:-1px}
.sb .clk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 9px;background:rgba(0,0,0,.45);border-left:1px solid rgba(255,255,255,.25);border-right:1px solid rgba(255,255,255,.25)}
.sb .clk b{font-weight:normal;font-size:10px;line-height:1}.sb .clk span{font-size:7px;line-height:1;color:#cfd6ff}
.sbd{position:absolute;left:calc(100% + 4px);top:0;display:flex;align-items:center;gap:6px;height:16px;padding:0 6px;background:#13286e;border:1px solid rgba(255,255,255,.55);font-size:7px;line-height:1;white-space:nowrap}
.sbd .pc{color:#ffe94a}.sbd .pc.lo{color:#ff6a5c}
.gbot{position:absolute;left:0;right:0;bottom:0;height:18px;background:#0b2a10;display:flex;align-items:center;gap:6px;padding:0 6px;font-size:8px;white-space:nowrap}
.gl .gpause,body.mobile .gl .gpause{position:absolute;right:2px;top:1px;width:28px;height:14px;padding:0;font-size:7px;line-height:1;border-width:1px;box-shadow:none;display:flex;align-items:center;justify-content:center;z-index:30}
.gpause::after{content:'';position:absolute;left:-12px;right:-3px;top:-2px;bottom:-14px}
.gctrl{position:absolute;right:6px;bottom:22px;display:flex;gap:5px;align-items:flex-end}
.ghint{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:7px;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;color:#fff;pointer-events:none}
.gban{position:absolute;left:0;right:0;top:20%;text-align:center;pointer-events:none}
.gban div{display:inline-block;font-size:16px;color:#fff;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 3px 0 #000;animation:fin .15s;line-height:1.3}
.gban small{display:block;font-size:8px;margin-top:5px}
.gov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,30,.45);pointer-events:auto;z-index:20}
.gov .mp{width:470px}
.pbp{font-size:7px;line-height:1.9;height:118px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.pbp div{border-bottom:1px solid rgba(255,255,255,.18);animation:fin .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bracket{display:flex;gap:5px;align-items:stretch}.bracket .rd{display:flex;flex-direction:column;justify-content:space-around;gap:4px;flex:1}
.bm{border:2px solid #fff;font-size:7px;background:var(--bl3)}.bm div{display:flex;justify-content:space-between;padding:3px 4px 2px;gap:4px}
.bm div.w{color:var(--yl2)}.bm div.me{background:#3b6cf0}
#fw{position:absolute;inset:0;width:640px;height:360px;image-rendering:pixelated;pointer-events:none}
body.mobile .bt{padding:8px 9px 7px}body.mobile .chip{padding:6px 7px 5px}
.ngc .chip{padding:4px 7px 3px}.ngc input.txt{padding-top:3px;padding-bottom:2px}
.nwi{white-space:normal;overflow-wrap:anywhere;line-height:1.35;flex:none}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   RETRO FOOTBALL — core: data, players, rosters, league, sim, offseason
   ===================================================================== */
const $=(s,r)=>(r||document).querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,u)=>a+(b-a)*u;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const fmtM=v=>Math.round(v)+'M';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const _SH=new Map();
function shade(hex,amt){const key=hex+amt;let v=_SH.get(key);if(v)return v;let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');const n=parseInt(c,16);const r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);v='#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);_SH.set(key,v);return v;}
function lum(hex){const n=parseInt(hex.replace('#',''),16);return((n>>16)*0.299+((n>>8)&255)*0.587+(n&255)*0.114);}
function colDist(a,b){const x=parseInt(a.slice(1),16),y=parseInt(b.slice(1),16);return Math.hypot((x>>16)-(y>>16),((x>>8)&255)-((y>>8)&255),(x&255)-(y&255));}
const ROMAN=n=>{const m=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(const[v,r]of m)while(n>=v){s+=r;n-=v;}return s;};

/* ---------- CONFIG (edit names here) ---------- */
const CFG={champ:'SUPER BOWL',game:'RETRO FOOTBALL',startYear:2026,saveKey:'pixelGridiron_v2',cap:150,capMax:260,capStep:5,capCost:10};
const DIVS=['EAST','NORTH','SOUTH','WEST'];
/* Official NFL franchise identities. Team IDs and order intentionally stay
   stable so existing Pixel Gridiron saves keep pointing at the same clubs. */
const TEAM_DATA=[
 ['Buffalo','Bills','BUF','#00338D','#C60C30'],['Miami','Dolphins','MIA','#008E97','#FC4C02'],['New England','Patriots','NE','#002244','#C60C30'],['New York','Jets','NYJ','#125740','#FFFFFF'],
 ['Baltimore','Ravens','BAL','#241773','#9E7C0C'],['Cincinnati','Bengals','CIN','#FB4F14','#000000'],['Cleveland','Browns','CLE','#311D00','#FF3C00'],['Pittsburgh','Steelers','PIT','#FFB612','#101820'],
 ['Houston','Texans','HOU','#03202F','#A71930'],['Indianapolis','Colts','IND','#002C5F','#A2AAAD'],['Jacksonville','Jaguars','JAX','#006778','#D7A22A'],['Tennessee','Titans','TEN','#0C2340','#4B92DB'],
 ['Denver','Broncos','DEN','#FB4F14','#002244'],['Kansas City','Chiefs','KC','#E31837','#FFB81C'],['Las Vegas','Raiders','LV','#000000','#A5ACAF'],['Los Angeles','Chargers','LAC','#0080C6','#FFC20E'],
 ['Dallas','Cowboys','DAL','#003594','#869397'],['New York','Giants','NYG','#0B2265','#A71930'],['Philadelphia','Eagles','PHI','#004C54','#A5ACAF'],['Washington','Commanders','WAS','#5A1414','#FFB612'],
 ['Chicago','Bears','CHI','#0B162A','#C83803'],['Detroit','Lions','DET','#0076B6','#B0B7BC'],['Green Bay','Packers','GB','#203731','#FFB612'],['Minnesota','Vikings','MIN','#4F2683','#FFC62F'],
 ['Atlanta','Falcons','ATL','#A71930','#000000'],['Carolina','Panthers','CAR','#0085CA','#101820'],['New Orleans','Saints','NO','#D3BC8D','#101820'],['Tampa Bay','Buccaneers','TB','#D50A0A','#34302B'],
 ['Arizona','Cardinals','ARI','#97233F','#000000'],['Los Angeles','Rams','LA','#003594','#FFA300'],['San Francisco','49ers','SF','#AA0000','#B3995D'],['Seattle','Seahawks','SEA','#002244','#69BE28'],
];
const TEAMS=TEAM_DATA.map((d,i)=>({id:i,city:d[0],nickname:d[1],name:d[0]+' '+d[1],abbr:d[2],c1:d[3],c2:d[4],conf:i<16?'AFC':'NFC',div:DIVS[Math.floor(i/4)%4],di:Math.floor(i/4)}));

/* ---------- NFL midfield stadium logos ----------
   The midfield badge is always the home franchise's logo: the user's team for
   home games, and the opponent's team for away games. Logos load on demand from
   ESPN's public logo CDN, and the local abbreviation mark is used as a fallback.
*/
const NFL_LOGO_ESPN_SLUGS={LA:'lar',WAS:'wsh'};
const NFL_FIELD_LOGOS=Object.create(null);
const NFL_FIELD_LOGO_PENDING=new Set();
const NFL_FIELD_LOGO_FAILED=new Set();
function loadFieldLogo(teamId){
 if(NFL_FIELD_LOGOS[teamId]&&NFL_FIELD_LOGOS[teamId].complete&&NFL_FIELD_LOGOS[teamId].naturalWidth)return NFL_FIELD_LOGOS[teamId];
 if(NFL_FIELD_LOGO_PENDING.has(teamId)||NFL_FIELD_LOGO_FAILED.has(teamId))return null;
 const team=TEAMS[teamId];if(!team)return null;
 NFL_FIELD_LOGO_PENDING.add(teamId);
 const img=new Image();
 img.onload=()=>{
  NFL_FIELD_LOGO_PENDING.delete(teamId);NFL_FIELD_LOGOS[teamId]=img;
  if(M&&M.fieldLogoTeam===teamId&&M.fieldCvs)M.fieldCvs=[buildField(false),buildField(true)];
  // Refresh the TV scoreboard too, so badges that were showing abbreviations
  // switch to the same official NFL logo assets used at midfield.
  if(UI&&UI.scr==='game'&&M&&M.hc)hud();
 };
 img.onerror=()=>{
  NFL_FIELD_LOGO_PENDING.delete(teamId);NFL_FIELD_LOGO_FAILED.add(teamId);
  if(M&&M.fieldLogoTeam===teamId&&M.fieldCvs)M.fieldCvs=[buildField(false),buildField(true)];
  // Keep the scoreboard's abbreviation fallback when a logo cannot be loaded.
  if(UI&&UI.scr==='game'&&M&&M.hc)hud();
 };
 const slug=NFL_LOGO_ESPN_SLUGS[team.abbr]||team.abbr.toLowerCase();
 img.src='https://a.espncdn.com/i/teamlogos/nfl/500/'+slug+'.png';
 return null;

/* ---------- trade deadline + AI-to-AI trades ----------

   until the season ends. Other teams also trade with each other. */

function aiTrade(){
 const ids=L.teams.map(t=>t.id).filter(t=>t!==L.user);
 for(let tries=0;tries<12;tries++){
  const a=pick(ids),b=pick(ids.filter(x=>x!==a)),RA=rosterOf(a),RB=rosterOf(b);if(RA.length<4||RB.length<4)continue;
  const pa=pick(RA);const only=(R,p)=>(p.pos==='QB'||p.pos==='K')&&R.filter(x=>x.pos===p.pos).length<2;
  const va=trVal(pa);

  const cands=RB.filter(x=>Math.abs(trVal(x)-va)<=Math.max(2,va*0.18));if(!cands.length)continue;
  const pb=pick(cands);

 const pyd=q?v(G*(165+ovr(q)*13)):G*200,ptd=Math.round(tds*0.62);
 const set=(p,o)=>{if(!p||p.s.gp>0)return;Object.assign(p.s,o);p.s.gp=G;};
 if(q)set(q,{att:v(G*33),cmp:v(G*21),pyd,ptd:v(ptd*(0.8+ovr(q)/25)),pint:v(G*0.75*(1.5-ovr(q)/12),0.3),car:v(G*3),ryd:v(G*(6+attr(q,'spd')*2.5),0.4),rtd:v(2+attr(q,'spd')/3,0.5)});
 if(rb)set(rb,{car:v(G*15),ryd:v(G*15*(3.4+ovr(rb)*0.12)),rtd:v(tds*0.22),rec:v(G*2.5),wyd:v(G*18),wtd:v(1.5,0.6)});

function progressPlayer(p){

 for(let i=0;i<Math.abs(n);i++){const k=pick(ks),b=p.a[k];if(n>0){if(canRaise(p,k))p.a[k]=Math.min(10,p.a[k]+1);}else p.a[k]=Math.max(1,p.a[k]-1);if(p.a[k]!==b)ch[k]=(ch[k]||0)+(p.a[k]-b);}

/* ---------- retirement ----------

   season tends to keep going (and pushes his age back a year). */
const RET_BASE={QB:37,K:38,OL:34,TE:33.5,WR:33,DL:33,LB:32.5,DB:32.5,RB:31};
function retAgeOf(p){

  if(a<=p.age)a=p.age+ri(1,3);     // older players in saves from before this existed get a few more years
  p.retAge=a;}

/* Season that was good enough to want to keep playing (judged on the season just finished). */
function goodSeason(p){
 const s=p.s||{},yr=(p.awards||[]).some(a=>a.endsWith(' '+L.year));if(yr)return true;

function setupDraft(founding){

}
function draftPick(p){
 const D=L.draft;
 if(p){D.pool.splice(D.pool.indexOf(p.id),1);delete p.scout;p.team=L.user;p.mor=80;D.log.unshift({id:p.id,t:L.user,r:D.round+1});news('You drafted '+p.pos+' '+fullname(p)+' in round '+(D.round+1)+'.');}
 D.left--;
 if(D.left>0){draftAI(1);return;}
 draftAI(Math.max(1,6-beforeK()));
 D.round++;
 while(D.round<D.rounds.length&&!D.rounds[D.round]){draftAI(7);D.round++;}
 if(D.round>=D.rounds.length){D.done=true;return;}
 D.left=D.rounds[D.round];draftAI(beforeK());
}
function finishDraft(){
 const D=L.draft;
 for(const id of D.pool){const p=P(id);if(p){if(Math.random()<.4){p.team=-1;delete p.scout;}else removePlayer(p);}}
 L.draft=null;
 // offseason roster cuts: most teams let at least one player go
 for(const t of L.teams)if(t.id!==L.user&&Math.random()<0.6)aiRelease(t.id,false);
 for(let i=0,n=ri(2,5);i<n;i++)aiTrade();
 for(const t of L.teams)if(t.id!==L.user)fillAIRoster(t.id);
 if(L.rosterMode!=='NFL')while(faList().length<34)addFA();
}

/* ---------- job offers ---------- */
/* You can change teams every other season, and only to teams that need a head coach:
   clubs that fired theirs after a bad year, plus the odd one whose coach retired or left. */
function offersDue(){return L.season-L.lastOffer>=2;}
function genOffers(){
 const h=L.hist[0],good=h?(h.w+h.t*0.5)/17+(h.res==='CHAMPIONS'?0.25:inPlayoffs(L.user)?0.1:0):0.4;
 const ids=L.teams.map(t=>t.id).filter(t=>t!==L.user),why={},out=[];
 // worst records fire their coach most often
 const byRec=ids.slice().sort((a,b)=>tpct(L.teams[a])-tpct(L.teams[b])||((L.teams[a].pf-L.teams[a].pa)-(L.teams[b].pf-L.teams[b].pa)));
 byRec.forEach((t,i)=>{const R=L.teams[t],p=tpct(R)>0.6?0:i<4?0.75:i<8?0.4:i<14?0.12:0.02;if(Math.random()<p&&!(L.po&&L.po.champ===t)){out.push(t);why[t]='FIRED COACH AFTER '+R.w+'-'+R.l+(R.t?'-'+R.t:'');}});
 // a coach retires or leaves for another job somewhere else (more likely to be a good team if you won)
 const extra=ids.filter(t=>!out.includes(t));const nx=good>0.6?2:1;
 for(let i=0;i<nx&&extra.length;i++){const ranked=extra.sort((a,b)=>tpct(L.teams[b])-tpct(L.teams[a]));const k=Math.floor(Math.pow(Math.random(),good>0.6?2:1)*ranked.length);const t=ranked.splice(k,1)[0];out.push(t);why[t]=pick(['COACH RETIRED','COACH LEFT FOR COLLEGE','COACH STEPPED DOWN']);}
 while(out.length<3){const left=byRec.filter(t=>!out.includes(t));const t=left[0];out.push(t);why[t]='FIRED COACH AFTER '+L.teams[t].w+'-'+L.teams[t].l;}
 const list=out.slice(0,7);L.jobWhy={};for(const t of list)L.jobWhy[t]=why[t];
 L.lastOffer=L.season;return list;
}
function switchTeam(t){
 const old=L.user;L.user=t;L.custom=null;L.fac={stad:ri(1,4),train:ri(1,4),rehab:ri(1,4)};L.fan=50;L.oc=null;L.dc=null;
 for(const p of rosterOf(t))p.mor=70;
 news('Coach '+L.coach+' leaves '+teamName(old)+' to take the '+T(t).name+' job!');
 fillAIRoster(old);
}
function startNewSeason(){
 for(let d=0;d<8;d++)L.divRank[d]=divStand(d);
 L.season++;L.year++;L.week=1;L.phase='REG';L.po=null;L.off=null;L.jobs=null;
 for(const t of L.teams){Object.assign(t,zeroRec());t.tq=clamp(t.tq+rnd(-0.5,0.5),4,7.2);}
 refreshStaff();buildSchedule();
 news('The '+L.year+' season begins!');save();
}

function news(s){if(!L)return;L.news.unshift({w:L.phase==='REG'?'WK '+L.week:L.phase==='PO'?'PLAYOFFS':'OFFSEASON',y:L.year,s});if(L.news.length>40)L.news.length=40;}
/* Save slots: slot 1 keeps the original key so existing saves stay in slot 1. */
const SLOTS_N=5;
let SLOT=(()=>{try{return clamp(+localStorage.getItem('rf_slot')||1,1,SLOTS_N);}catch(e){return 1;}})();
const slotKey=n=>n===1?CFG.saveKey:CFG.saveKey+'_s'+n;
function setSlot(n){SLOT=n;try{localStorage.setItem('rf_slot',String(n));}catch(e){}}
function save(){if(!L)return;try{L.savedAt=Date.now();const c=Object.assign({},L);delete c.pmap;localStorage.setItem(slotKey(SLOT),JSON.stringify(c));}catch(e){}}
function loadSave(n){try{const s=localStorage.getItem(slotKey(n||SLOT));if(!s)return null;const o=JSON.parse(s);if(!o||o.v!==2)return null;migrate(o);return o;}catch(e){return null;}}
/* Small summary of a slot for the slot list, without migrating the whole save. */
function slotInfo(n){try{const s=localStorage.getItem(slotKey(n));if(!s)return null;const o=JSON.parse(s);if(!o||o.v!==2)return null;const R=o.teams&&o.teams[o.user];return{team:o.user,season:o.season,year:o.year,coach:o.coach,phase:o.phase,rec:R?R.w+'-'+R.l+(R.t?'-'+R.t:''):'',at:o.savedAt||0,titles:o.titles||0};}catch(e){return null;}}
function migrate(o){
 if(!o.picks)o.picks=[1,1,1];if(!o.settings.dir)o.settings.dir='S';if(o.settings.replay==null)o.settings.replay=true;
 for(const p of o.players){const a=p.a;if(a.arm!=null){if(a.str==null)a.str=a.arm;delete a.arm;}if(a.kpw!=null){a.str=a.kpw;delete a.kpw;}
  const have=Object.values(a),avg=have.length?have.reduce((x,y)=>x+y,0)/have.length:4;for(const k of POSDEF[p.pos])if(a[k]==null)a[k]=clamp(Math.round(avg+rnd(-1,1)),1,10);}
}
function tradeValue(p){const v=ovr(p)+(p.pot-ovr(p))*0.5-Math.max(0,p.age-28)*0.4;return v>=7.6?1:v>=6.2?2:v>=4.8?3:0;}
function tradePlayer(p){const r=tradeValue(p);if(!r)return false;const t=pick(L.teams.filter(x=>x.id!==L.user)).id;p.team=t;p.bench=false;const rr=rosterOf(t);if(rr.length>rmax()){const w=rr.filter(x=>x!==p).sort((a,b)=>ovr(a)-ovr(b))[0];if(w){w.team=-1;w.yrs=1;}}L.picks[r-1]++;news('You traded '+p.pos+' '+fullname(p)+' to '+T(t).name+' for a round '+r+' pick.');return r;}
function autoPickTarget(){const sc=p=>p.scout[0]+p.scout[1]+(3-'ABCD'.indexOf(p.potg))*0.4;return L.draft.pool.map(P).filter(Boolean).sort((a,b)=>sc(b)-sc(a))[0];}
function hasSave(n){try{return!!localStorage.getItem(slotKey(n||SLOT));}catch(e){return false;}}

function uniformsFor(t){
 const ab=T(t).abbr,c=teamCol(t);let raw=UNI_RAW[ab];
 if(!raw||(t===L?.user&&L?.custom&&L.custom.c1))raw=[['HOME',c.c1,c.c2,c.c1,c.c2,'#e2e2e2',c.c1],['COLOR RUSH',c.c1,c.c2,c.c1,c.c2,c.c1,c.c1],['BLACKOUT','#111111',c.c1,'#111111',c.c1,'#111111','#111111']];
 const mk=r=>({n:r[0],helm:r[1],stripe:r[2],jersey:r[3],trim:r[4],pants:r[5],socks:r[6]});
 const H=mk(raw[0]),away={n:'AWAY',helm:H.helm,stripe:H.stripe,jersey:'#f0f0f0',trim:H.jersey==='#f2f2f2'?H.trim:H.jersey,pants:H.pants,socks:H.socks};
 if(H.jersey==='#f2f2f2'){/* white-at-home teams: their "away" is the colour jersey listed next */}
 return[H,away,...raw.slice(1).map(mk)];
}
/* Default uniforms for a game: home team in its home set, visitors in white, and if
   that clashes (white-at-home teams) the visitors switch to their first set that doesn't. */
function defaultUnis(g){const H=uniformsFor(g.h),A=uniformsFor(g.a);let ua=1;
 if(colDist(H[0].jersey,A[ua].jersey)<80){for(let i=0;i<A.length;i++)if(colDist(H[0].jersey,A[i].jersey)>=80){ua=i;break;}}
 return g.h===L.user?{uU:0,uO:ua}:{uU:ua,uO:0};}
function lookFor(p,t,away,alt){
 if(typeof away==='number'){const U=uniformsFor(t),u=U[((away%U.length)+U.length)%U.length];
  const lk={helm:u.helm,stripe:u.stripe,jersey:u.jersey,trim:u.trim,pants:u.pants,socks:u.socks,skin:SKIN[p?p.skin:2],teamId:t};
  lk.key=[lk.helm,lk.stripe,lk.jersey,lk.trim,lk.pants,lk.socks,lk.skin,'team'+t].join('');loadFieldLogo(t);return lk;}
 let c=teamCol(t);if(alt)c={c1:c.c2,c2:c.c1};const pl=lum(c.c2);
 const lk={helm:c.c1,stripe:c.c2,jersey:away?'#f0f0f0':c.c1,trim:away?c.c1:c.c2,pants:away?'#d9d9d9':(pl>70&&pl<215?c.c2:'#e2e2e2'),socks:c.c1,skin:SKIN[p?p.skin:2],teamId:t};
 lk.key=[lk.helm,lk.stripe,lk.jersey,lk.trim,lk.pants,lk.socks,lk.skin,'team'+t].join('');loadFieldLogo(t);return lk;
}
const LOGO_MINI={};
function logoMini(t,px){const img=NFL_FIELD_LOGOS[t];if(!img||!img.complete||!img.naturalWidth)return null;const k=t+'|'+px;if(LOGO_MINI[k])return LOGO_MINI[k];
 /* halve repeatedly with smoothing for a clean downscale */let src=img,w=img.naturalWidth,h=img.naturalHeight;
 while(w/2>=px){const cc=document.createElement('canvas');cc.width=Math.ceil(w/2);cc.height=Math.ceil(h/2);const g=cc.getContext('2d');g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(src,0,0,cc.width,cc.height);src=cc;w=cc.width;h=cc.height;}
 const out=document.createElement('canvas');out.width=px;out.height=px;const g=out.getContext('2d');g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(src,0,0,out.width,out.height);
 return LOGO_MINI[k]=out;}
function drawMan(c,x,y,lk,o){
 o=o||{};const u=o.u||2;
 c.save();c.translate(Math.round(x),Math.round(y));
 if(o.shadow!==false){c.fillStyle='rgba(0,0,0,.28)';c.fillRect(-5*u,-u,10*u,2*u);}

/* Existing NFL saves: pull the headshot-based looks from the site's roster file once. */
/* Automatic weekly rating updates for NFL saves: the site's roster file is rebuilt every week
   from real production. Each real player keeps his team in your save; only the change in his
   real rating since the last update is added on top, so skill points you spent stay. Stops
   once your save moves past the real season. */
function syncNFLRatings(){
 if(!L||L.rosterMode!=='NFL'||L.year!==CFG.startYear||window.__rateSync||window.__rateDone)return;window.__rateSync=true;
 fetch('nfl-rosters.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{
  if(!j||!L)return;   // runs on every page load: ratings follow the latest real stats, rosters never move
  if(j.teamPower){NFL_POWER=j.teamPower;L.nflPower=NFL_POWER;}
  const by=new Map();for(const r of j.rows||[]){const k=nflNameKey(r.full_name||'');if(k&&!by.has(k))by.set(k,r);}
  let up=0,down=0;
  for(const p of L.players){if(!p.nfl)continue;const r=by.get(nflNameKey(p.fn+' '+p.ln));if(!r)continue;
   const pos=mapNFLPosition(r.position)||p.pos,q=nflQuality(r,pos);
   // Shift his attributes by how much his real rating changed. Skill points you spent stay on top,
   // because only the change in the real rating is applied (first time: measured from his current overall).
   const base=p.nflQ!=null?p.nflQ:ovr(p);const d=clamp(q-base,-3,3);p.nflQ=q;if(Math.abs(d)<0.01)continue;
   p.nflAcc=(p.nflAcc||0)+d;const st=Math.round(p.nflAcc);if(!st)continue;p.nflAcc-=st;
   for(const k of POSDEF[p.pos])p.a[k]=clamp(p.a[k]+st,1,10);p.peak=Math.max(p.peak||0,ovr(p));if(ovr(p)>p.pot)p.pot=Math.min(10,ovr(p)+0.2);   /* real-life breakout raises his ceiling */if(st>0)up++;else down++;}
  L.ratingsAt=j.builtAt;
  if(up||down)news('NFL ratings updated from this week\'s real stats: '+up+' up, '+down+' down.');
  save();if(UI.scr!=='game')render();
 }).catch(()=>{}).finally(()=>{window.__rateSync=false;window.__rateDone=true;});
}
function syncNFLLooks(){
 if(!L||L.rosterMode!=='NFL'||L.looksV===1||window.__lookSync)return;window.__lookSync=true;
 fetch('nfl-rosters.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{
  if(!j||!L)return;const by=new Map();for(const r of j.rows||[])if(r.look)by.set(String(r.full_name||'').toUpperCase(),r.look);
  for(const p of L.players){if(!p.nfl)continue;const lk=by.get((p.fn+' '+p.ln).toUpperCase());if(lk){[p.skin,p.hair,p.hc,p.beard]=lk.map(Number);}applySavedLook(p);}
  L.looksV=1;PRC.clear();for(const k in AVC)delete AVC[k];SPC.clear();save();if(UI.scr!=='game')render();
 }).catch(()=>{}).finally(()=>{window.__lookSync=false;});
}

 const lu=lineup(L.user),ps={},S=p=>p?(ps[p.id]=ps[p.id]||{xp:0}):null,add=(p,k,v)=>{const s=S(p);if(s)s[k]=(s[k]||0)+v;};

 add(lu.RB[0],'ryd',ry);add(lu.RB[0],'car',ri(10,22));
 for(let i=0;i<tds;i++){const r=Math.random();if(r<0.6){add(qb,'ptd',1);add(pick(recs.filter(Boolean))||null,'wtd',1);}else add(lu.RB[0],'rtd',1);}
 if(Math.random()<0.4)add(qb,'pint',1);
 for(const k of['DL','LB','DB'])for(const p of lu[k]){add(p,'tkl',ri(1,6));if(k==='DL'&&Math.random()<0.4)add(p,'sck',1);if(k==='DB'&&Math.random()<0.15)add(p,'dint',1);}

 void th;return ps;
}

/* ---------- player-for-player trades with any team ----------
   Value grows faster than linearly with rating so one star is worth more than two
   average players. Young players with high potential are worth more, old ones less.
   The other team says yes when what it gets is worth a bit more than what it gives,
   and it won't give up its only player at a position without getting one back. */
function trVal(p){if(!p)return 0;const o=ovr(p)+(p.age<=26?Math.max(0,p.pot-ovr(p))*0.4:0)-Math.max(0,p.age-29)*0.45;return Math.pow(Math.max(0.5,o-2),2.2);}
const PICK_V=[Math.pow(5.1,2.2),Math.pow(3.9,2.2),Math.pow(2.8,2.2)];
function trEval(t,give,get,pk){
 const G=give.map(P).filter(Boolean),R=get.map(P).filter(Boolean);
 let vIn=G.reduce((s,p)=>s+trVal(p),0)+pk.reduce((s,n,i)=>s+n*PICK_V[i],0),vOut=0;
 const theirs=rosterOf(t);
 for(const p of R){const left=theirs.filter(q=>q.pos===p.pos&&!get.includes(q.id)).length,back=G.filter(q=>q.pos===p.pos).length;vOut+=trVal(p)*(left===0&&back===0?1.45:1);}
 const need=vOut*1.08+(R.length?0.5:0);
 const myN=rosterOf(L.user).length-G.length+R.length,thN=theirs.length-R.length+G.length;
 const cap=capUsed(L.user)-G.reduce((s,p)=>s+p.sal,0)+R.reduce((s,p)=>s+p.sal,0);
 return{vIn,vOut,need,ratio:need>0?vIn/need:vIn>0?9:0,ok:vIn>=need&&(G.length+R.length+pk.reduce((a,b)=>a+b,0))>0,myN,thN,cap,capOk:cap<=L.cap+0.01,rosOk:myN<=rmax()};
}
function trOpen(o){const t0=o.t!=null?o.t:(L.user+1)%32,back=UI.scr==='player'?'roster':UI.scr==='trade'?'roster':UI.scr;go('trade',{t:t0===L.user?(t0+1)%32:t0,give:o.give||[],get:[],pk:[0,0,0],back});}
ACT.trOpen=d=>{UI.modal=null;trOpen({give:d.id?[+d.id]:[]});};
SCR.trade=()=>{
 const s=UI.sub,t=s.t,E=trEval(t,s.give,s.get,s.pk),mine=plist(L.user),theirs=plist(t);

 const have=L.picks||[1,1,1];
 const pks=[0,1,2].map(i=>`<span class="chip ${s.pk[i]?'on':''}" data-a="trPk" data-i="${i}" ${have[i]>s.pk[i]||s.pk[i]?'':'style="opacity:.4"'}>R${i+1}${s.pk[i]>1?' x'+s.pk[i]:''}</span>`).join('');
 const pct=clamp(E.ratio*100,0,100),col=E.ok?'var(--gr)':E.ratio>0.8?'var(--yl)':'var(--rd)';
 const msg=!s.give.length&&!s.get.length&&!s.pk.some(x=>x)?'PICK PLAYERS ON BOTH SIDES':!E.rosOk?'YOUR ROSTER WOULD BE OVER '+rmax():!E.capOk?'OVER YOUR SALARY CAP':E.ok?'THEY WILL ACCEPT':E.ratio>0.8?'CLOSE · ADD A LITTLE MORE':'THEY WANT MORE';
 return`<div class="screen"><div class="row">${coinBox()}<div class="grow">${ttl('TRADE')}</div><div class="coin">CAP ${fmtM(L.cap-E.cap)}</div></div>${L.phase==='REG'?`<div class="s7 ${L.week>=TRADE_DEADLINE-1?'yl':'dim'}" style="text-align:center;margin-top:-4px">TRADE DEADLINE: AFTER WEEK ${TRADE_DEADLINE}${L.week===TRADE_DEADLINE?' · LAST WEEK TO TRADE':''}</div>`:''}
 <div class="row stretch grow" style="gap:8px">

  <div class="box col" style="flex:1;min-width:0;padding:11px 4px 3px"><span class="lbl">YOU GET</span>
   <div class="row" style="gap:4px;margin-bottom:3px"><button class="bt ico" data-a="trT" data-d="-1">&lt;</button><div class="grow" style="text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(teamName(t).toUpperCase())} <span class="dim">${recStr(t)}</span></div><button class="bt ico" data-a="trT" data-d="1">&gt;</button></div>
   <div class="scroll grow"><table class="tbl s7">${theirs.map(p=>row(p,s.get.includes(p.id),'trR')).join('')}</table></div></div>
 </div>
 <div class="row" style="gap:8px"><button class="bt ico" data-a="trBack">${ICON.back}</button>
  <div class="col grow" style="gap:3px"><div class="bar" style="height:10px"><i style="width:${pct}%;background:${col}"></i></div><span class="s7 ${E.ok&&E.rosOk&&E.capOk?'grt':'dim'}">${msg}</span></div>
  <button class="bt y" data-a="trGo" ${E.rosOk&&E.capOk&&(s.give.length||s.get.length||s.pk.some(x=>x))?'':'disabled'}>PROPOSE TRADE</button></div></div>`;};
const trTog=(a,id)=>{const i=a.indexOf(id);if(i>=0)a.splice(i,1);else a.push(id);};
ACT.trG=d=>{trTog(UI.sub.give,+d.id);UI.keepScroll=true;render();};
ACT.trR=d=>{trTog(UI.sub.get,+d.id);UI.keepScroll=true;render();};
ACT.trPk=d=>{const i=+d.i,have=(L.picks||[1,1,1])[i],s=UI.sub;s.pk[i]=s.pk[i]>=have?0:s.pk[i]+1;render();};

ACT.trGo=()=>{
 const s=UI.sub,t=s.t,E=trEval(t,s.give,s.get,s.pk);if(!E.rosOk||!E.capOk)return;
 if(!tradesOpen())return toast('TRADE DEADLINE HAS PASSED (AFTER WEEK '+TRADE_DEADLINE+')');
 if(!E.ok){sfx('bad');return toast(E.ratio>0.8?T(t).abbr+' SAY NO · ALMOST THERE':T(t).abbr+' REJECT THE OFFER');}
 const G=s.give.map(P).filter(Boolean),R=s.get.map(P).filter(Boolean);
 for(const p of G){p.team=t;p.bench=false;p.mor=clamp(p.mor-5,0,100);}
 for(const p of R){p.team=L.user;p.mor=clamp(p.mor+5,0,100);p.yrs=Math.max(1,p.yrs);}
 s.pk.forEach((n,i)=>{L.picks[i]-=n;});
 // the other team trims back to a full roster and fills any holes
 const rr=rosterOf(t);if(rr.length>rmax()){const st=starterSet(t);rr.filter(x=>!st.has(x.id)).sort((a,b)=>ovr(a)-ovr(b)).slice(0,rr.length-rmax()).forEach(x=>{x.team=-1;x.yrs=1;});}
 fillAIRoster(t);

 news('TRADE WITH '+T(t).name+': '+abbr(L.user)+' get '+(nmL(R).join(', ')||'NOTHING')+' for '+gv+'.');
 sfx('coin');save();toast('TRADE ACCEPTED!');s.give=[];s.get=[];s.pk=[0,0,0];render();};

/* ---------- records book ----------
   Records set by players on the team you coach: single game, single season and career,
   plus team records. Game records come from games you play (not simmed ones). */
const REC_CATS=[['pyd','PASSING YARDS'],['ptd','PASSING TDS'],['cmp','COMPLETIONS'],['ryd','RUSHING YARDS'],['rtd','RUSHING TDS'],['rec','RECEPTIONS'],['wyd','RECEIVING YARDS'],['wtd','RECEIVING TDS'],['tkl','TACKLES'],['sck','SACKS'],['dint','INTERCEPTIONS'],['fgm','FIELD GOALS MADE']];
const TEAM_RECS=[['pts','MOST POINTS IN A GAME'],['marg','BIGGEST WIN MARGIN'],['wins','MOST WINS IN A SEASON'],['pf','MOST POINTS IN A SEASON'],['strk','LONGEST WIN STREAK']];
function recBook(){if(!L.records)L.records={game:{},season:{},career:{},team:{}};return L.records;}
/* 0 = no change, 1 = set (first mark, or the holder extending his own), 2 = broke an existing record. */
function recTry(scope,k,v,p,extra){
 if(!(v>0))return 0;const B=recBook()[scope],cur=B[k];
 if(cur&&(cur.v>v||(cur.v===v&&(!p||cur.id!==p.id))))return 0;
 if(cur&&cur.v===v)return 0;
 const same=cur&&p&&cur.id===p.id&&scope!=='game';
 B[k]=Object.assign({v,id:p?p.id:null,name:p?fullname(p):'',pos:p?p.pos:'',team:abbr(L.user),year:L.year},extra||{});
 return cur&&!same?2:1;
}
function recGameCheck(R,res){
 const out=[];if(R.simmed)return out;
 for(const p of rosterOf(L.user)){const s=R.ps[p.id];if(!s)continue;for(const[k,lab]of REC_CATS)if(recTry('game',k,s[k]||0,p)===2)out.push(pname(p).toUpperCase()+' '+(s[k])+' '+lab);}
 const us=R.sc[0],th=R.sc[1],T0=recBook().team;
 if(!T0.pts||us>T0.pts.v){const had=!!T0.pts;T0.pts={v:us,team:abbr(L.user),year:L.year,vs:abbr(R.op)};if(had)out.push('TEAM '+us+' POINTS');}
 if(us>th&&(!T0.marg||us-th>T0.marg.v)){T0.marg={v:us-th,team:abbr(L.user),year:L.year,vs:abbr(R.op),sc:us+'-'+th};}
 const st=L.teams[L.user].strk;if(st>0&&(!T0.strk||st>T0.strk.v))T0.strk={v:st,team:abbr(L.user),year:L.year};
 void res;return out;
}
/* Season and career records are refreshed from current stat lines (season so far). */
function recLiveCheck(announce){
 const out=[];
 for(const p of rosterOf(L.user)){for(const[k,lab]of REC_CATS){
  if(recTry('season',k,p.s[k]||0,p)===2&&announce)out.push(pname(p).toUpperCase()+' '+p.s[k]+' '+lab+' (SEASON)');
  const c=(p.c[k]||0)+(p.s[k]||0);if(recTry('career',k,c,p)===2&&announce)out.push(pname(p).toUpperCase()+' '+c+' '+lab+' (CAREER)');}}
 const R=L.teams[L.user],T0=recBook().team;
 if(R.w&&(!T0.wins||R.w>T0.wins.v))T0.wins={v:R.w,team:abbr(L.user),year:L.year,rec:R.w+'-'+R.l+(R.t?'-'+R.t:'')};
 if(R.pf&&(!T0.pf||R.pf>T0.pf.v))T0.pf={v:R.pf,team:abbr(L.user),year:L.year};
 return out;
}
SCR.records=()=>{
 recLiveCheck(false);const tab=UI.sub.tab||'game',B=recBook();
 const tabs=[['game','SINGLE GAME'],['season','SEASON'],['career','CAREER'],['team','TEAM']].map(([k,l])=>`<span class="chip ${tab===k?'on':''}" data-a="recTab" data-k="${k}">${l}</span>`).join('');
 let rows;
 if(tab==='team')rows=TEAM_RECS.map(([k,l])=>{const r=B.team[k];return`<tr><td>${l}</td><td class="r yl">${r?r.v:'-'}</td><td>${r?r.team+' '+r.year+(r.vs?' VS '+r.vs:'')+(r.rec?' ('+r.rec+')':'')+(r.sc?' ('+r.sc+')':''):'<span class="dim">NOT SET</span>'}</td></tr>`;}).join('');
 else rows=REC_CATS.map(([k,l])=>{const r=B[tab][k];const live=r&&r.id!=null&&P(r.id)&&P(r.id).team===L.user;return`<tr><td>${l}</td><td class="r yl">${r?r.v:'-'}</td><td>${r?esc(r.name.toUpperCase())+' <span class="dim">'+r.pos+' · '+r.team+' '+r.year+'</span>'+(live&&tab!=='game'?' <span class="grt">ACTIVE</span>':''):'<span class="dim">NOT SET</span>'}</td></tr>`;}).join('');
 return`<div class="screen"><div class="row"><button class="bt ico" data-a="go" data-s="hof">${ICON.back}</button><div class="grow">${ttl('RECORDS')}</div><div style="width:32px"></div></div>
 <div class="row ctr" style="gap:5px">${tabs}</div>
 <div class="box grow scroll" style="padding:4px 8px"><table class="tbl"><tr><th>RECORD</th><th class="r">MARK</th><th>HELD BY</th></tr>${rows}</table></div>
 <div class="s7 dim" style="text-align:center">RECORDS BY PLAYERS ON YOUR TEAM · SINGLE-GAME RECORDS COUNT GAMES YOU PLAY, NOT SIMMED ONES</div></div>`;};

};

function gainXP(p,x){const side=sideOf(p.pos),co=side==='O'?L.oc:side==='D'?L.dc:null;const mult=1+0.12*(L.fac.train-1)+(co?co.stars*0.08:0);p.xp+=Math.round(x*mult);let up=0;while(p.xp>=xpNeed(p.lvl)&&p.lvl<30){p.xp-=xpNeed(p.lvl);p.lvl++;if(!isMaxed(p)){p.sp++;up++;}}if(isMaxed(p))p.sp=0;return up;}
function gameRating(p,s,res){
 const pos=p.pos;let r=5;
 if(pos==='QB')r=3+(s.pyd||0)/70+(s.ptd||0)*1.1-(s.pint||0)*1.4+(s.ryd||0)/40;
 else if(pos==='RB')r=3+((s.ryd||0)+(s.wyd||0))/32+((s.rtd||0)+(s.wtd||0))*1.2-(s.fum||0)*2;
 else if(pos==='WR'||pos==='TE')r=3+(s.wyd||0)/26+(s.wtd||0)*1.3+(s.rec||0)*0.2-(s.fum||0)*2;
 else if(pos==='K')r=4+(s.fgm||0)*1.2-((s.fga||0)-(s.fgm||0))*1.5;
 else if(pos==='OL')r=5+(res==='W'?1.5:res==='L'?-1:0)+rnd(-1,1.5);
 else r=3+(s.tkl||0)*0.6+(s.sck||0)*1.6+(s.dint||0)*2.2;
 return clamp(Math.round(r),1,10);
}
function postGame(g,R){
 const home=g.h===L.user,us=R.sc[0],th=R.sc[1];
 finishGame(g,home?us:th,home?th:us);
 const res=us>th?'W':us<th?'L':'T',lu=starterSet(L.user),rows=[];
 for(const p of rosterOf(L.user)){
  const ps=R.ps[p.id]||{},played=lu.has(p.id);
  let x=(ps.xp||0)+(played?14:5)+(res==='W'?8:0);
  for(const k in ps)if(k!=='xp'&&p.s[k]!=null)p.s[k]+=ps[k];
  if(played){p.s.gp++;p.cond=clamp(p.cond-rnd(8,18)*(1.35-attr(p,'stm')*0.07),20,100);}
  const xpb=p.xp,lv0=p.lvl,up=gainXP(p,x);void xpb;
  p.mor=clamp(p.mor+(res==='W'?3:res==='L'?-3:0),0,100);
  let inj=false;if(played&&Math.random()<0.022+(p.cond<50?0.03:0)-L.fac.rehab*0.0015){p.inj=Math.max(1,ri(1,4)-Math.floor(L.fac.rehab/4));inj=true;news(fullname(p)+' ('+p.pos+') is injured for '+p.inj+' week'+(p.inj>1?'s':'')+'.');}
  rows.push({id:p.id,pos:p.pos,nm:pname(p).toUpperCase(),mor:p.mor,cnd:Math.round(p.cond),yds:(ps.pyd||0)+(ps.ryd||0)+(ps.wyd||0),tds:(ps.ptd||0)+(ps.rtd||0)+(ps.wtd||0),tck:ps.tkl||0,is:p.pos==='QB'?(ps.pint||0)+'/'+(ps.sacked||0):['DL','LB','DB'].includes(p.pos)?(ps.dint||0)+'/'+(ps.sck||0):'-',fum:ps.fum||0,rat:played?gameRating(p,ps,res):'-',xp:Math.round(x*(1+0.12*(L.fac.train-1))),up:up>0,inj,played});
 }
 rows.sort((a,b)=>POSL.indexOf(a.pos)-POSL.indexOf(b.pos));
 let recs=[];try{recs=[...recGameCheck(R,res),...recLiveCheck(true)].slice(0,6);for(const r of recs)news('NEW RECORD: '+r);}catch(e){console.error(e);}
 let cc=(res==='W'?4:res==='T'?2:1)+Math.floor(L.fac.stad/3)+(L.fan>=75?2:L.fan>=50?1:0)+(L.phase==='PO'&&res==='W'?4:0);
 if(R.simmed)cc=Math.max(1,cc-1);
 L.cc+=cc;fanAdd((res==='W'?3:res==='L'?-3:0)*(1+0.08*(L.fac.stad-1)));
 if(L.settings.diff===3&&!R.simmed){const m=us-th;L.dyn=clamp(L.dyn+(m>=14?2:m>0?1:m<=-14?-2:m<0?-1:0),1,20);}
 news((res==='W'?'WIN':res==='L'?'LOSS':'TIE')+' '+(home?'vs ':'at ')+abbr(R.op)+' '+us+'-'+th+'.');
 let press=-1,pp=null;
 if(!R.simmed&&Math.random()<0.7){const pool=PRESS.map((q,i)=>i).filter(i=>PRESS[i].w==='any'||(PRESS[i].w==='win'&&res==='W')||(PRESS[i].w==='loss'&&res==='L'));press=pick(pool);if(PRESS[press].pl){const c=rows.filter(r=>r.played).sort((a,b)=>(b.rat==='-'?0:b.rat)-(a.rat==='-'?0:a.rat)).slice(0,4);pp=c.length?pick(c).id:null;if(!pp)press=-1;}}
 const lab=L.phase==='REG'?'END OF WEEK '+L.week:'END OF '+(g.conf==='SB'?CFG.champ:ROUNDS[L.po.cur]);
 L.lastPost={lab,us,th,res,op:R.op,home,rows,cc,press,pp,simmed:!!R.simmed,recs};
 save();go('endweek');
}

function ovMsg(title,body,btns){M.phase='ov';M.ov={html:()=>`<div class="mp" style="align-items:center;text-align:center">${ttl(title,true)}<div style="line-height:2">${body}</div><div class="row ctr" style="gap:8px;margin-top:4px;flex-wrap:wrap">${btns.map((b,i)=>`<button class="bt ${b[2]||''} big" data-a="gAct" data-i="${i}">${b[0]}</button>`).join('')}</div></div>`,acts:btns.map(b=>b[1])};}

function startDrive(x,lab){M.to=2;M.cp=2;M.ballOn=clamp(x,10.5,109);M.down=1;M.fdX=Math.min(M.ballOn+10,110);M.ballY=26.67;M.runoff=0;M.conv=false;if(lab)banner(lab,'','#fff',1.3);clockCheck(toPre);}

/* ---------- opponent drive (simulated) ---------- */
function passY(e){return Math.round(clamp(Math.random()<0.3?ri(1,6):3+(-Math.log(Math.random()))*(7+e*8),-1,70));}
function runY(e){return Math.round(clamp(3.4+gauss()*3.3+e*5+(Math.random()<0.05?(-Math.log(Math.random()))*14:0),-5,75));}
function simOppDrive(s0){

 const edge=clamp((R.off-U.def-8)/100+diffLvl()*0.1,-0.4,0.45),ql=L.settings.qlen,lines=[];   // hard: opponents drive and score much more
 let s=s0,down=1,togo=Math.min(10,100-s),q=M.qtr,clk=M.clock,n=0,res=null,landX=0,head='',sc0=M.sc[0],sc1=M.sc[1];
 const QB=od.QB[0],RB=od.RB[0],TG=[od.WR[0],od.WR[0],od.WR[1],od.TE[0],RB].filter(Boolean),K=od.K[0],STY=STYLES[teamStyle(op)];
 const md=M.dep,pool={sack:[md.DL[0],md.DL[1],md.DL[0],md.DL[1],md.LB[0]],int:[md.DB[0],md.DB[1],md.DB[2],md.DB[0],md.LB[0],md.LB[1]],tkl:[md.LB[0],md.LB[1],md.LB[0],md.LB[1],md.DB[0],md.DB[1],md.DB[2],md.DL[0],md.DL[1]]};

 const tryFG=()=>{const fd=100-s+17;const p=clamp(0.98-(fd-20)*0.017,0.35,0.98),made=Math.random()<p;push(nmo(K)+' '+fd+' YD FIELD GOAL · '+(made?'GOOD!':'NO GOOD'),made?()=>{M.sc[1]+=3;}:null,made?'bad':'good');clk-=5;res=made?'fg':'fgmiss';head=made?abbr(op)+' FIELD GOAL':'FIELD GOAL MISSED!';if(made)sc1+=3;};

  n++;

  const lead=sc1-sc0;
  if(q>=4&&lead>0&&clk<=125){push(nmo(QB)+' TAKES A KNEE',null,'dim');clk-=40;s=Math.max(1,s-1);continue;}
  const hurry=(q===2||q>=4)&&clk<120&&(q===2||lead<=0);
  if(down===4){
   const fd=100-s+17,desp=q>=4&&lead<0&&clk<240;
   if(!desp&&fd<=54){tryFG();break;}
   if(!desp&&!(togo<=2&&s>=40&&s<=72&&Math.random()<0.5)){const dist=Math.round(clamp(40+gauss()*5+attr(od.K[0],'str')*0.6,28,62));let land=s+dist,tb='';if(land>=100){land=80;tb=' · TOUCHBACK';}push(abbr(op)+' PUNTS '+dist+' YDS'+tb,null);clk-=8;res='punt';landX=tb?0:110-land;head='PUNT';s=land;break;}
  }

  let y=0,t='',cls='',ro=hurry?14:30;
  if(pass){
   const r=Math.random(),sk=clamp(0.065-edge*0.09,0.02,0.13),ip=clamp(0.027-edge*0.045,0.008,0.065),cp=clamp(0.64+edge*0.6+STY.cp,0.42,0.86);
   if(r<sk){y=-ri(3,9);const d=pd('sack');credit(d,'sck',10);credit(d,'tkl',0);t=nmo(QB)+' SACKED BY '+nmd(d)+' ('+y+')';cls='good';}
   else if(r<sk+ip){const d=pd('int');credit(d,'dint',14);t='INTERCEPTED! '+nmd(d)+' PICKS OFF '+nmo(QB);s=Math.min(99,s+ri(5,25));

    else{const ret=ri(0,18);s=Math.max(1,s-ret);res='int';head='INTERCEPTION!';push(t+(ret?' · RETURNED '+ret+' YDS':''),null,'good');}

   else if(r<sk+ip+cp){y=Math.round(clamp(passY(edge)*(1+STY.deep),-1,75));const w=pick(TG);t=nmo(QB)+' TO '+nmo(w)+' FOR '+y;if(s+y<100)credit(pd('tkl'),'tkl',3);}
   else{const d=pd('int');t=nmo(QB)+' INCOMPLETE'+(d&&Math.random()<0.3?' · BROKEN UP BY '+nm(d):'');ro=6;}
  }else{
   if(Math.random()<clamp(0.014-edge*0.02,0.004,0.03)){const d=pd('tkl');credit(d,'tkl',5);s+=ri(0,4);res='fum';head='FUMBLE RECOVERED!';push('FUMBLE! '+nmd(d)+' FORCES IT · '+abbr(L.user)+' RECOVER!',null,'good');clk-=6;break;}

/* =====================================================================
   PASSING — custom slingshot model
   ---------------------------------------------------------------------
   Written from Retro Bowl's *observable* behaviour (pull back to aim,
   pull length = power, dotted arc preview, bullet/lob toggle, lead your
   receiver). It is NOT Retro Bowl's code or formulas; those are not
   public. Every constant in PASS is a hand-tuned approximation.

   COORDINATE MAPPING
   - Pointer: cpos() maps CSS pixels -> logical canvas pixels (640x360)
     through getBoundingClientRect(), so CSS scaling, the #stage
     transform and devicePixelRatio never change what a drag "means".
   - Field: yards. x 0..120 along the field (offense always attacks +x
     in field space), y 0..53.33 across, z = height in yards.
   - Field -> screen: sx = wx(x)  (PXY px per yard, mirrored by M.dir)
                      sy = wy(y) - z*PZ  (PYY px per yard across)
   - Screen drag -> field direction: divide by the same scales and flip
     by M.dir. Because the scales are inverted exactly, the dotted arc on
     screen always points straight opposite the drag, in both attack
     directions and at any canvas size.
   ===================================================================== */
const PASS={
 PULL_MIN:10,PULL_MAX:130,   // logical px of drag: no throw below MIN, full power at MAX (a comfortable drag)
 MIN_D:3,                    // shortest throw, yards
 RANGE_BASE:22,RANGE_ARM:3.2,// max air yards = BASE + ARM*(strength-1)
 POW_EXP:1.1,                // distance = MIN_D + p^POW_EXP*(max-MIN_D): fine control on short throws
 G:20,G_LOB:31,               // lobs use a stronger gravity => taller arc for the same flight time                       // stylised gravity, yd/s^2
 REL_Z:2.0,                  // release height (yd)
 CATCH_Z:0,                  // the arc lands exactly on the target circle (receivers catch it on the way down)
 LOB:{v0:24.5,v1:21.5},      // ~23 yd/s whatever the distance          // horizontal ball speed (yd/s) at p=0 .. p=1
 BUL:{v0:27,v1:31},          // bullet: faster and therefore flatter
 ARM_SPEED:0.03,             // +3% ball speed per strength point above 5
 ERR_BASE:0.35,ERR_PER_YD:0.035, // max placement error (yd) before modifiers
 PRESS_MUL:1.5,MOVE_MUL:1.18,BUL_ERR:1.12,
 SAFE_D:1.6                  // ball can't be played until it is this far from the QB
};
const PULL_MIN=PASS.PULL_MIN,PULL_MAX=PASS.PULL_MAX; // kept for other code that reads them

/* ---- deterministic randomness for tests ----
   Normal play uses Math.random. window.__pass.seed(n) switches passing
   (placement error + catch rolls + tips) to a seeded generator;
   window.__pass.noError=true removes placement error entirely. */
let passRand=Math.random;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
window.__pass={seed(n){passRand=n==null?Math.random:mulberry32(n);},noError:false,last:null};

/* ---- trajectory: one analytic flight used by BOTH the preview and the ball ----
   Constant horizontal speed v along (ux,uy); vertical z = z0 + vz*t - G*t^2/2,
   with vz chosen so the ball is at height z1 at time T. After T the ball keeps
   following the same parabola down to the ground (time Tg). */
function makeFlight(x0,y0,z0,x1,y1,z1,T,g){g=g||PASS.G;
 const dx=x1-x0,dy=y1-y0,d=Math.hypot(dx,dy)||1e-6;
 const vz=(z1-z0+0.5*g*T*T)/T;
 const Tg=(vz+Math.sqrt(vz*vz+2*g*Math.max(z0,0)))/g;
 return{x0,y0,z0,g,ux:dx/d,uy:dy/d,v:d/T,vz,T,Tg:Math.max(Tg,T),x1,y1,z1,d};
}
function flightAt(F,t){

}
function throwModel(pull,str,bullet=false){
 const p=clamp((pull-PASS.PULL_MIN)/(PASS.PULL_MAX-PASS.PULL_MIN),0,1);
 const maxR=PASS.RANGE_BASE+PASS.RANGE_ARM*(str-1);
 const d=PASS.MIN_D+Math.pow(p,PASS.POW_EXP)*(maxR-PASS.MIN_D);
 const S=bullet?PASS.BUL:PASS.LOB;
 const v=(S.v0+p*(S.v1-S.v0))*(1+PASS.ARM_SPEED*(str-5));
 return{p,d,v,T:d/v,maxR,bullet};
}
/* Turns the current drag into a throw plan (no randomness here). */
function aimInfo(a){

/* Commit the throw. Error is applied to the target point only, bounded by ai.err. */
function throwBall(ai){

  const ang=passRand()*Math.PI*2,r=ai.err*Math.min(1,Math.abs(gaussR())*0.5); // ~95% inside half... capped at the ring

 // goes for the ball on every difficulty - so a streaking TE with a safety on him isn't a free completion.
 {const tgt=M.primary;if(tgt&&Math.hypot(tx-ai.x0,ty-ai.y0)>=14)for(const f of M.D){if(f.eng||f.stun>0)continue;if((f.role==='S'||f.role==='DB')&&Math.hypot(f.x-tgt.x,f.y-tgt.y)<4&&f.x>tgt.x-3.5){f.hawk=true;f.react=0.32;}}}
}

/* ---- swept flight + collision ----

function posAt(f,a){return f._px==null?{x:f.x,y:f.y}:{x:lerp(f._px,f.x,a),y:lerp(f._py,f.y,a)};}

/* ---- catch envelope ----

   helmet, plus jump reach), with the ball's ground shadow required to be near

function upCam(dt){
 let f;
 if(M.phase==='ov'&&M.ov&&M.ov.type==='drive'){const o=M.ov,s=o.i>0?o.lines[o.i-1].s:o.s0;f=110-s;}
 else if(M.phase==='pre')f=M.ballOn+12;
 else if(M.fum&&M.loose)f=M.loose.x+3;
 else if(M.ball){const bp=ballPos(M.ball);f=bp.x+(M.play==='ret'?8:3);}
 else if(M.carrier)f=M.carrier.x+(M.play==='intret'?-6:7);
 else if(M.qb)f=M.qb.x+(M.aim?21:16);   // look further downfield while aiming

function step(dt){

 for(const c of M.conf){c.x+=c.vx*dt;c.y+=c.vy*dt;c.vy+=60*dt;c.l-=dt;}M.conf=M.conf.filter(c=>c.l>0&&c.y<CH+10);
 for(const p of M.pops)p.a+=dt;M.pops=M.pops.filter(p=>p.a<1.1);
 if(M.shake>0)M.shake=Math.max(0,M.shake-dt*14);if(M.hype>0)M.hype-=dt;if(M.banT>0)M.banT-=dt;
 for(const p of M.parts){if(M.wx==='snow'){p.y+=22*p.s*dt;p.x+=Math.sin(M.tt+p.s*9)*8*dt+M.wind*0.6*dt;}else{p.y+=260*p.s*dt;p.x+=M.wind*2*dt-30*dt;}if(p.y>CH)p.y-=CH;if(p.x<0)p.x+=CW;if(p.x>CW)p.x-=CW;}
 if(M.ov){if(M.ov.type==='drive'&&!M.ov.done){M.ov.tm-=dt;if(M.ov.tm<=0){revealLine();M.ov.tm=0.34;}}upCam(dt);return;}
 if(M.phase==='pre'&&M.pc!=null&&!M.paused){M.pc-=dt;if(M.pc<=0){delayOfGame();return;}}
 if(M.phase==='pre'&&M.runoff>0){const d=Math.min(M.runoff,dt*1.6);   /* game clock runs with the play clock (25s here ~ the NFL's 40s), not on fast-forward */

 else if(M.phase==='dead')upDead(dt);

   run plays snap right away. */

  if(M.rb){const rx=wx(M.rb.x),ry=wy(M.rb.y),qx=M.qb?wx(M.qb.x):-999,qy=M.qb?wy(M.qb.y):-999;
   const dR=Math.hypot(p.x-rx,p.y-(ry-15)),dQ=Math.hypot(p.x-qx,p.y-(qy-15));
   if(Math.abs(p.x-rx)<=11&&p.y>=ry-36&&p.y<=ry+5&&dR<dQ){snapRun('dive','HB DIVE');return;}}
  snap('pass');M.aim={sx:p.x,sy:p.y,cx:p.x,cy:p.y};M.input='aim';return;}
 if(M.phase==='live'){
  if(M.play==='pass'&&!M.thrown&&!M.carrier){M.aim={sx:p.x,sy:p.y,cx:p.x,cy:p.y};M.passBullet=false;M.input='aim';return;}
  if(M.play==='intret'){M.input='chase';M.steer={x0:p.x,y0:p.y,chase:true};return;}
  if(M.carrier){M.steer={x0:p.x,y0:p.y,ty0:M.carrier.ty==null?M.carrier.y:M.carrier.ty};M.input='run';}return;
 }
 if(M.phase==='kick'&&M.kick&&M.kick.st==='aim'){M.kick.sw={sx:p.x,sy:p.y,cx:p.x,cy:p.y};M.input='kick';}
},{passive:false});
cv.addEventListener('pointermove',e=>{
 if(!M||!ptr.down||e.pointerId!==ptr.id)return;e.preventDefault();const p=cpos(e),now=performance.now();
 if(e.pointerType==='mouse'){
  /* Right button pressed while the left is held arrives as a chorded pointermove. */
  if(e.button===2&&(e.buttons&2)){if(toggleBullet())M.rcT=now;}
  /* Left released while right still held: treat as the release of the throw. */
  if(!(e.buttons&1)){ptr.x=p.x;ptr.y=p.y;if(M.aim){M.aim.cx=p.x;M.aim.cy=p.y;}ptrUp(e);return;}
 }
 ptr.x=p.x;ptr.y=p.y;ptr.moved=Math.max(ptr.moved,Math.hypot(p.x-ptr.sx,p.y-ptr.sy));
 ptr.hist.push({x:p.x,y:p.y,t:now});while(ptr.hist.length&&now-ptr.hist[0].t>130)ptr.hist.shift();
 if(M.aim){M.aim.cx=p.x;M.aim.cy=p.y;}
 if(M.kick&&M.kick.sw){M.kick.sw.cx=p.x;M.kick.sw.cy=p.y;}
 /* Do NOT steer continuously while dragging. Retro Bowl interprets the
    completed swipe as a discrete runner command. */
},{passive:false});
function swipeCommand(st,p){
 const dx=(p.x-st.x0)*M.dir,dy=p.y-st.y0,adx=Math.abs(dx),ady=Math.abs(dy);
 if(Math.max(adx,ady)<18)return 'tap';
 if(adx>ady*1.25)return dx>0?'forward':'back';
 return dy<0?'up':'down';
}
function applyRunSwipe(c,cmd){
 if(!c||c.down||c.dive>0)return;
 if(cmd==='forward'){dive(c);return;}
 if(cmd==='back'){c.slow=Math.max(c.slow||0,0.42);return;}
 if(cmd==='up'){stepC(c,-1);return;}
 if(cmd==='down'){stepC(c,1);return;}
}
function ptrUp(e){
 if(!ptr.down||(e&&e.pointerId!==ptr.id))return;ptr.down=false;ptr.id=null;if(!M)return;
 const inp=M.input;M.input=null;
 if(M.aim){const a=M.aim;M.aim=null;if(inp==='aim'&&M.phase==='live'&&M.play==='pass'&&!M.thrown&&!M.carrier){const ai=aimInfo(a);if(ai.pull>=PULL_MIN){if(ai.run)tuck();else throwBall(ai);}}return;}
 if(M.kick&&M.kick.sw){const s=M.kick.sw;M.kick.sw=null;kickRelease(s.cx-s.sx,s.cy-s.sy);return;}
 if(M.steer){const st=M.steer,c=M.carrier;M.steer=null;if(st.chase){if(M.phase==='live'&&Math.hypot(ptr.x-st.x0,ptr.y-st.y0)<18&&performance.now()-ptr.t0<350)chaserDive();return;}if(c&&M.phase==='live'&&inp==='run')applyRunSwipe(c,swipeCommand(st,{x:ptr.x,y:ptr.y}));}
}
cv.addEventListener('pointerup',ptrUp);
cv.addEventListener('pointercancel',e=>{if(e.pointerId!==ptr.id)return;ptr.down=false;ptr.id=null;if(M){M.aim=null;M.steer=null;M.input=null;if(M.kick)M.kick.sw=null;}});
cv.addEventListener('contextmenu',e=>{e.preventDefault();if(!M)return;if(performance.now()-(M.rcT||0)<1500){M.rcT=0;return;}if(toggleBullet())M.rcT=0;});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
const KM={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down'};
addEventListener('keydown',e=>{
 if(e.target&&e.target.tagName==='INPUT')return;
 const k=KM[e.code];if(k)keys[k]=true;
 if(UI.scr!=='game'||!M)return;
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
 if(e.repeat)return;audio();
 const c=e.code;
 if(c==='Escape'){M.paused=!M.paused;return;}
 if(M.paused)return;
 if(M.phase==='replay'){if(c==='Space'&&M.rp)M.rp.fast=true;else if(c==='Enter')endReplay();return;}
 if(M.ov){if(c==='Space'||c==='Enter'){if(M.ov.type==='drive'){if(!M.ov.done)ACT.gSkip();else ACT.gDriveGo();}else if(M.ov.acts)ACT.gAct({i:0});}return;}
 if(M.phase==='pre'){if(c==='Space'||c==='Enter')snap('pass');else if(c==='KeyR')snapRun('dive','HB DIVE');else if(c==='KeyP')M.pb=!M.pb;else if(c==='KeyF')startKick('fg');else if(c==='KeyT')timeout();else if(c==='KeyC')changePlay();return;}
 if(M.phase==='live'){
  if(M.play==='intret'){if(c==='Space')chaserDive();}
  else if(M.carrier){if(c==='Space')dive(M.carrier);else if(c==='KeyK')takeKnee();}
  else if(M.play==='pass'&&!M.thrown){if(c==='KeyR'||c==='Space')tuck();}
  else if(M.play==='ret'&&c==='KeyF')fairCatch();
  return;}
 if(M.phase==='kick'&&M.kick&&M.kick.st==='aim'&&(c==='Space'||c==='Enter')){const pw=clamp(kickNeed()+0.08,0.3,1.04);kickRelease(0,-pw*170);}
});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)keys[k]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;ptr.down=false;ptr.id=null;});

/* ---------- main loop ---------- */
let lastT=performance.now();
function loop(now){
 const dt=Math.min(0.033,(now-lastT)/1000);lastT=now;
 if(UI.scr==='game'&&M){try{if(!M.paused)step(dt);if(M){draw();hud();}}catch(err){console.error(err);}}
 requestAnimationFrame(loop);
}

/* =====================================================================
   BOOT · scaling · mobile
   ===================================================================== */
function fit(){
 const vv=window.visualViewport,w=vv?vv.width:innerWidth,h=vv?vv.height:innerHeight;
 const s=Math.min(w/640,h/360);$('#stage').style.transform='scale('+s+')';
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,250));
if(window.visualViewport)visualViewport.addEventListener('resize',fit);
fit();
document.addEventListener('touchmove',e=>{if(!e.target.closest||!e.target.closest('.scroll'))e.preventDefault();},{passive:false});
if(document.fonts&&document.fonts.load){document.fonts.load('8px "Press Start 2P"').then(()=>{if(UI.scr!=='game')render();}).catch(()=>{});}
go('title');
requestAnimationFrame(loop);
</script>
