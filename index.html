<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f63e6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Retro Football</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bl:#2f63e6;--bl2:#2856d4;--bl3:#1f45ad;--nv:#13286e;--yl:#e3d915;--yl2:#fff36b;--rd:#e8423a;--gr:#3fd04f;--wh:#fff;--dk:#20222e;--dk2:#4d5068;--cy:#7fd0ff;--tx:#fff;--dim:#b7c8ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;color:var(--tx);font-size:8px;line-height:1.5}
#root{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:640px;height:360px;flex:none;background:var(--bl);overflow:hidden;transform-origin:center center}
#cv{position:absolute;left:0;top:0;width:640px;height:360px;image-rendering:pixelated;image-rendering:crisp-edges;display:none;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none}
.screen{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;gap:6px;padding:7px 10px 8px;background:var(--bl) repeating-linear-gradient(0deg,rgba(0,0,30,.06) 0 1px,transparent 1px 3px)}
.row{display:flex;gap:6px;align-items:center}.col{display:flex;flex-direction:column;gap:6px}
.grow{flex:1;min-width:0;min-height:0}.sp{flex:1}.ctr{justify-content:center}.end{justify-content:flex-end}.stretch{align-items:stretch}
.s16{font-size:16px}.s12{font-size:12px}.s10{font-size:10px}.s7{font-size:7px}.s6{font-size:6px}
.dim{color:var(--dim)}.yl{color:var(--yl2)}.rdt{color:#ff7a70}.grt{color:#7dff8a}.cyt{color:var(--cy)}
.ttl{display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;line-height:1;text-shadow:2px 2px 0 var(--nv);white-space:nowrap}
.ttl.sm{font-size:12px}
.tst{display:inline-flex;gap:1px}.tst i{display:inline-block;width:12px;height:12px;clip-path:polygon(50% 0,62% 34%,98% 36%,69% 58%,80% 94%,50% 73%,20% 94%,31% 58%,2% 36%,38% 34%)}
.tst i.r{background:#e3342f}.tst i.w{background:#fff}.tst i.n{background:#14286b}
.box{border:2px solid #fff;position:relative;padding:9px 6px 5px;box-shadow:0 2px 0 rgba(0,0,40,.35)}
.box>.lbl{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:var(--bl);padding:0 4px;white-space:nowrap;line-height:1;font-size:8px}
.box.c{display:flex;align-items:center;justify-content:center;gap:5px}
.bt{font:inherit;font-size:8px;line-height:1.2;color:#fff;background:var(--bl);border:2px solid #fff;padding:7px 8px 6px;box-shadow:0 3px 0 rgba(0,0,40,.45);cursor:pointer;text-transform:uppercase;position:relative;top:0;outline:none;white-space:nowrap;touch-action:manipulation}
.bt:hover{background:var(--bl2)}.bt:active{top:2px;box-shadow:0 1px 0 rgba(0,0,40,.45)}
.bt.y{background:var(--yl);color:#fff;text-shadow:1px 1px 0 #7a7300}.bt.g{background:#2fae3e}.bt.r{background:#c8322b}
.bt.big{font-size:10px;padding:10px 12px 9px}.bt.xl{font-size:12px;padding:12px 16px 11px}
.bt.ico{padding:5px 6px}
.bt:disabled,.bt.dk{background:var(--dk);color:#6c6f88;border-color:#565970;cursor:default;text-shadow:none}
.coin{border:2px solid #fff;padding:4px 7px 3px;display:inline-flex;gap:5px;align-items:center;font-size:10px;line-height:1;white-space:nowrap}
.cc{display:inline-block;width:10px;height:10px;background:var(--yl);border-radius:50%;box-shadow:inset -2px -2px 0 #9c8f00,0 0 0 1px #6e6500;vertical-align:-1px}
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.stars i{display:inline-block;width:8px;height:8px;background:#1d2f78;clip-path:polygon(50% 0,62% 34%,98% 36%,69% 58%,80% 94%,50% 73%,20% 94%,31% 58%,2% 36%,38% 34%)}
.stars.lg i{width:11px;height:11px}.stars.xs i{width:6px;height:6px}
.stars i.f{background:var(--yl2)}.stars i.h{background:linear-gradient(90deg,var(--yl2) 50%,#1d2f78 50%)}
.stars.o i.f{background:#6ad6ff}.stars.o i.h{background:linear-gradient(90deg,#6ad6ff 50%,#1d2f78 50%)}
.stars.d i.f{background:#ff4a3d}.stars.d i.h{background:linear-gradient(90deg,#ff4a3d 50%,#1d2f78 50%)}
.bar{height:12px;border:2px solid #000;background:#000;position:relative;overflow:hidden}.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--yl)}
.segs{display:flex;gap:2px;border:2px solid #000;background:#000;padding:0}.segs i{flex:1;height:14px;background:#33386a}.segs i.on{background:var(--yl)}
.pips{display:inline-flex;gap:2px}.pips i{width:7px;height:8px;background:#1d2f78}.pips i.on{background:var(--yl2)}
.face{image-rendering:pixelated;display:inline-block;vertical-align:middle}
.tbl{width:100%;border-collapse:collapse;font-size:8px}
.tbl th{text-align:left;padding:3px 3px;font-weight:normal;color:#fff;position:sticky;top:0;background:var(--bl)}
.tbl td{padding:3px 3px;white-space:nowrap;vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}.tbl td.c,.tbl th.c{text-align:center}
.tbl tr.me td{color:var(--yl2)}.tbl tr.clk{cursor:pointer}.tbl tr.clk:hover td{background:rgba(255,255,255,.08)}
.scroll{overflow-y:auto;overflow-x:hidden;min-height:0;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:#fff}.scroll::-webkit-scrollbar-track{background:var(--bl3)}
.pcard{width:98px;border:2px solid #fff;background:var(--nv);cursor:pointer;display:flex;flex-direction:column;position:relative;box-shadow:0 3px 0 rgba(0,0,40,.45);top:0}
.pcard:active{top:2px}
.pcard .ph{height:56px;position:relative;background:#8cc8f5;overflow:hidden;display:flex;justify-content:center;align-items:flex-end}
.pcard.D .ph{background:#e88686}.pcard.K .ph{background:#d6a067}
.pcard .ph .pos{position:absolute;left:3px;top:3px;font-size:10px;color:#fff;text-shadow:1px 1px 0 #000}
.pcard .ph .fc{position:absolute;right:3px;top:3px}
.pcard .ph .tg{position:absolute;left:3px;bottom:3px;font-size:6px;padding:2px 2px 1px;line-height:1}
.pcard .nm{text-align:center;font-size:7px;padding:3px 2px 1px;white-space:nowrap;overflow:hidden}
.pcard .st{text-align:center;padding-bottom:3px;line-height:1}
.pcard .cb{height:5px;background:#555}.pcard .cb i{display:block;height:100%;background:var(--gr)}
.pcard.sm{width:86px}.pcard.sm .ph{height:46px}
.pcard.dis{opacity:.45}
.tg.inj{background:var(--rd);color:#fff}.tg.sp{background:var(--yl);color:#000}.tg.ex{background:#fff;color:#000}
.tile{border:2px solid #fff;background:var(--bl);padding:6px 4px 5px;text-align:center;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,40,.45);position:relative;top:0;display:flex;flex-direction:column;gap:4px;align-items:center;font:inherit;color:#fff}
.tile:active{top:2px}.tile .tn{font-size:8px;white-space:nowrap;overflow:hidden;max-width:100%}
.tile.dk{background:var(--dk);border-color:#3c3f52;color:#5d6079;cursor:default}
.tile.dk .stars i.f,.tile.dk .stars i.h{opacity:.55}
.chip{font:inherit;font-size:7px;padding:4px 5px 3px;border:2px solid #fff;background:var(--bl);color:#fff;cursor:pointer;touch-action:manipulation}
.chip.on{background:var(--yl);text-shadow:1px 1px 0 #7a7300}
.modal{position:absolute;inset:0;background:rgba(0,0,30,.6);display:flex;align-items:center;justify-content:center;z-index:60;pointer-events:auto}
.mp{background:var(--bl);border:2px solid #fff;box-shadow:0 4px 0 rgba(0,0,40,.5);padding:10px;display:flex;flex-direction:column;gap:7px;max-width:620px;max-height:350px}
input.txt{font:inherit;font-size:10px;background:var(--nv);border:2px solid #fff;color:#fff;padding:6px 7px;outline:none;width:100%;text-transform:uppercase;-webkit-user-select:text;user-select:text}
.sw{width:15px;height:15px;border:2px solid #000;cursor:pointer;display:inline-block}.sw.on{outline:2px solid #fff}
.ava{image-rendering:pixelated;display:block}
.toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:var(--nv);border:2px solid #fff;padding:6px 9px;z-index:90;font-size:8px;pointer-events:none;animation:fin .2s;white-space:nowrap}
@keyframes fin{from{opacity:0}}
@keyframes pulse{50%{opacity:.35}}.blink{animation:pulse 1s steps(2) infinite}
/* timeline */
.tl{background:var(--yl);height:66px;position:relative;margin:0 -10px;color:#fff;text-shadow:1px 1px 0 #6d6700;cursor:pointer}
.tl .ln{position:absolute;left:0;right:0;top:36px;height:4px;background:#fff}
.tl .ln i{position:absolute;left:0;top:0;bottom:0;background:var(--gr)}
.tl .nd{position:absolute;top:0;width:200px;transform:translateX(-50%);text-align:center;display:flex;flex-direction:column;align-items:center}
.tl .nd .a{font-size:8px;margin-top:5px;white-space:nowrap}.tl .nd .b{font-size:8px;margin-top:3px;white-space:nowrap}
.tl .nd .dot{width:22px;height:12px;border-radius:50%;background:#ddd;border:2px solid #fff;margin-top:4px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.tl .nd .dot.w{background:var(--gr)}.tl .nd .dot.l{background:var(--rd)}.tl .nd .dot.c{background:#fff;width:26px;height:14px}
.tl .nd .r{font-size:8px;margin-top:3px}
/* in-game layer */
.gl{position:absolute;inset:0;pointer-events:none}
.gl .bt,.gl .pe{pointer-events:auto}
.gtop{position:absolute;left:0;right:0;top:0;height:16px;background:#000;display:flex;align-items:center;padding:0 6px;font-size:8px;line-height:1;white-space:nowrap}
.gtop .a{flex:1}.gtop .b{flex:1;text-align:center}.gtop .c{flex:1;text-align:right;padding-right:34px}
.gbot{position:absolute;left:0;right:0;bottom:0;height:18px;background:#0b2a10;display:flex;align-items:center;gap:6px;padding:0 6px;font-size:8px;white-space:nowrap}
.gl .gpause,body.mobile .gl .gpause{position:absolute;right:2px;top:1px;width:28px;height:14px;padding:0;font-size:7px;line-height:1;border-width:1px;box-shadow:none;display:flex;align-items:center;justify-content:center;z-index:30}
.gpause::after{content:'';position:absolute;left:-12px;right:-3px;top:-2px;bottom:-14px}
.gctrl{position:absolute;right:6px;bottom:22px;display:flex;gap:5px;align-items:flex-end}
.ghint{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:7px;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;color:#fff;pointer-events:none}
.gban{position:absolute;left:0;right:0;top:20%;text-align:center;pointer-events:none}
.gban div{display:inline-block;font-size:16px;color:#fff;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 3px 0 #000;animation:fin .15s;line-height:1.3}
.gban small{display:block;font-size:8px;margin-top:5px}
.gov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,30,.45);pointer-events:auto;z-index:20}
.gov .mp{width:470px}
.pbp{font-size:7px;line-height:1.9;height:118px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.pbp div{border-bottom:1px solid rgba(255,255,255,.18);animation:fin .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bracket{display:flex;gap:5px;align-items:stretch}.bracket .rd{display:flex;flex-direction:column;justify-content:space-around;gap:4px;flex:1}
.bm{border:2px solid #fff;font-size:7px;background:var(--bl3)}.bm div{display:flex;justify-content:space-between;padding:3px 4px 2px;gap:4px}
.bm div.w{color:var(--yl2)}.bm div.me{background:#3b6cf0}
#fw{position:absolute;inset:0;width:640px;height:360px;image-rendering:pixelated;pointer-events:none}
body.mobile .bt{padding:8px 9px 7px}body.mobile .chip{padding:6px 7px 5px}
.ngc .chip{padding:4px 7px 3px}.ngc input.txt{padding-top:3px;padding-bottom:2px}
</style>
</head>
<body>
<div id="root"><div id="stage"><canvas id="cv" width="640" height="360"></canvas><div id="ui"></div></div></div>
<script>
'use strict';
/* =====================================================================
   RETRO FOOTBALL — core: data, players, rosters, league, sim, offseason
   ===================================================================== */
const $=(s,r)=>(r||document).querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,u)=>a+(b-a)*u;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const fmtM=v=>Math.round(v)+'M';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const _SH=new Map();
function shade(hex,amt){const key=hex+amt;let v=_SH.get(key);if(v)return v;let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');const n=parseInt(c,16);const r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);v='#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);_SH.set(key,v);return v;}
function lum(hex){const n=parseInt(hex.replace('#',''),16);return((n>>16)*0.299+((n>>8)&255)*0.587+(n&255)*0.114);}
function colDist(a,b){const x=parseInt(a.slice(1),16),y=parseInt(b.slice(1),16);return Math.hypot((x>>16)-(y>>16),((x>>8)&255)-((y>>8)&255),(x&255)-(y&255));}
const ROMAN=n=>{const m=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(const[v,r]of m)while(n>=v){s+=r;n-=v;}return s;};

/* ---------- CONFIG (edit names here) ---------- */
const CFG={champ:'SUPER BOWL',game:'RETRO FOOTBALL',startYear:2026,saveKey:'pixelGridiron_v2',cap:150,capMax:260,capStep:5,capCost:10};
const DIVS=['EAST','NORTH','SOUTH','WEST'];
/* Official NFL franchise identities. Team IDs and order intentionally stay
   stable so existing Pixel Gridiron saves keep pointing at the same clubs. */
const TEAM_DATA=[
 ['Buffalo','Bills','BUF','#00338D','#C60C30'],['Miami','Dolphins','MIA','#008E97','#FC4C02'],['New England','Patriots','NE','#002244','#C60C30'],['New York','Jets','NYJ','#125740','#FFFFFF'],
 ['Baltimore','Ravens','BAL','#241773','#9E7C0C'],['Cincinnati','Bengals','CIN','#FB4F14','#000000'],['Cleveland','Browns','CLE','#311D00','#FF3C00'],['Pittsburgh','Steelers','PIT','#FFB612','#101820'],
 ['Houston','Texans','HOU','#03202F','#A71930'],['Indianapolis','Colts','IND','#002C5F','#A2AAAD'],['Jacksonville','Jaguars','JAX','#006778','#D7A22A'],['Tennessee','Titans','TEN','#0C2340','#4B92DB'],
 ['Denver','Broncos','DEN','#FB4F14','#002244'],['Kansas City','Chiefs','KC','#E31837','#FFB81C'],['Las Vegas','Raiders','LV','#000000','#A5ACAF'],['Los Angeles','Chargers','LAC','#0080C6','#FFC20E'],
 ['Dallas','Cowboys','DAL','#003594','#869397'],['New York','Giants','NYG','#0B2265','#A71930'],['Philadelphia','Eagles','PHI','#004C54','#A5ACAF'],['Washington','Commanders','WAS','#5A1414','#FFB612'],
 ['Chicago','Bears','CHI','#0B162A','#C83803'],['Detroit','Lions','DET','#0076B6','#B0B7BC'],['Green Bay','Packers','GB','#203731','#FFB612'],['Minnesota','Vikings','MIN','#4F2683','#FFC62F'],
 ['Atlanta','Falcons','ATL','#A71930','#000000'],['Carolina','Panthers','CAR','#0085CA','#101820'],['New Orleans','Saints','NO','#D3BC8D','#101820'],['Tampa Bay','Buccaneers','TB','#D50A0A','#34302B'],
 ['Arizona','Cardinals','ARI','#97233F','#000000'],['Los Angeles','Rams','LA','#003594','#FFA300'],['San Francisco','49ers','SF','#AA0000','#B3995D'],['Seattle','Seahawks','SEA','#002244','#69BE28'],
];
const TEAMS=TEAM_DATA.map((d,i)=>({id:i,city:d[0],nickname:d[1],name:d[0]+' '+d[1],abbr:d[2],c1:d[3],c2:d[4],conf:i<16?'AFC':'NFC',div:DIVS[Math.floor(i/4)%4],di:Math.floor(i/4)}));

/* ---------- NFL midfield stadium logos ----------
   The midfield badge is always the home franchise's logo: the user's team for
   home games, and the opponent's team for away games. Logos load on demand from
   ESPN's public logo CDN, and the local abbreviation mark is used as a fallback.
*/
const NFL_LOGO_ESPN_SLUGS={LA:'lar',WAS:'wsh'};
const NFL_FIELD_LOGOS=Object.create(null);
const NFL_FIELD_LOGO_PENDING=new Set();
const NFL_FIELD_LOGO_FAILED=new Set();
function loadFieldLogo(teamId){
 if(NFL_FIELD_LOGOS[teamId]&&NFL_FIELD_LOGOS[teamId].complete&&NFL_FIELD_LOGOS[teamId].naturalWidth)return NFL_FIELD_LOGOS[teamId];
 if(NFL_FIELD_LOGO_PENDING.has(teamId)||NFL_FIELD_LOGO_FAILED.has(teamId))return null;
 const team=TEAMS[teamId];if(!team)return null;
 NFL_FIELD_LOGO_PENDING.add(teamId);
 const img=new Image();
 img.onload=()=>{
  NFL_FIELD_LOGO_PENDING.delete(teamId);NFL_FIELD_LOGOS[teamId]=img;
  if(M&&M.fieldLogoTeam===teamId&&M.fieldCvs)M.fieldCvs=[buildField(false),buildField(true)];
 };
 img.onerror=()=>{
  NFL_FIELD_LOGO_PENDING.delete(teamId);NFL_FIELD_LOGO_FAILED.add(teamId);
  if(M&&M.fieldLogoTeam===teamId&&M.fieldCvs)M.fieldCvs=[buildField(false),buildField(true)];
 };
 const slug=NFL_LOGO_ESPN_SLUGS[team.abbr]||team.abbr.toLowerCase();
 img.src='https://a.espncdn.com/i/teamlogos/nfl/500/'+slug+'.png';
 return null;
}
function drawLocalMidfieldMark(ctx,teamId,x,y){
 const team=TEAMS[teamId];if(!team)return;
 ctx.save();ctx.globalAlpha=0.9;ctx.font='bold 18px "Press Start 2P",monospace';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.lineJoin='round';ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.strokeText(team.abbr,x,y);
 ctx.fillStyle=team.c1;ctx.fillText(team.abbr,x,y);ctx.restore();

/* ---------- schedule: 17 games / 18 weeks / 1 bye ---------- */
function buildSchedule(){

 for(let rep=0;rep<2;rep++)for(let r=0;r<3;r++){const g=[];for(let d=0;d<8;d++)for(const[a,b]of dp[r]){const A=D[d][a],B=D[d][b];g.push(rep===0?[A,B]:[B,A]);}R.push({g,div:1});}

 for(const kk of others){const g=[];for(let c=0;c<2;c++)for(let dd=0;dd<4;dd++){const d2=dd^kk;if(dd>d2)continue;const A=D[c*4+dd],B=D[c*4+d2];for(let i=0;i<4;i++)g.push((i+s+kk)%2?[A[i],B[i]]:[B[i],A[i]]);}R.push({g});}

/* Make every team play 8 or 9 home games (the pairing above can pile home games onto one

  for(const w of L.sched)for(const g of w){if(g.hs!=null)continue;if(hc[g.h]-hc[g.a]>=2){const t=g.h;g.h=g.a;g.a=t;hc[g.a]--;hc[g.h]++;moved=true;}}

 if(q)set(q,{att:v(G*33),cmp:v(G*21),pyd,ptd:v(ptd*(0.8+ovr(q)/25)),pint:v(G*0.75*(1.5-ovr(q)/12),0.3),car:v(G*3),ryd:v(G*(6+attr(q,'spd')*2.5),0.4),rtd:v(2+attr(q,'spd')/3,0.5)});
 if(rb)set(rb,{car:v(G*15),ryd:v(G*15*(3.4+ovr(rb)*0.12)),rtd:v(tds*0.22),rec:v(G*2.5),wyd:v(G*18),wtd:v(1.5,0.6)});
 const sh=[0.32,0.22];wr.slice(0,2).forEach((w,i)=>set(w,{rec:v(G*5.5*sh[i]/0.27*(0.7+ovr(w)/20)),wyd:v(pyd*sh[i]*(0.75+ovr(w)/20)),wtd:v(ptd*sh[i]*(0.75+ovr(w)/20),0.3)}));
 if(te)set(te,{rec:v(G*3.5),wyd:v(pyd*0.16*(0.75+ovr(te)/20)),wtd:v(ptd*0.16,0.4)});
 for(const p of ro){if(p.s.gp>0)continue;const o=ovr(p);
  if(p.pos==='DL')set(p,{tkl:v(G*2.4),sck:v(G*0.32*(o/6),0.35)});
  else if(p.pos==='LB')set(p,{tkl:v(G*5.6*(0.7+o/18)),sck:v(G*0.12*(o/6),0.5),dint:v(o/6,0.6)});
  else if(p.pos==='DB')set(p,{tkl:v(G*3.6),dint:v(G*0.17*(o/6),0.45)});
  else if(p.pos==='K')set(p,{fga:v(G*1.8),fgm:v(G*1.8*(0.68+o/40))});
  else set(p,{});}
}
const offScore=s=>s.pyd/22+s.ptd*4-s.pint*3+(s.ryd+s.wyd)/10+(s.rtd+s.wtd)*6+s.rec*0.3;
const defScore=s=>s.tkl+s.sck*5+s.dint*7;
function statLine(p){const s=p.s;
 if(p.pos==='QB')return`${s.pyd} YDS · ${s.ptd} TD · ${s.pint} INT`;
 if(p.pos==='RB')return`${s.ryd} RUSH YDS · ${s.rtd+s.wtd} TD`;
 if(p.pos==='WR'||p.pos==='TE')return`${s.rec} REC · ${s.wyd} YDS · ${s.wtd} TD`;
 if(p.pos==='K')return`${s.fgm}/${s.fga} FG`;
 return`${s.tkl} TKL · ${s.sck} SCK · ${s.dint} INT`;}
function giveAwards(){
 for(const t of L.teams)if(t.id!==L.user)seasonLineForAI(t.id);
 const pool=L.players.filter(p=>p.team>=0&&p.s&&p.s.gp>0),winsOf=p=>L.teams[p.team].w;
 const offP=pool.filter(p=>['QB','RB','WR','TE'].includes(p.pos)),defP=pool.filter(p=>['DL','LB','DB'].includes(p.pos));
 const best=(arr,f,ex)=>arr.filter(p=>!ex||!ex.includes(p)).sort((a,b)=>f(b)-f(a))[0];
 const mvp=best(offP,p=>offScore(p.s)*(0.7+winsOf(p)/17*0.8)+(p.pos==='QB'?8:0));
 const opoy=best(offP,p=>offScore(p.s),[mvp]);
 const dpoy=best(defP,p=>defScore(p.s));
 const roty=best(pool.filter(p=>(p.seasons||0)===0&&p.pos!=='K'),p=>Math.max(offScore(p.s),defScore(p.s)*1.3));
 const list=[['MVP','MOST VALUABLE PLAYER',mvp],['OPOY','OFFENSIVE PLAYER OF THE YEAR',opoy],['DPOY','DEFENSIVE PLAYER OF THE YEAR',dpoy],['ROTY','ROOKIE OF THE YEAR',roty]].filter(x=>x[2]);
 const out={year:L.year,list:list.map(([a,full,p])=>({a,full,id:p.id,name:fullname(p),pos:p.pos,team:p.team,line:statLine(p)}))};
 for(const [a,,p] of list){p.awards=(p.awards||[]);p.awards.push(a+' '+L.year);
  if(p.team===L.user){p.sp=(p.sp||0)+1;p.mor=clamp(p.mor+20,0,100);L.cc+=10;L.fan=clamp(L.fan+3,0,100);news(fullname(p)+' WINS '+a+'! (+1 SKILL POINT, +10 COINS)');}
  else news(abbr(p.team)+' '+p.pos+' '+fullname(p)+' named '+a+'.');}
 L.awards=L.awards||[];L.awards.unshift(out);L.awardsShow=true;
}
function awardsHTML(A){
 const row=w=>{const p=P(w.id),mine=w.team===L.user;return`<div class="row" style="gap:8px;align-items:center;padding:3px 6px;${mine?'background:rgba(255,230,0,.18);border:2px solid #ffe600':'border:2px solid transparent'}">

  <div class="col" style="gap:3px;flex:1;min-width:0;text-align:left"><span class="${mine?'yl':''}">${w.a} · ${esc(w.name.toUpperCase())}</span><span class="s7 dim" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${w.pos} · ${esc(T(w.team).name.toUpperCase())} · ${w.line}</span></div></div>`;};
 return`<div class="mp" style="width:470px;gap:6px">${ttl(A.year+' SEASON AWARDS',true)}${A.list.map(row).join('')}<div class="row ctr" style="margin-top:4px"><button class="bt y" data-a="awOk">CONTINUE</button></div></div>`;}
function startPlayoffs(){
 try{giveAwards();}catch(e){console.error(e);}
 L.phase='PO';const A=confSeeds('AFC'),N=confSeeds('NFC');
 L.po={seeds:{AFC:A,NFC:N},cur:0,rounds:[],champ:null,runner:null,elim:{}};
 const wc=[];for(const[c,S]of[['AFC',A],['NFC',N]])wc.push(mkG(S[1],S[6],c,S),mkG(S[2],S[5],c,S),mkG(S[3],S[4],c,S));
 L.po.rounds.push(wc);
 news(inPlayoffs(L.user)?'PLAYOFFS! '+teamName(L.user)+' are the '+T(L.user).conf+' #'+(L.po.seeds[T(L.user).conf].indexOf(L.user)+1)+' seed.':teamName(L.user)+' missed the playoffs.');
}
function mkG(h,a,c,S){return{h,a,hs:null,as:null,conf:c,hseed:S?S.indexOf(h)+1:0,aseed:S?S.indexOf(a)+1:0};}
const winnerOf=g=>g.hs>g.as?g.h:g.a,loserOf=g=>g.hs>g.as?g.a:g.h;
function inPlayoffs(t){return L.po&&[...L.po.seeds.AFC,...L.po.seeds.NFC].includes(t);}
function aliveInPO(t){if(!inPlayoffs(t))return false;return L.po.elim[t]==null&&L.po.champ==null;}
function advancePO(){
 const r=L.po.cur,gs=L.po.rounds[r];
 for(const g of gs)L.po.elim[loserOf(g)]=r;
 if(r<2){const nx=[];for(const c of['AFC','NFC']){const S=L.po.seeds[c];let alive=gs.filter(g=>g.conf===c).map(winnerOf);if(r===0)alive.push(S[0]);alive.sort((x,y)=>S.indexOf(x)-S.indexOf(y));if(alive.length===4)nx.push(mkG(alive[0],alive[3],c,S),mkG(alive[1],alive[2],c,S));else nx.push(mkG(alive[0],alive[1],c,S));}L.po.rounds.push(nx);L.po.cur++;}
 else if(r===2){const a=winnerOf(gs.find(g=>g.conf==='AFC')),n=winnerOf(gs.find(g=>g.conf==='NFC'));const h=L.year%2?a:n,aw=h===a?n:a;L.po.rounds.push([{h,a:aw,hs:null,as:null,conf:'SB'}]);L.po.cur++;news(abbr(a)+' vs '+abbr(n)+' in the '+champName()+'!');}
 else{const g=gs[0];L.po.champ=winnerOf(g);L.po.runner=loserOf(g);news(teamName(L.po.champ)+' win '+champName()+'!');if(L.po.champ===L.user){L.titles++;L.champShow=true;}endSeason();}
}

/* ---------- offseason ---------- */
function seasonResultText(){
 const t=L.user;if(!L.po)return'';
 if(L.po.champ===t)return'CHAMPIONS';if(L.po.runner===t)return'LOST '+CFG.champ;
 if(!inPlayoffs(t))return'MISSED PLAYOFFS';if(L.po.elim[t]==null)return'STILL ALIVE';return'LOST '+ROUNDS[L.po.elim[t]];
}
function endSeason(){
 L.phase='OFF';const R=L.teams[L.user],res=seasonResultText();
 let bonus=6;if(inPlayoffs(L.user))bonus+=8;if(L.po.champ===L.user)bonus+=20;L.cc+=bonus;
 L.hist.unshift({year:L.year,team:L.user,w:R.w,l:R.l,t:R.t,res,champ:L.po.champ,pf:R.pf,pa:R.pa});
 L.off={step:'sum',bonus,changes:[],retired:[],hof:[],expiring:[],keep:[]};
 save();
}
function progressPlayer(p){
 const ch={},ks=POSDEF[p.pos];
 let n=p.age<=24?ri(1,3):p.age<=27?ri(0,2):p.age<=29?ri(0,1):p.age<=31?-ri(0,1):-ri(1,3);
 for(let i=0;i<Math.abs(n);i++){const k=pick(ks),b=p.a[k];if(n>0){if(ovr(p)<p.pot+0.4)p.a[k]=Math.min(10,p.a[k]+1);}else p.a[k]=Math.max(1,p.a[k]-1);if(p.a[k]!==b)ch[k]=(ch[k]||0)+(p.a[k]-b);}
 p.peak=Math.max(p.peak||0,ovr(p));return ch;
}
function runOffseasonAging(){
 const O=L.off;O.changes=[];O.retired=[];O.hof=[];
 for(const p of L.players.slice()){
  for(const k in p.s)p.c[k]+=p.s[k];p.s=newStats();
  p.age++;p.seasons++;p.inj=0;p.cond=100;
  const ch=progressPlayer(p);
  if(p.team===L.user&&Object.keys(ch).length)O.changes.push({id:p.id,ch});
  const o=ovr(p);
  if((p.age>=34&&Math.random()<.55)||p.age>=36||(p.age>=31&&o<3.5&&Math.random()<.4)){
   if(p.team===L.user){O.retired.push(fullname(p)+' ('+p.pos+', '+p.age+')');
    const c=p.c,aw=(p.awards||[]),big=c.pyd>=12000||c.ryd>=5000||c.wyd>=6000||c.ptd+c.rtd+c.wtd>=45||c.sck>=40||c.dint>=20||aw.some(a=>a.startsWith('MVP'))||aw.length>=2;
    if((p.peak>=8&&p.seasons>=4)||big){L.hof.unshift({name:fullname(p),pos:p.pos,yrs:p.seasons,team:abbr(L.user),peak:Math.round(p.peak*10)/20,c:Object.assign({},c),year:L.year});O.hof.push(fullname(p));}}
   removePlayer(p);continue;}
  if(p.team===-1&&Math.random()<.35){removePlayer(p);continue;}
  p.mor=clamp(Math.round((p.mor+65)/2),0,100);
 }
 for(const p of L.players)if(p.team>=0)p.yrs--;
 O.expiring=[];
 for(const p of L.players.slice()){
  if(p.team<0||p.yrs>0)continue;
  if(p.team===L.user){O.expiring.push(p.id);continue;}
  if(ovr(p)>=4.5&&p.age<=31&&Math.random()<.75){p.yrs=ri(2,4);p.sal=salFor(starsOf(p),p.age);}else{p.team=-1;p.yrs=ri(1,3);}
 }
 for(const k of['oc','dc'])if(L[k]){L[k].yrs--;if(L[k].yrs<=0){news('Your '+k.toUpperCase()+' '+L[k].ln+' leaves as his contract ends.');L[k]=null;}}
}
function finishResign(keep){
 for(const id of L.off.expiring){const p=P(id);if(!p)continue;
  if(keep.includes(id)){p.yrs=ri(2,4);p.sal=salFor(starsOf(p),p.age);p.mor=clamp(p.mor+10,0,100);}
  else{p.team=-1;p.yrs=ri(1,3);news(fullname(p)+' leaves in free agency.');}}
 L.off.expiring=[];
}

/* ---------- draft: rounds narrow the pool, other teams take players ---------- */
function genProspect(){
 const pos=pick(['QB','RB','WR','WR','TE','OL','OL','K','DL','DL','LB','DB','DB','RB','LB']);
 const q=clamp(2.2+Math.pow(Math.random(),1.45)*6.6+rnd(-0.4,0.6),1.6,9.8);
 const p=genPlayer(pos,q,ri(21,23));p.lvl=1;p.seasons=0;p.pot=clamp(ovr(p)+rnd(0.4,3.4),1,10);p.yrs=3;p.team=-2;
 p.sal=Math.round((0.8+starsOf(p)*0.9)*10)/10;
 const st=starsOf(p),off=pick([0,0.5,0.5,1]),up=pick([0,0.5,0.5,1]);p.scout=[clamp(st-off,0.5,5),clamp(st+up,0.5,5)];
 const pg=p.pot-ovr(p)+rnd(-0.8,0.8);p.potg=pg>2.6?'A':pg>1.8?'B':pg>1?'C':'D';
 return p;
}
function setupDraft(founding){
 const n=founding?40:28,pool=[];for(let i=0;i<n;i++){const p=genProspect();addPlayer(p);pool.push(p.id);}
 let slot;
 if(founding)slot=ri(6,20);
 else{const po=L.po,key=t=>{if(po.champ===t)return 1000;if(po.runner===t)return 900;if(inPlayoffs(t))return 100+(po.elim[t]||0)*100+tpct(L.teams[t])*10;return tpct(L.teams[t])*10;};const ids=L.teams.map(t=>t.id).sort((a,b)=>key(a)-key(b));slot=ids.indexOf(L.user);}
 let rounds=founding?[1,1,3]:(L.picks||[1,1,1]).slice();if(!founding)L.picks=[1,1,1];
 L.draft={founding,pool,rounds,round:0,left:0,slot,log:[],done:false};
 while(L.draft.round<rounds.length&&!rounds[L.draft.round]){draftAI(7);L.draft.round++;}
 if(L.draft.round>=rounds.length){L.draft.done=true;return;}
 L.draft.left=rounds[L.draft.round];
 draftAI(beforeK());
}
const beforeK=()=>Math.round(L.draft.slot/31*5);
function draftAI(n){
 const D=L.draft;
 for(let i=0;i<n&&D.pool.length;i++){
  const cand=D.pool.map(P).filter(Boolean).map(p=>({p,v:ovr(p)+(p.pot-ovr(p))*0.4+rnd(-1.2,1.2)})).sort((a,b)=>b.v-a.v);
  const p=cand[Math.min(cand.length-1,Math.floor(Math.pow(Math.random(),2)*3))].p;
  D.pool.splice(D.pool.indexOf(p.id),1);
  const t=pick(L.teams.filter(x=>x.id!==L.user)).id;delete p.scout;p.team=t;
  const r=rosterOf(t);if(r.length>rmax()){const w=r.filter(x=>x!==p).sort((a,b)=>ovr(a)-ovr(b))[0];if(w){w.team=-1;w.yrs=1;}}
  D.log.unshift({id:p.id,t,r:D.round+1});
 }
}
function draftPick(p){
 const D=L.draft;
 if(p){D.pool.splice(D.pool.indexOf(p.id),1);delete p.scout;p.team=L.user;p.mor=80;D.log.unshift({id:p.id,t:L.user,r:D.round+1});news('You drafted '+p.pos+' '+fullname(p)+' in round '+(D.round+1)+'.');}
 D.left--;
 if(D.left>0){draftAI(1);return;}
 draftAI(Math.max(1,6-beforeK()));
 D.round++;
 while(D.round<D.rounds.length&&!D.rounds[D.round]){draftAI(7);D.round++;}
 if(D.round>=D.rounds.length){D.done=true;return;}
 D.left=D.rounds[D.round];draftAI(beforeK());
}
function finishDraft(){
 const D=L.draft;
 for(const id of D.pool){const p=P(id);if(p){if(Math.random()<.4){p.team=-1;delete p.scout;}else removePlayer(p);}}
 L.draft=null;
 for(const t of L.teams)if(t.id!==L.user)fillAIRoster(t.id);
 if(L.rosterMode!=='NFL')while(faList().length<34)addFA();
}

 const ts=L.teams.map(t=>t.id).filter(t=>t!==L.user).sort((a,b)=>teamRatings(b).ovr-teamRatings(a).ovr);

function migrate(o){
 if(!o.picks)o.picks=[1,1,1];if(!o.settings.dir)o.settings.dir='S';
 for(const p of o.players){const a=p.a;if(a.arm!=null){if(a.str==null)a.str=a.arm;delete a.arm;}if(a.kpw!=null){a.str=a.kpw;delete a.kpw;}
  const have=Object.values(a),avg=have.length?have.reduce((x,y)=>x+y,0)/have.length:4;for(const k of POSDEF[p.pos])if(a[k]==null)a[k]=clamp(Math.round(avg+rnd(-1,1)),1,10);}
}
function tradeValue(p){const v=ovr(p)+(p.pot-ovr(p))*0.5-Math.max(0,p.age-28)*0.4;return v>=7.6?1:v>=6.2?2:v>=4.8?3:0;}
function tradePlayer(p){const r=tradeValue(p);if(!r)return false;const t=pick(L.teams.filter(x=>x.id!==L.user)).id;p.team=t;p.bench=false;const rr=rosterOf(t);if(rr.length>rmax()){const w=rr.filter(x=>x!==p).sort((a,b)=>ovr(a)-ovr(b))[0];if(w){w.team=-1;w.yrs=1;}}L.picks[r-1]++;news('You traded '+p.pos+' '+fullname(p)+' to '+T(t).name+' for a round '+r+' pick.');return r;}
function autoPickTarget(){const sc=p=>p.scout[0]+p.scout[1]+(3-'ABCD'.indexOf(p.potg))*0.4;return L.draft.pool.map(P).filter(Boolean).sort((a,b)=>sc(b)-sc(a))[0];}

 else if(L.phase==='PO'){const r=L.po.cur,g=L.po.rounds[r].find(x=>x.h===t||x.a===t);

  const nd=(gg,i)=>{if(!gg)return{a:lbl(i),b:'',res:null};const home=gg.h===t,op=home?gg.a:gg.h;let res=null;if(gg.hs!=null){const us=home?gg.hs:gg.as,th=home?gg.as:gg.hs;res={c:us>th?'w':'l',txt:(us>th?'W ':'L ')+us+'-'+th};}return{a:lbl(i),b:(home?'vs ':'at ')+T(op).name.toUpperCase(),res};};
  nodes.push(r>0?nd(pr,r-1):{a:'WEEK 18',b:'',res:null},nd(g,r),r<3?{a:lbl(r+1),b:'',res:null}:null);}

function simStats(us,th){
 const lu=lineup(L.user),ps={},S=p=>p?(ps[p.id]=ps[p.id]||{xp:0}):null,add=(p,k,v)=>{const s=S(p);if(s)s[k]=(s[k]||0)+v;};
 const tds=Math.floor(us/7),py=Math.round(rnd(140,300)*(0.7+us/60)),ry=Math.round(rnd(50,140));
 const qb=lu.QB[0];add(qb,'pyd',py);add(qb,'att',ri(20,34));add(qb,'cmp',ri(13,24));
 const recs=[lu.WR[0],lu.WR[1],lu.TE[0],lu.RB[0]];let left=py;recs.forEach((p,i)=>{const y=i===3?left:Math.round(left*rnd(0.25,0.45));left-=y;add(p,'wyd',Math.max(0,y));add(p,'rec',ri(1,6));});
 add(lu.RB[0],'ryd',ry);add(lu.RB[0],'car',ri(10,22));
 for(let i=0;i<tds;i++){const r=Math.random();if(r<0.6){add(qb,'ptd',1);add(pick(recs.filter(Boolean))||null,'wtd',1);}else add(lu.RB[0],'rtd',1);}
 if(Math.random()<0.4)add(qb,'pint',1);
 for(const k of['DL','LB','DB'])for(const p of lu[k]){add(p,'tkl',ri(1,6));if(k==='DL'&&Math.random()<0.4)add(p,'sck',1);if(k==='DB'&&Math.random()<0.15)add(p,'dint',1);}
 const K=lu.K[0];const fg=Math.floor((us%7)/3);add(K,'fga',fg);add(K,'fgm',fg);
 for(const id in ps){const s=ps[id];s.xp=Math.round((s.pyd||0)*0.1+(s.ryd||0)*0.18+(s.wyd||0)*0.14+((s.ptd||0)+(s.rtd||0)+(s.wtd||0))*8+(s.tkl||0)*2+(s.sck||0)*6+(s.dint||0)*8+(s.fgm||0)*5);}
 void th;return ps;
}

 modal(`<div class="mp" style="width:430px;align-items:center;gap:7px">${ttl('APPEARANCE',true)}
 <img class="ava" src="${portrait(prev,p.team>=0?p.team:L.user,3)}" width="72" height="72" style="border:2px solid #fff">
 <div class="row ctr" style="gap:5px;flex-wrap:wrap"><span class="s7" style="width:60px">SKIN</span>${SKIN.map((c,i)=>sw('skin',i,c)).join('')}</div>
 <div class="row ctr" style="gap:4px;flex-wrap:wrap"><span class="s7" style="width:60px">HAIR</span>${HAIRN.map((n,i)=>sw('hair',i,null,n)).join('')}</div>
 <div class="row ctr" style="gap:5px;flex-wrap:wrap"><span class="s7" style="width:60px">COLOR</span>${HAIRC.map((c,i)=>sw('hc',i,c)).join('')}</div>
 <div class="row ctr" style="gap:5px"><span class="s7" style="width:60px">FACE</span>${BEARDN.map((n,i)=>sw('beard',i,null,n)).join('')}</div>
 <div class="row ctr" style="gap:10px;margin-top:3px"><button class="bt" data-a="close">CANCEL</button><button class="bt y" data-a="lkSave">SAVE</button></div></div>`);}
ACT.lkSet=d=>{UI.look[d.k]=+d.v;lookModal();};
ACT.lkSave=()=>{const p=P(UI.sub.id),v=UI.look;Object.assign(p,v);const tb=lookTable();tb[lookKey(p)]=v;try{localStorage.setItem(LOOKS_KEY,JSON.stringify(tb));}catch(e){}
 PRC.clear();for(const k in AVC)delete AVC[k];if(typeof SPC!=='undefined')SPC.clear();save();closeModal();render();toast('LOOK SAVED');};
SCR.player=()=>{
 const p=P(UI.sub.id);if(!p)return SCR.roster();
 const t=p.team>=0?p.team:L.user,mine=p.team===L.user,need=xpNeed(p.lvl);
 const ln=(k,v)=>`<div class="row" style="gap:6px"><span>${k}:</span><span>${v}</span></div>`;
 const attrs=POSDEF[p.pos].map(k=>`<div class="col" style="gap:3px"><div class="row"><span>${ATTR[k]}</span><div class="sp"></div>${mine&&p.sp>0?`<button class="bt" style="padding:2px 6px 1px" data-a="pSp" data-k="${k}" ${p.a[k]<10?'':'disabled'}>+</button>`:''}</div><div class="bar" style="height:16px"><i style="width:${p.a[k]*10}%"></i></div></div>`).join('');
 const met=p.met===L.season*100+L.week;
 return`<div class="screen">
 <div class="row">${coinBox()}<div class="grow">${ttl(p.pos+' - '+esc(fullname(p).toUpperCase()),true)}</div>${mine?`<button class="bt ico" data-a="pRename">${PENCIL}</button>`:'<div style="width:32px"></div>'}</div>
 <div class="row grow stretch" style="gap:8px;margin-top:6px">
  <button class="bt ico" style="align-self:center" data-a="pnav" data-d="-1">&lt;</button>
  <div class="box col" style="flex:1;gap:7px;padding:12px 10px 0"><span class="lbl">${POSNAME[p.pos]}</span>
   <div class="row stretch" style="gap:6px"><div class="col" style="gap:7px;flex:1">
    ${ln('AGE',p.age)}${ln('CONTRACT','$'+Math.round(p.sal)+'M ('+p.yrs+'Y)')}${ln('MORALE',MORW(p.mor)+' '+face(p.mor))}${ln('CONDITION',CNDW(p))}${ln('VALUE',VALW(p))}${p.awards&&p.awards.length?`<div class="row yl s7" style="gap:6px;flex-wrap:wrap">${p.awards.slice(-4).map(a=>'★ '+a).join(' ')}</div>`:''}${p.bench?'<span class="yl">BENCHED</span>':''}
   </div><div class="col" style="align-items:center;gap:4px"><img class="ava" data-a="pLook" title="EDIT LOOK" src="${portrait(p,t,2)}" width="48" height="48" style="cursor:pointer;border:2px solid #fff;background:${sideOf(p.pos)==='D'?'#e88686':sideOf(p.pos)==='K'?'#d6a067':'#8cc8f5'}"><span>#${p.num}</span><span class="s7 dim" data-a="pLook" style="cursor:pointer">EDIT LOOK</span></div></div>
   <div class="row ctr" style="gap:26px;margin-top:4px"><div class="col" style="align-items:center;gap:4px"><span>RATING</span>${stars(starsOf(p),'lg')}</div><div class="col" style="align-items:center;gap:4px"><span>POTENTIAL</span>${stars(potStars(p),'lg')}</div></div>
   <div class="sp"></div>
   <div class="box" style="margin:0 -10px;border-width:2px 0 0 0;padding:10px 8px 8px"><span class="lbl">XP LEVEL ${p.lvl}</span><div class="bar" style="height:14px"><i style="width:${clamp(p.xp/need*100,0,100)}%"></i></div>${mine&&p.sp>0?`<div class="yl blink s7" style="text-align:center;margin-top:4px">${p.sp} SKILL POINT${p.sp>1?'S':''}: TAP + TO UPGRADE</div>`:''}</div>
  </div>
  <div class="box col" style="flex:1;gap:9px;padding:12px 10px 8px"><span class="lbl">ATTRIBUTES</span>${attrs}<div class="sp"></div><div class="s7 dim">${p.pos==='QB'?'QB STRENGTH = HOW FAR HE CAN THROW':p.pos==='K'?'K STRENGTH = HOW FAR HE CAN KICK':'&nbsp;'}</div></div>
  <button class="bt ico" style="align-self:center" data-a="pnav" data-d="1">&gt;</button>
 </div>
 <div class="row" style="gap:8px"><button class="bt ico" data-a="pBack">${ICON.back}</button><div class="sp"></div>
  ${mine?`<button class="bt" style="width:100px" data-a="pBench">${p.bench?'UNBENCH':'BENCH'}</button>`:''}
  <button class="bt" style="width:100px" data-a="pStats">STATS</button>
  ${mine?`<button class="bt" style="width:100px" data-a="pMeet" ${met||L.cc<3?'disabled':''}>MEETING</button><button class="bt" style="width:100px" data-a="pTrade">TRADE</button>`:''}
 </div></div>`;
};
ACT.pc=d=>{const back=UI.scr==='player'?UI.sub.back:UI.scr,bs=UI.scr==='player'?UI.sub.bs:Object.assign({},UI.sub);UI.modal=null;go('player',{id:+d.id,back,bs});};
ACT.pBack=()=>go(UI.sub.back||'roster',UI.sub.bs||{});
ACT.pnav=d=>{const p=P(UI.sub.id),l=plist(p.team>=0?p.team:L.user),i=l.indexOf(p);if(i<0||!l.length)return;UI.sub.id=l[(i+ +d.d+l.length)%l.length].id;render();};
ACT.pSp=d=>{const p=P(UI.sub.id);if(p.sp>0&&p.a[d.k]<10){p.a[d.k]++;p.sp--;p.peak=Math.max(p.peak||0,ovr(p));sfx('coin');save();render();}};
ACT.pBench=()=>{const p=P(UI.sub.id);p.bench=!p.bench;if(p.bench)p.mor=clamp(p.mor-10,0,100);save();render();toast(p.bench?'BENCHED: HE WILL NOT PLAY':'BACK IN THE LINEUP');};
ACT.pMeet=()=>{const p=P(UI.sub.id);if(L.cc<3)return;L.cc-=3;p.met=L.season*100+L.week;const g=p.mor<50?25:15;p.mor=clamp(p.mor+g,0,100);sfx('coin');save();render();toast('MEETING WENT WELL: MORALE +'+g);};
ACT.pStats=()=>{const p=P(UI.sub.id),s=p.s,c=p.c;const row=(l,f)=>`<tr><td>${l}</td><td class="r">${f(s)}</td><td class="r">${f(c)+f(s)}</td></tr>`;
 const R=[['GAMES',x=>x.gp]];if(p.pos==='QB')R.push(['COMPLETIONS',x=>x.cmp],['ATTEMPTS',x=>x.att],['PASS YARDS',x=>x.pyd],['PASS TDS',x=>x.ptd],['INTERCEPTIONS',x=>x.pint],['RUSH YARDS',x=>x.ryd]);
 else if(['RB','WR','TE'].includes(p.pos))R.push(['CARRIES',x=>x.car],['RUSH YARDS',x=>x.ryd],['RUSH TDS',x=>x.rtd],['RECEPTIONS',x=>x.rec],['REC YARDS',x=>x.wyd],['REC TDS',x=>x.wtd],['FUMBLES',x=>x.fum]);
 else if(p.pos==='K')R.push(['FG MADE',x=>x.fgm],['FG ATTEMPTS',x=>x.fga]);
 else if(p.pos!=='OL')R.push(['TACKLES',x=>x.tkl],['SACKS',x=>x.sck],['INTERCEPTIONS',x=>x.dint]);
 modal(`<div class="mp" style="width:380px">${ttl('STATS',true)}<table class="tbl"><tr><th></th><th class="r">${L.year}</th><th class="r">CAREER</th></tr>${R.map(r=>row(r[0],r[1])).join('')}</table><div class="row end"><button class="bt" data-a="close">OK</button></div></div>`);};
ACT.pTrade=()=>{const p=P(UI.sub.id),r=tradeValue(p);modal(`<div class="mp" style="width:420px;align-items:center;text-align:center">${ttl('TRADE',true)}<div>${esc(fullname(p).toUpperCase())}</div><div class="s7 dim" style="line-height:2">${r?'OTHER TEAMS WILL GIVE YOU A ROUND '+r+' DRAFT PICK FOR HIM.':'NO TEAM WANTS TO TRADE FOR HIM. YOU CAN STILL RELEASE HIM.'}</div><div class="row"><button class="bt" data-a="close">CANCEL</button><button class="bt r" data-a="release2" data-id="${p.id}">RELEASE</button>${r?`<button class="bt y" data-a="pTrade2">TRADE FOR RND ${r}</button>`:''}</div></div>`);};
ACT.pTrade2=()=>{const p=P(UI.sub.id),r=tradePlayer(p);if(!r)return;sfx('coin');save();UI.modal=null;toast('TRADED FOR A ROUND '+r+' PICK');go('roster');};
ACT.pRename=()=>{const p=P(UI.sub.id);modal(`<div class="mp" style="width:380px">${ttl('RENAME',true)}<div>FIRST NAME</div><input class="txt" id="rnF" maxlength="12" value="${esc(p.fn.toUpperCase())}"><div>LAST NAME</div><input class="txt" id="rnL" maxlength="14" value="${esc(p.ln.toUpperCase())}"><div class="row end"><button class="bt" data-a="close">CANCEL</button><button class="bt y" data-a="pRename2">SAVE</button></div></div>`);};
ACT.pRename2=()=>{const p=P(UI.sub.id),f=($('#rnF').value||'').trim(),l=($('#rnL').value||'').trim();const cap=x=>x.charAt(0).toUpperCase()+x.slice(1).toLowerCase();if(f)p.fn=cap(f);if(l)p.ln=cap(l);save();closeModal();};
ACT.spAdd=d=>{const p=P(+d.id);if(p.sp>0&&p.a[d.k]<10){p.a[d.k]++;p.sp--;p.peak=Math.max(p.peak||0,ovr(p));sfx('coin');save();modal(pmHTML(p));}};
ACT.extend=d=>{const p=P(+d.id),c=extCost(p);if(L.cc<c)return;L.cc-=c;p.yrs+=3;p.sal=salFor(starsOf(p),p.age);p.mor=clamp(p.mor+15,0,100);news(fullname(p)+' signs a 3-year extension.');save();sfx('coin');modal(pmHTML(p));};
ACT.release=d=>{const p=P(+d.id);modal(`<div class="mp" style="width:380px;align-items:center;text-align:center">${ttl('RELEASE',true)}<div>RELEASE ${esc(fullname(p).toUpperCase())}?</div><div class="s7 dim">HE BECOMES A FREE AGENT. TEAM MORALE DROPS A LITTLE.</div><div class="row"><button class="bt" data-a="pc" data-id="${p.id}">CANCEL</button><button class="bt r" data-a="release2" data-id="${p.id}">RELEASE</button></div></div>`);};
ACT.release2=d=>{const p=P(+d.id);p.team=-1;p.yrs=ri(1,2);for(const q of rosterOf(L.user))q.mor=clamp(q.mor-3,0,100);news('You released '+p.pos+' '+fullname(p)+'.');save();UI.modal=null;if(UI.after){const f=UI.after;UI.after=null;f();}else if(UI.scr==='player')go('roster');else render();};
function needSpotThen(fn){if(rosterOf(L.user).length<rmax())return fn();UI.after=fn;modal(`<div class="mp" style="width:600px">${ttl('ROSTER FULL',true)}<div style="text-align:center">TAP A PLAYER TO RELEASE AND MAKE ROOM</div><div class="row ctr" style="flex-wrap:wrap;gap:6px">${rosterOf(L.user).map(p=>pcard(p,L.user,{sm:true,act:'relPick'})).join('')}</div><div class="row end"><button class="bt" data-a="cancelAfter">CANCEL</button></div></div>`);}
ACT.relPick=d=>{ACT.release2(d);};
ACT.cancelAfter=()=>{UI.after=null;closeModal();};

SCR.teams=()=>{const c=UI.sub.c||T(L.user).conf;return`<div class="screen"><div class="row"><button class="bt ico" data-a="go" data-s="roster">${ICON.back}</button><div class="grow">${ttl('ALL TEAMS')}</div><div style="width:32px"></div></div>
 <div class="row ctr" style="gap:10px"><button class="bt ${c==='AFC'?'y':''}" style="width:120px;padding:5px 0 4px" data-a="tc" data-c="AFC">AFC</button><button class="bt ${c==='NFC'?'y':''}" style="width:120px;padding:5px 0 4px" data-a="tc" data-c="NFC">NFC</button></div>${teamGrid(c,null,'viewT')}</div>`;};
ACT.tc=d=>{UI.sub.c=d.c;render();};
ACT.viewT=d=>go('roster',{t:+d.t});
SCR.standings=()=>{
 const c=UI.sub.c||T(L.user).conf,base=c==='AFC'?0:4,seeds=confSeeds(c);
 const tb=d=>`<div class="box" style="padding:9px 6px 3px"><span class="lbl">${c} ${DIVS[d%4]}</span><table class="tbl"><tr><th>TEAM</th><th class="c">W</th><th class="c">L</th><th class="c">T</th><th class="c">PF</th><th class="c">PA</th></tr>${divStand(d).map(t=>{const R=L.teams[t],sd=seeds.indexOf(t);return`<tr class="${t===L.user?'me':''}"><td>${sd>=0?'<span class="'+(sd<4?'grt':'cyt')+'">'+(sd+1)+'</span> ':'&nbsp; '}${esc(T(t).name.toUpperCase())}</td><td class="c">${R.w}</td><td class="c">${R.l}</td><td class="c">${R.t}</td><td class="c">${R.pf}</td><td class="c">${R.pa}</td></tr>`;}).join('')}</table></div>`;
 return`<div class="screen"><div class="row"><button class="bt ico" data-a="go" data-s="hub">${ICON.back}</button><div class="grow">${ttl('STANDINGS')}</div><div class="row"><span class="chip ${c==='AFC'?'on':''}" data-a="sc" data-c="AFC">AFC</span><span class="chip ${c==='NFC'?'on':''}" data-a="sc" data-c="NFC">NFC</span></div></div>
 <div class="grow" style="display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;align-content:start;margin-top:4px">${[0,1,2,3].map(k=>tb(base+k)).join('')}</div><div class="s7 dim" style="text-align:center">GREEN = DIVISION LEADER SEED · BLUE = WILD CARD · TOP 7 MAKE THE PLAYOFFS</div></div>`;
};
ACT.sc=d=>{UI.sub.c=d.c;render();};
SCR.schedule=()=>{
 const t=L.user;let rows='';
 for(let w=1;w<=18;w++){const g=teamGame(w,t);if(!g){rows+=`<tr class="${w===L.week&&L.phase==='REG'?'me':''}"><td>WEEK ${w}</td><td colspan="2" class="dim">BYE</td></tr>`;continue;}
  const home=g.h===t,op=home?g.a:g.h;let res='';if(g.hs!=null){const us=home?g.hs:g.as,th=home?g.as:g.hs;res=`<span class="${us>th?'grt':us<th?'rdt':'yl'}">${us>th?'W':us<th?'L':'T'} ${us}-${th}</span>`;}
  rows+=`<tr class="${w===L.week&&L.phase==='REG'?'me':''}"><td>WEEK ${w}</td><td>${home?'VS':'AT'} ${esc(T(op).name.toUpperCase())} <span class="dim">${recStr(op)}</span></td><td class="r">${res}</td></tr>`;}
 return`<div class="screen"><div class="row"><button class="bt ico" data-a="go" data-s="hub">${ICON.back}</button><div class="grow">${ttl(L.year+' SCHEDULE')}</div><div style="width:32px"></div></div><div class="box grow scroll" style="padding:4px 8px"><table class="tbl">${rows}</table></div></div>`;
};
SCR.bracket=()=>{
 if(!L.po)return SCR.schedule();
 const bx=g=>{if(!g)return`<div class="bm"><div class="dim">TBD</div><div class="dim">TBD</div></div>`;const ln=(t,s,sd)=>`<div class="${g.hs!=null&&winnerOf(g)===t?'w':''} ${t===L.user?'me':''}"><span>${sd?sd+' ':''}${abbr(t)}</span><span>${s==null?'':s}</span></div>`;return`<div class="bm">${ln(g.a,g.as,g.aseed)}${ln(g.h,g.hs,g.hseed)}</div>`;};
 const R=L.po.rounds,col=(i,c)=>{const gs=R[i]?R[i].filter(g=>g.conf===c):[];let h=`<div class="rd">`;for(let k=0;k<[3,2,1][i];k++)h+=bx(gs[k]);return h+'</div>';};
 return`<div class="screen"><div class="row"><button class="bt ico" data-a="go" data-s="hub">${ICON.back}</button><div class="grow">${ttl('PLAYOFFS')}</div><div style="width:32px"></div></div>
 <div class="row s7"><span>AFC</span><div class="sp"></div><span>NFC</span></div>
 <div class="bracket grow">${col(0,'AFC')}${col(1,'AFC')}${col(2,'AFC')}<div class="rd"><div class="s7 yl" style="text-align:center">${champName()}</div>${bx(R[3]?R[3][0]:null)}${L.po.champ!=null?`<div class="s7" style="text-align:center">CHAMPION: ${abbr(L.po.champ)}</div>`:''}</div>${col(2,'NFC')}${col(1,'NFC')}${col(0,'NFC')}</div></div>`;
};
SCR.hof=()=>{
 const hist=L.hist.map(h=>`<tr><td>${h.year}</td><td>${abbr(h.team)}</td><td>${h.w}-${h.l}${h.t?'-'+h.t:''}</td><td class="${h.res==='CHAMPIONS'?'yl':''}" style="white-space:normal">${h.res}</td></tr>`).join('');
 const hof=L.hof.map(h=>`<tr><td style="white-space:normal">${esc(h.name.toUpperCase())}</td><td>${h.pos}</td><td>${h.team}</td><td>${h.yrs} YRS</td></tr>`).join('');
 return`<div class="screen"><div class="row"><button class="bt ico" data-a="go" data-s="hub">${ICON.back}</button><div class="grow">${ttl('HALL OF FAME')}</div><div class="coin">TITLES ${L.titles}</div></div>
 <div class="row grow stretch" style="gap:10px;margin-top:8px">
  <div class="box col" style="flex:1;padding:12px 6px 4px;min-height:0"><span class="lbl">COACH ${esc(L.coach)}</span><div class="scroll grow"><table class="tbl"><tr><th>YEAR</th><th>TEAM</th><th>REC</th><th>RESULT</th></tr>${hist||'<tr><td colspan="4" class="dim" style="white-space:normal">FIRST SEASON IN PROGRESS</td></tr>'}</table></div></div>
  <div class="box col" style="flex:1;padding:12px 6px 4px;min-height:0"><span class="lbl">INDUCTED PLAYERS</span><div class="scroll grow"><table class="tbl">${hof||'<tr><td class="dim" style="white-space:normal;line-height:2">GREAT PLAYERS WHO RETIRE FROM YOUR TEAM ARE INDUCTED HERE.</td></tr>'}</table></div></div>
 </div></div>`;
};

/* =====================================================================
   FRONT OFFICE / FREE AGENTS / STAFF
   ===================================================================== */
const FAC={stad:['STADIUM','MORE COINS FROM EVERY GAME AND FASTER FAN GROWTH.'],train:['TRAINING FACILITIES','PLAYERS EARN MORE XP.'],rehab:['REHAB FACILITIES','FEWER INJURIES AND FASTER CONDITION RECOVERY.']};
const facCost=lv=>4+lv*4;
SCR.fo=()=>{
 const R=teamRatings(L.user),used=capUsed(L.user);
 const fac=k=>{const lv=L.fac[k];return`<div class="row" style="gap:6px">${box(FAC[k][0],`<div class="segs">${Array.from({length:10},(_,i)=>`<i class="${i<lv?'on':''}"></i>`).join('')}</div>`,'flex:1;padding:10px 6px 6px')}<button class="bt" style="width:62px" data-a="fup" data-k="${k}" ${lv>=10||L.cc<facCost(lv)?'disabled':''}>${lv>=10?'MAX':facCost(lv)+' <i class="cc"></i>'}</button><button class="bt ico" data-a="finfo" data-k="${k}">${ICON.info}</button></div>`;};
 const co=(k,lb)=>{const c=L[k];return`<div class="pcard ${k==='oc'?'':'D'}" style="width:88px;cursor:pointer" data-a="go" data-s="staff"><div class="ph" style="height:52px"><span class="pos">${lb}</span>${c?`<img class="ava" src="${portrait(c,L.user,2,true)}" width="48" height="48">`:''}</div><div class="nm">${c?esc(c.ln.toUpperCase()):'VACANT'}</div><div class="st">${c?stars(c.stars,'xs'):'&nbsp;'}</div></div>`;};
 return`<div class="screen">
 <div class="row">${coinBox()}<div class="grow">${ttl('FRONT OFFICE')}</div><div style="width:50px"></div></div>
 <div class="row grow stretch" style="gap:10px;margin-top:4px">
  <div class="col" style="flex:1.6;gap:11px">
   <div class="row" style="gap:6px">${box('SALARY CAP '+fmtM(used)+' / '+fmtM(L.cap),`<div class="bar"><i style="width:${clamp(used/L.cap*100,0,100)}%;background:${used>L.cap?'var(--rd)':'var(--yl)'}"></i></div>`,'flex:1;padding:10px 6px 6px')}${box('MORALE',`${teamMor(L.user)}% ${face(teamMor(L.user))}`,'width:96px','c')}</div>
   ${fac('stad')}${fac('train')}${fac('rehab')}
  </div>
  <div class="col" style="flex:1;gap:11px">
   ${box('COORDINATORS',`<div class="row ctr" style="gap:8px">${co('oc','OF')}${co('dc','DF')}</div>`,'padding:11px 6px 6px')}
   <div class="row stretch" style="gap:6px">${box('OFFENSE',stars(R.offS,'o'),'flex:1','c')}${box('DEFENSE',stars(R.defS,'d'),'flex:1','c')}</div>
   ${box('DRAFT PICKS','<div style="text-align:center">'+(L.picks||[1,1,1]).join(' - ')+'</div>')}
  </div>
 </div>

 pool.sort((a,b)=>(b.scout[0]+b.scout[1])-(a.scout[0]+a.scout[1]));
 const rows=pool.map(p=>`<tr><td><span class="${sideOf(p.pos)==='D'?'rdt':sideOf(p.pos)==='K'?'yl':'cyt'}">${p.pos}</span></td><td>${esc(pname(p).toUpperCase())}</td><td class="c">${p.age}</td><td>${stars(p.scout[0],'xs')}${p.scout[1]>p.scout[0]?' - '+stars(p.scout[1],'xs'):''}</td><td class="c">${p.potg}</td><td class="r">${D.done?'':`<button class="bt" style="padding:3px 6px 2px" data-a="dpick" data-id="${p.id}">DRAFT</button>`}</td></tr>`).join('');

 const log=D.log.slice(0,14).map(x=>{const p=P(x.id);return p?`<div style="white-space:nowrap;overflow:hidden">${x.t===L.user?'<span class="yl">':''}R${x.r} ${abbr(x.t)}: ${p.pos} ${esc(p.ln.toUpperCase())} ${x.t===L.user?'</span>':''}</div>`:'';}).join('');
 const pk=D.rounds.join(' - ');
 return`<div class="screen">

 <div class="row grow stretch" style="gap:8px">

const PRESS=[
 {w:'win',q:'GREAT WIN TODAY, COACH. WHO DESERVES THE CREDIT?',a:[['THE PLAYERS EARNED THIS ONE.',()=>teamMorAdd(6),'+ TEAM MORALE'],['OUR GAME PLAN WAS PERFECT.',()=>fanAdd(5),'+ FANS'],['WE STILL LEFT POINTS OUT THERE.',()=>{teamMorAdd(-3);fanAdd(3);},'+ FANS, - MORALE']]},
 {w:'loss',q:'TOUGH LOSS. WHAT WENT WRONG OUT THERE?',a:[['THAT ONE IS ON ME.',()=>teamMorAdd(6),'+ TEAM MORALE'],['WE NEED MORE FROM OUR PLAYERS.',()=>{teamMorAdd(-6);fanAdd(3);},'+ FANS, - MORALE'],['NO COMMENT.',()=>fanAdd(-4),'- FANS']]},
 {w:'any',pl:1,q:'IS {P} THE KEY TO THIS TEAM?',a:[['ABSOLUTELY. HE IS A STAR.',p=>{p.mor=clamp(p.mor+15,0,100);},'+ {P} MORALE'],['NOBODY IS BIGGER THAN THE TEAM.',()=>teamMorAdd(3),'+ TEAM MORALE'],['HE STILL HAS A LOT TO PROVE.',p=>{p.mor=clamp(p.mor-15,0,100);fanAdd(3);},'- {P} MORALE, + FANS']]},
 {w:'any',q:'THE FANS WANT A DEEP PLAYOFF RUN. CAN YOU DELIVER?',a:[['MARK MY WORDS: WE WILL.',()=>fanAdd(7),'++ FANS'],['ONE GAME AT A TIME.',()=>teamMorAdd(3),'+ TEAM MORALE'],['ASK ME IN JANUARY.',()=>{},'NO EFFECT']]},
 {w:'win',q:'YOUR OFFENSE LOOKED UNSTOPPABLE. WHAT IS THE SECRET?',a:[['HARD WORK IN PRACTICE.',()=>{for(const p of rosterOf(L.user))gainXP(p,10);},'+10 XP TO EVERYONE'],['WE HAVE THE BEST PLAYERS.',()=>teamMorAdd(6),'+ TEAM MORALE'],['GREAT COACHING, OBVIOUSLY.',()=>{fanAdd(4);teamMorAdd(-3);},'+ FANS, - MORALE']]},
 {w:'loss',pl:1,q:'SHOULD {P} BE WORRIED ABOUT HIS JOB?',a:[['NO. I FULLY TRUST HIM.',p=>{p.mor=clamp(p.mor+15,0,100);},'+ {P} MORALE'],['EVERYONE IS BEING EVALUATED.',p=>{p.mor=clamp(p.mor-8,0,100);teamMorAdd(2);},'- {P} MORALE'],['NEXT QUESTION.',()=>fanAdd(-2),'- FANS']]},
];
const teamMorAdd=v=>{for(const p of rosterOf(L.user))p.mor=clamp(p.mor+v,0,100);};
const fanAdd=v=>{L.fan=clamp(L.fan+v,2,100);};
function gainXP(p,x){const side=sideOf(p.pos),co=side==='O'?L.oc:side==='D'?L.dc:null;const mult=1+0.12*(L.fac.train-1)+(co?co.stars*0.08:0);p.xp+=Math.round(x*mult);let up=0;while(p.xp>=xpNeed(p.lvl)&&p.lvl<30){p.xp-=xpNeed(p.lvl);p.lvl++;p.sp++;up++;}return up;}
function gameRating(p,s,res){
 const pos=p.pos;let r=5;
 if(pos==='QB')r=3+(s.pyd||0)/70+(s.ptd||0)*1.1-(s.pint||0)*1.4+(s.ryd||0)/40;
 else if(pos==='RB')r=3+((s.ryd||0)+(s.wyd||0))/32+((s.rtd||0)+(s.wtd||0))*1.2-(s.fum||0)*2;
 else if(pos==='WR'||pos==='TE')r=3+(s.wyd||0)/26+(s.wtd||0)*1.3+(s.rec||0)*0.2-(s.fum||0)*2;
 else if(pos==='K')r=4+(s.fgm||0)*1.2-((s.fga||0)-(s.fgm||0))*1.5;
 else if(pos==='OL')r=5+(res==='W'?1.5:res==='L'?-1:0)+rnd(-1,1.5);
 else r=3+(s.tkl||0)*0.6+(s.sck||0)*1.6+(s.dint||0)*2.2;
 return clamp(Math.round(r),1,10);
}
function postGame(g,R){
 const home=g.h===L.user,us=R.sc[0],th=R.sc[1];
 finishGame(g,home?us:th,home?th:us);
 const res=us>th?'W':us<th?'L':'T',lu=starterSet(L.user),rows=[];
 for(const p of rosterOf(L.user)){
  const ps=R.ps[p.id]||{},played=lu.has(p.id);
  let x=(ps.xp||0)+(played?14:5)+(res==='W'?8:0);
  for(const k in ps)if(k!=='xp'&&p.s[k]!=null)p.s[k]+=ps[k];
  if(played){p.s.gp++;p.cond=clamp(p.cond-rnd(8,18)*(1.35-attr(p,'stm')*0.07),20,100);}
  const xpb=p.xp,lv0=p.lvl,up=gainXP(p,x);void xpb;
  p.mor=clamp(p.mor+(res==='W'?3:res==='L'?-3:0),0,100);
  let inj=false;if(played&&Math.random()<0.022+(p.cond<50?0.03:0)-L.fac.rehab*0.0015){p.inj=Math.max(1,ri(1,4)-Math.floor(L.fac.rehab/4));inj=true;news(fullname(p)+' ('+p.pos+') is injured for '+p.inj+' week'+(p.inj>1?'s':'')+'.');}
  rows.push({id:p.id,pos:p.pos,nm:pname(p).toUpperCase(),mor:p.mor,cnd:Math.round(p.cond),yds:(ps.pyd||0)+(ps.ryd||0)+(ps.wyd||0),tds:(ps.ptd||0)+(ps.rtd||0)+(ps.wtd||0),tck:ps.tkl||0,is:p.pos==='QB'?(ps.pint||0)+'/'+(ps.sacked||0):['DL','LB','DB'].includes(p.pos)?(ps.dint||0)+'/'+(ps.sck||0):'-',fum:ps.fum||0,rat:played?gameRating(p,ps,res):'-',xp:Math.round(x*(1+0.12*(L.fac.train-1))),up:up>0,inj,played});
 }

function sfx(n){if(!sndOn())return;const ac=audio();if(!ac||!TONES[n])return;let t=ac.currentTime;for(const[f,d]of TONES[n]){const o=ac.createOscillator(),g=ac.createGain();o.type=n==='hit'?'triangle':'square';o.frequency.value=f;g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);t+=d;}}
function crowd(dur,vol){if(!sndOn())return;const ac=audio();if(!ac)return;if(!NOISE){const n=ac.sampleRate*2;NOISE=ac.createBuffer(1,n,ac.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}
 const s=ac.createBufferSource();s.buffer=NOISE;s.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1000;f.Q.value=.5;const g=ac.createGain(),t=ac.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.1,t+.2);g.gain.linearRampToValueAtTime(0,t+dur);s.connect(f).connect(g).connect(ac.destination);s.start(t);s.stop(t+dur+.05);}

/* =====================================================================
   PASSING — custom slingshot model
   ---------------------------------------------------------------------
   Written from Retro Bowl's *observable* behaviour (pull back to aim,
   pull length = power, dotted arc preview, bullet/lob toggle, lead your
   receiver). It is NOT Retro Bowl's code or formulas; those are not
   public. Every constant in PASS is a hand-tuned approximation.

   COORDINATE MAPPING
   - Pointer: cpos() maps CSS pixels -> logical canvas pixels (640x360)
     through getBoundingClientRect(), so CSS scaling, the #stage
     transform and devicePixelRatio never change what a drag "means".
   - Field: yards. x 0..120 along the field (offense always attacks +x
     in field space), y 0..53.33 across, z = height in yards.
   - Field -> screen: sx = wx(x)  (PXY px per yard, mirrored by M.dir)
                      sy = wy(y) - z*PZ  (PYY px per yard across)
   - Screen drag -> field direction: divide by the same scales and flip
     by M.dir. Because the scales are inverted exactly, the dotted arc on
     screen always points straight opposite the drag, in both attack
     directions and at any canvas size.
   ===================================================================== */
const PASS={
 PULL_MIN:10,PULL_MAX:180,   // logical px of drag: no throw below MIN, full power at MAX
 MIN_D:3,                    // shortest throw, yards
 RANGE_BASE:22,RANGE_ARM:3.2,// max air yards = BASE + ARM*(strength-1)
 POW_EXP:1.2,                // distance = MIN_D + p^POW_EXP*(max-MIN_D): fine control on short throws
 G:20,G_LOB:30,               // lobs use a stronger gravity => taller arc for the same flight time                       // stylised gravity, yd/s^2
 REL_Z:2.0,                  // release height (yd)
 CATCH_Z:0,                  // the arc lands exactly on the target circle (receivers catch it on the way down)
 LOB:{v0:14,v1:25},          // horizontal ball speed (yd/s) at p=0 .. p=1
 BUL:{v0:24,v1:35},          // bullet: faster and therefore flatter
 ARM_SPEED:0.03,             // +3% ball speed per strength point above 5
 ERR_BASE:0.35,ERR_PER_YD:0.035, // max placement error (yd) before modifiers
 PRESS_MUL:1.5,MOVE_MUL:1.18,BUL_ERR:1.12,
 SAFE_D:1.6                  // ball can't be played until it is this far from the QB

const PULL_MIN=PASS.PULL_MIN,PULL_MAX=PASS.PULL_MAX; // kept for other code that reads them

/* ---- deterministic randomness for tests ----
   Normal play uses Math.random. window.__pass.seed(n) switches passing
   (placement error + catch rolls + tips) to a seeded generator;
   window.__pass.noError=true removes placement error entirely. */
let passRand=Math.random;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---- trajectory: one analytic flight used by BOTH the preview and the ball ----
   Constant horizontal speed v along (ux,uy); vertical z = z0 + vz*t - G*t^2/2,
   with vz chosen so the ball is at height z1 at time T. After T the ball keeps
   following the same parabola down to the ground (time Tg). */
function makeFlight(x0,y0,z0,x1,y1,z1,T,g){g=g||PASS.G;
 const dx=x1-x0,dy=y1-y0,d=Math.hypot(dx,dy)||1e-6;
 const vz=(z1-z0+0.5*g*T*T)/T;
 const Tg=(vz+Math.sqrt(vz*vz+2*g*Math.max(z0,0)))/g;
 return{x0,y0,z0,g,ux:dx/d,uy:dy/d,v:d/T,vz,T,Tg:Math.max(Tg,T),x1,y1,z1,d};
}
function flightAt(F,t){
 t=clamp(t,0,F.Tg);const s=F.v*t;
 return{x:F.x0+F.ux*s,y:F.y0+F.uy*s,z:Math.max(0,F.z0+F.vz*t-0.5*(F.g||PASS.G)*t*t),t,u:t/F.T,from:s};
}
function throwModel(pull,str,bullet=false){

 const maxR=PASS.RANGE_BASE+PASS.RANGE_ARM*(str-1);

 const S=bullet?PASS.BUL:PASS.LOB;
 const v=(S.v0+p*(S.v1-S.v0))*(1+PASS.ARM_SPEED*(str-5));

/* Turns the current drag into a throw plan (no randomness here). */

 // screen px -> field yards (undo wx/wy scaling and mirroring), then normalise
 let fx=(gx/PXY)*M.dir,fy=gy/PYY;const fl=Math.hypot(fx,fy)||1;fx/=fl;fy/=fl;
 const bullet=!!M.passBullet,tm=throwModel(pull,str,bullet);
 const x0=q.x+0.25,y0=q.y-0.05;
 const tx=x0+fx*tm.d,ty=y0+fy*tm.d;
 const run=pull>=PASS.PULL_MIN&&fx<-0.85;                  // pulling toward the end zone = QB keeps it
 let press=1;for(const f of M.D)if(!f.eng&&f.stun<=0&&d2(f,q)<2.6){press=PASS.PRESS_MUL;break;}
 const moving=Math.hypot(q.vx,q.vy)>1.5?PASS.MOVE_MUL:1;
 // Max placement error (yd). The ring drawn in the preview is exactly this radius,
 // and the real throw can never land outside it.
 const accMul=1.5-0.09*(clamp(acc,1,11)-1);               // acc 1 -> 1.5x, acc 11 -> 0.6x
 const err=(PASS.ERR_BASE+PASS.ERR_PER_YD*tm.d)*accMul*press*moving*(bullet?PASS.BUL_ERR:1)*(1+0.2*Math.max(0,diffLvl()));

 return{tx,ty,x0,y0,d:tm.d,v:tm.v,T:tm.T,p:tm.p,maxR:tm.maxR,run,err,press,moving,pull,str,acc,bullet,F};

/* Commit the throw. Error is applied to the target point only, bounded by ai.err. */
function throwBall(ai){

 if(!window.__pass.noError){
  const ang=passRand()*Math.PI*2,r=ai.err*Math.min(1,Math.abs(gaussR())*0.5); // ~95% inside half... capped at the ring
  tx+=Math.cos(ang)*r;ty+=Math.sin(ang)*r;

 M.ball={F,t:0,T:F.T,Tg:F.Tg,x0:F.x0,y0:F.y0,x1:tx,y1:ty,bullet:ai.bullet};
 window.__pass.last={plan:ai.F,actual:F,err:ai.err};

 // route and comes back for it (short, wide or underthrown balls included).
 let best=null,bt=1e9;
 for(const f of M.O){if(!SKILL.includes(f.role)||f.stun>0||f.down>0)continue;
  const tt=Math.hypot(f.x-tx,f.y-ty)/Math.max(4,f.spd);if(tt<bt){bt=tt;best=f;}}

function gaussR(){let u=0,v=0;while(!u)u=passRand();while(!v)v=passRand();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

/* ---- swept flight + collision ----

   interpolated between their start-of-frame and end-of-frame positions at
   the same fraction, so the test compares ball and player at matching times. */
function passFlightStep(b,t0,t1){

 const n=clamp(Math.ceil(Math.hypot(a1.x-a0.x,a1.y-a0.y,(a1.z-a0.z))/0.2),1,16);
 for(let i=1;i<=n;i++){
  const tt=t0+(t1-t0)*i/n,bp=flightAt(b.F,tt);
  b.t=tt;
  if(b.pend){if(tt>=b.pend.at||tt>=b.F.Tg){const p=b.pend;b.pend=null;resolveContact(b,bp,p);}}
  // A lob can't be touched while it is still climbing: it goes OVER the line.
  // Bullets are flat and can be batted or picked anywhere past the QB.
  else if(b.tip||(bp.from>=PASS.SAFE_D&&(b.bullet||b.F.vz-b.F.g*tt<=0)))catchCheck(b,bp,i/n);

  if(bp.z<=0||tt>=b.F.Tg){b.done=true;M.ball=null;const oob=bp.y<0||bp.y>53.33||bp.x>120;

function posAt(f,a){return f._px==null?{x:f.x,y:f.y}:{x:lerp(f._px,f.x,a),y:lerp(f._py,f.y,a)};}

/* ---- catch envelope ----
   The test is done in SCREEN terms against the drawn sprite (feet up to the
   helmet, plus jump reach), with the ball's ground shadow required to be near

/* Contact scan along the SAME flight. The player is extrapolated with his
   current velocity (fine for the <=0.3 s windows involved). Starting at time
   offset 0, find the first moment the ball is inside his envelope (before
   maxDt), then keep scanning while it stays inside and return the best
   (most central) contact: {h, s, tb = time offset of that best contact}. */

function eligO(f){return SKILL.includes(f.role)&&!f.tried&&!(f.stun>0)&&!(f.down>0&&!(f.dive>0));}

     receiver) -> contested: compare who has the ball more squarely

/* Outcome rules (all spatial first, ratings second):

   - only a defender reaches it  -> ball into his body (s high) is usually

function resolveContact(b,bp,p){

function upLive(dt){

 for(const f of M.O){f._px=f.x;f._py=f.y;}for(const f of M.D){f._px=f.x;f._py=f.y;} // start-of-frame positions for swept catch tests
 const b=M.ball;

     setCarrier(kr);if(M.fair)return endPlay('fair',kr.x,kr.y);if(b.x1<10&&M.retKind==='ko'){M.tbOK=true;M.caughtInEZ=true;}sfx('catch');}

function upQB(f,dt){

 const d=d2(f,c);if(d<1.2||d>3.2)return;

 if(M.ov){if(M.ov.type==='drive'&&!M.ov.done){M.ov.tm-=dt;if(M.ov.tm<=0){revealLine();M.ov.tm=0.34;}}upCam(dt);return;}

   hint=M.conv?'2-POINT TRY · '+(IS_MOBILE?'TOUCH THE FIELD TO SNAP':'CLICK THE FIELD TO SNAP'):(M.plays<4?(IS_MOBILE?'TOUCH &amp; PULL BACK TO SNAP AND THROW':'CLICK &amp; DRAG BACK TO SNAP AND THROW · SPACE PASS · R RUN'):'');
  }else if(M.phase==='live'){
   if(M.play==='pass'&&!M.thrown&&!M.carrier){b.push(`<button class="bt" data-a="gTuck">QB RUN</button>`);if(M.plays<5)hint='PULL BACK &amp; RELEASE TO THROW · LONGER PULL = HARDER THROW · PULL FORWARD TO RUN';}
   else if(M.play==='ret'&&M.retKind==='punt'&&!M.caught&&!M.fair)b.push(`<button class="bt" data-a="gFair">FAIR CATCH</button>`);
   if(M.tbOK)b.push(`<button class="bt" data-a="gKnee">TAKE A KNEE</button>`);
   if(M.carrier&&M.carries<=5)hint=IS_MOBILE?'DRAG UP/DOWN TO MOVE · TAP TO DIVE':'DRAG OR ARROWS / W S TO MOVE · CLICK OR SPACE TO DIVE';
  }
  ctrl=b.join('');
 }
 setH('gctrl',ctrl);setH('ghint',hint);
 setH('gban',M.banT>0&&M.ban?`<div>${esc(M.ban.t)}${M.ban.sub?`<small>${esc(M.ban.sub)}</small>`:''}</div>`:'');
 setH('gov',M.ov?`<div class="gov">${M.ov.html()}</div>`:'');
 setH('gpz',M.paused?`<div class="gov" style="z-index:40"><div class="mp" style="width:300px;align-items:center;text-align:center">${ttl('PAUSED',true)}<button class="bt y big" data-a="gResume">RESUME</button><button class="bt" data-a="gSnd">SOUND: ${L.settings.sound?'ON':'OFF'}</button>${IS_MOBILE?'<button class="bt" data-a="fs">FULL SCREEN</button>':''}<button class="bt r" data-a="gSim">SIM REST OF GAME</button></div></div>`:'');
}

/* ---------- actions ---------- */
ACT.gAct=d=>{if(!M||!M.ov||!M.ov.acts)return;const f=M.ov.acts[+d.i];M.ov=null;if(f)f();};
ACT.gSkip=()=>{if(M&&M.ov&&M.ov.type==='drive')while(!M.ov.done)revealLine();};
ACT.gDriveGo=()=>{if(!M||!M.ov||M.ov.type!=='drive'||!M.ov.done)return;const o=M.ov;M.ov=null;afterOpp(o);};
ACT.gRun=()=>{if(M)snap('run');};
ACT.gCP=()=>{if(M)changePlay();};
function changePlay(){if(!M||M.phase!=='pre'||!(M.cp>0)||M.conv)return;M.cp--;const pk=(f,k,ins)=>{const names=Object.keys(RT[k]).filter(n=>n!==f.rname);const sx=f.x,sy=f.y;setRoute(f,k,pick(names),ins);f.x=sx;f.y=sy;};pk(M.w1,'WR',1);pk(M.w2,'WR',-1);pk(M.te,'TE',-1);pk(M.rb,'RB',-1);sfx('tick');}
ACT.gFG=()=>{if(M)startKick('fg');};
ACT.gKneel=()=>{if(M)kneel();};
ACT.gTO=()=>{if(M)timeout();};
ACT.gTuck=()=>{if(M)tuck();};
ACT.gFair=()=>fairCatch();
ACT.gKnee=()=>takeKnee();
ACT.gPause=()=>{if(M)M.paused=true;};
ACT.gResume=()=>{if(M)M.paused=false;};
ACT.gSnd=()=>{L.settings.sound=!L.settings.sound;save();};
ACT.gSim=()=>{if(M){M.paused=false;simRest();}};

/* ---------- input (mouse + touch, single active pointer) ---------- */
function cpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*CW/r.width,y:(e.clientY-r.top)*CH/r.height};}
cv.addEventListener('pointerdown',e=>{
 if(!M||M.paused||M.ov)return;e.preventDefault();audio();
 /* A second touch while aiming is the touch bullet/lob toggle. It never becomes
    the tracked pointer, so lifting it (or the first finger) can't leave stale state. */
 if(ptr.down&&ptr.id!==e.pointerId){toggleBullet();return;}
 /* Only the primary mouse button aims; right-click is handled as the bullet toggle. */
 if(e.pointerType==='mouse'&&e.button!==0)return;
 const p=cpos(e),now=performance.now();try{cv.setPointerCapture(e.pointerId);}catch(_){ }
 Object.assign(ptr,{down:true,id:e.pointerId,x:p.x,y:p.y,sx:p.x,sy:p.y,t0:now,moved:0,hist:[{x:p.x,y:p.y,t:now}],button:e.button});
 if(M.phase==='pre'){snap('pass');M.aim={sx:p.x,sy:p.y,cx:p.x,cy:p.y};M.input='aim';return;}
 if(M.phase==='live'){
  if(M.play==='pass'&&!M.thrown&&!M.carrier){M.aim={sx:p.x,sy:p.y,cx:p.x,cy:p.y};M.passBullet=false;M.input='aim';return;}
  if(M.carrier){M.steer={x0:p.x,y0:p.y,ty0:M.carrier.ty==null?M.carrier.y:M.carrier.ty};M.input='run';}return;
 }
 if(M.phase==='kick'&&M.kick&&M.kick.st==='aim'){M.kick.sw={sx:p.x,sy:p.y,cx:p.x,cy:p.y};M.input='kick';}
},{passive:false});
cv.addEventListener('pointermove',e=>{
 if(!M||!ptr.down||e.pointerId!==ptr.id)return;e.preventDefault();const p=cpos(e),now=performance.now();
 if(e.pointerType==='mouse'){
  /* Right button pressed while the left is held arrives as a chorded pointermove. */
  if(e.button===2&&(e.buttons&2)){if(toggleBullet())M.rcT=now;}
  /* Left released while right still held: treat as the release of the throw. */
  if(!(e.buttons&1)){ptr.x=p.x;ptr.y=p.y;if(M.aim){M.aim.cx=p.x;M.aim.cy=p.y;}ptrUp(e);return;}
 }
 ptr.x=p.x;ptr.y=p.y;ptr.moved=Math.max(ptr.moved,Math.hypot(p.x-ptr.sx,p.y-ptr.sy));
 ptr.hist.push({x:p.x,y:p.y,t:now});while(ptr.hist.length&&now-ptr.hist[0].t>130)ptr.hist.shift();
 if(M.aim){M.aim.cx=p.x;M.aim.cy=p.y;}
 if(M.kick&&M.kick.sw){M.kick.sw.cx=p.x;M.kick.sw.cy=p.y;}
 /* Do NOT steer continuously while dragging. Retro Bowl interprets the
    completed swipe as a discrete runner command. */
},{passive:false});
function swipeCommand(st,p){
 const dx=(p.x-st.x0)*M.dir,dy=p.y-st.y0,adx=Math.abs(dx),ady=Math.abs(dy);
 if(Math.max(adx,ady)<18)return 'tap';
 if(adx>ady*1.25)return dx>0?'forward':'back';
 return dy<0?'up':'down';
}
function applyRunSwipe(c,cmd){
 if(!c||c.down||c.dive>0)return;
 if(cmd==='forward'){dive(c);return;}
 if(cmd==='back'){c.slow=Math.max(c.slow||0,0.42);return;}
 if(cmd==='up'){stepC(c,-1);return;}
 if(cmd==='down'){stepC(c,1);return;}
}
function ptrUp(e){
 if(!ptr.down||(e&&e.pointerId!==ptr.id))return;ptr.down=false;ptr.id=null;if(!M)return;
 const inp=M.input;M.input=null;
 if(M.aim){const a=M.aim;M.aim=null;if(inp==='aim'&&M.phase==='live'&&M.play==='pass'&&!M.thrown&&!M.carrier){const ai=aimInfo(a);if(ai.pull>=PULL_MIN){if(ai.run)tuck();else throwBall(ai);}}return;}
 if(M.kick&&M.kick.sw){const s=M.kick.sw;M.kick.sw=null;kickRelease(s.cx-s.sx,s.cy-s.sy);return;}
 if(M.steer){const st=M.steer,c=M.carrier;M.steer=null;if(c&&M.phase==='live'&&inp==='run')applyRunSwipe(c,swipeCommand(st,{x:ptr.x,y:ptr.y}));}
}
cv.addEventListener('pointerup',ptrUp);
cv.addEventListener('pointercancel',e=>{if(e.pointerId!==ptr.id)return;ptr.down=false;ptr.id=null;if(M){M.aim=null;M.steer=null;M.input=null;if(M.kick)M.kick.sw=null;}});
cv.addEventListener('contextmenu',e=>{e.preventDefault();if(!M)return;if(performance.now()-(M.rcT||0)<1500){M.rcT=0;return;}if(toggleBullet())M.rcT=0;});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
const KM={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down'};
addEventListener('keydown',e=>{
 if(e.target&&e.target.tagName==='INPUT')return;
 const k=KM[e.code];if(k)keys[k]=true;
 if(UI.scr!=='game'||!M)return;
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
 if(e.repeat)return;audio();
 const c=e.code;
 if(c==='Escape'){M.paused=!M.paused;return;}
 if(M.paused)return;
 if(M.ov){if(c==='Space'||c==='Enter'){if(M.ov.type==='drive'){if(!M.ov.done)ACT.gSkip();else ACT.gDriveGo();}else if(M.ov.acts)ACT.gAct({i:0});}return;}
 if(M.phase==='pre'){if(c==='Space'||c==='Enter')snap('pass');else if(c==='KeyR')snap('run');else if(c==='KeyF')startKick('fg');else if(c==='KeyT')timeout();else if(c==='KeyC')changePlay();return;}
 if(M.phase==='live'){
  if(M.carrier){if(c==='Space')dive(M.carrier);else if(c==='KeyK')takeKnee();}
  else if(M.play==='pass'&&!M.thrown){if(c==='KeyR'||c==='Space')tuck();}
  else if(M.play==='ret'&&c==='KeyF')fairCatch();
  return;}
 if(M.phase==='kick'&&M.kick&&M.kick.st==='aim'&&(c==='Space'||c==='Enter')){const pw=clamp(kickNeed()+0.08,0.3,1.04);kickRelease(0,-pw*170);}
});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)keys[k]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;ptr.down=false;ptr.id=null;});

/* ---------- main loop ---------- */
let lastT=performance.now();
function loop(now){
 const dt=Math.min(0.033,(now-lastT)/1000);lastT=now;
 if(UI.scr==='game'&&M){try{if(!M.paused)step(dt);if(M){draw();hud();}}catch(err){console.error(err);}}
 requestAnimationFrame(loop);
}

/* =====================================================================
   BOOT · scaling · mobile
   ===================================================================== */
function fit(){
 const vv=window.visualViewport,w=vv?vv.width:innerWidth,h=vv?vv.height:innerHeight;
 const s=Math.min(w/640,h/360);$('#stage').style.transform='scale('+s+')';
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,250));
if(window.visualViewport)visualViewport.addEventListener('resize',fit);
fit();
document.addEventListener('touchmove',e=>{if(!e.target.closest||!e.target.closest('.scroll'))e.preventDefault();},{passive:false});
if(document.fonts&&document.fonts.load){document.fonts.load('8px "Press Start 2P"').then(()=>{if(UI.scr!=='game')render();}).catch(()=>{});}
go('title');
requestAnimationFrame(loop);
</script>
