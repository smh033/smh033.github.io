<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f63e6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Retro Football</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bl:#2f63e6;--bl2:#2856d4;--bl3:#1f45ad;--nv:#13286e;--yl:#e3d915;--yl2:#fff36b;--rd:#e8423a;--gr:#3fd04f;--wh:#fff;--dk:#20222e;--dk2:#4d5068;--cy:#7fd0ff;--tx:#fff;--dim:#b7c8ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;color:var(--tx);font-size:8px;line-height:1.5}
#root{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:640px;height:360px;flex:none;background:var(--bl);overflow:hidden;transform-origin:center center}
#cv{position:absolute;left:0;top:0;width:640px;height:360px;image-rendering:pixelated;image-rendering:crisp-edges;display:none;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none}
.screen{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;gap:6px;padding:7px 10px 8px;background:var(--bl) repeating-linear-gradient(0deg,rgba(0,0,30,.06) 0 1px,transparent 1px 3px)}
.row{display:flex;gap:6px;align-items:center}.col{display:flex;flex-direction:column;gap:6px}
.grow{flex:1;min-width:0;min-height:0}.sp{flex:1}.ctr{justify-content:center}.end{justify-content:flex-end}.stretch{align-items:stretch}
.s16{font-size:16px}.s12{font-size:12px}.s10{font-size:10px}.s7{font-size:7px}.s6{font-size:6px}
.dim{color:var(--dim)}.yl{color:var(--yl2)}.rdt{color:#ff7a70}.grt{color:#7dff8a}.cyt{color:var(--cy)}
.ttl{display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;line-height:1;text-shadow:2px 2px 0 var(--nv);white-space:nowrap}
.ttl.sm{font-size:12px}
.tst{display:inline-flex;gap:1px}.tst i{display:inline-block;width:12px;height:12px;clip-path:polygon(50% 0,62% 34%,98% 36%,69% 58%,80% 94%,50% 73%,20% 94%,31% 58%,2% 36%,38% 34%)}
.tst i.r{background:#e3342f}.tst i.w{background:#fff}.tst i.n{background:#14286b}
.box{border:2px solid #fff;position:relative;padding:9px 6px 5px;box-shadow:0 2px 0 rgba(0,0,40,.35)}
.box>.lbl{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:var(--bl);padding:0 4px;white-space:nowrap;line-height:1;font-size:8px}
.box.c{display:flex;align-items:center;justify-content:center;gap:5px}
.bt{font:inherit;font-size:8px;line-height:1.2;color:#fff;background:var(--bl);border:2px solid #fff;padding:7px 8px 6px;box-shadow:0 3px 0 rgba(0,0,40,.45);cursor:pointer;text-transform:uppercase;position:relative;top:0;outline:none;white-space:nowrap;touch-action:manipulation}
.bt:hover{background:var(--bl2)}.bt:active{top:2px;box-shadow:0 1px 0 rgba(0,0,40,.45)}
.bt.y{background:var(--yl);color:#fff;text-shadow:1px 1px 0 #7a7300}.bt.g{background:#2fae3e}.bt.r{background:#c8322b}
.bt.big{font-size:10px;padding:10px 12px 9px}.bt.xl{font-size:12px;padding:12px 16px 11px}
.bt.ico{padding:5px 6px}
.bt:disabled,.bt.dk{background:var(--dk);color:#6c6f88;border-color:#565970;cursor:default;text-shadow:none}
.coin{border:2px solid #fff;padding:4px 7px 3px;display:inline-flex;gap:5px;align-items:center;font-size:10px;line-height:1;white-space:nowrap}
.cc{display:inline-block;width:10px;height:10px;background:var(--yl);border-radius:50%;box-shadow:inset -2px -2px 0 #9c8f00,0 0 0 1px #6e6500;vertical-align:-1px}
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.stars i{display:inline-block;width:8px;height:8px;background:#1d2f78;clip-path:polygon(50% 0,62% 34%,98% 36%,69% 58%,80% 94%,50% 73%,20% 94%,31% 58%,2% 36%,38% 34%)}
.stars.lg i{width:11px;height:11px}.stars.xs i{width:6px;height:6px}
.stars i.f{background:var(--yl2)}.stars i.h{background:linear-gradient(90deg,var(--yl2) 50%,#1d2f78 50%)}
.stars.o i.f{background:#6ad6ff}.stars.o i.h{background:linear-gradient(90deg,#6ad6ff 50%,#1d2f78 50%)}
.stars.d i.f{background:#ff4a3d}.stars.d i.h{background:linear-gradient(90deg,#ff4a3d 50%,#1d2f78 50%)}
.bar{height:12px;border:2px solid #000;background:#000;position:relative;overflow:hidden}.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--yl)}
.segs{display:flex;gap:2px;border:2px solid #000;background:#000;padding:0}.segs i{flex:1;height:14px;background:#33386a}.segs i.on{background:var(--yl)}
.pips{display:inline-flex;gap:2px}.pips i{width:7px;height:8px;background:#1d2f78}.pips i.on{background:var(--yl2)}
.face{image-rendering:pixelated;display:inline-block;vertical-align:middle}
.tbl{width:100%;border-collapse:collapse;font-size:8px}
.tbl th{text-align:left;padding:3px 3px;font-weight:normal;color:#fff;position:sticky;top:0;background:var(--bl)}
.tbl td{padding:3px 3px;white-space:nowrap;vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}.tbl td.c,.tbl th.c{text-align:center}
.tbl tr.me td{color:var(--yl2)}.tbl tr.clk{cursor:pointer}.tbl tr.clk:hover td{background:rgba(255,255,255,.08)}
.scroll{overflow-y:auto;overflow-x:hidden;min-height:0;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:#fff}.scroll::-webkit-scrollbar-track{background:var(--bl3)}
.pcard{width:98px;border:2px solid #fff;background:var(--nv);cursor:pointer;display:flex;flex-direction:column;position:relative;box-shadow:0 3px 0 rgba(0,0,40,.45);top:0}
.pcard:active{top:2px}
.pcard .ph{height:56px;position:relative;background:#8cc8f5;overflow:hidden;display:flex;justify-content:center;align-items:flex-end}
.pcard.D .ph{background:#e88686}.pcard.K .ph{background:#d6a067}
.pcard .ph .pos{position:absolute;left:3px;top:3px;font-size:10px;color:#fff;text-shadow:1px 1px 0 #000}
.pcard .ph .fc{position:absolute;right:3px;top:3px}
.pcard .ph .tg{position:absolute;left:3px;bottom:3px;font-size:6px;padding:2px 2px 1px;line-height:1}
.pcard .nm{text-align:center;font-size:7px;padding:3px 2px 1px;white-space:nowrap;overflow:hidden}
.pcard .st{text-align:center;padding-bottom:3px;line-height:1}
.pcard .cb{height:5px;background:#555}.pcard .cb i{display:block;height:100%;background:var(--gr)}
.pcard.sm{width:86px}.pcard.sm .ph{height:46px}
.pcard.dis{opacity:.45}
.tg.inj{background:var(--rd);color:#fff}.tg.sp{background:var(--yl);color:#000}.tg.ex{background:#fff;color:#000}
.tile{border:2px solid #fff;background:var(--bl);padding:6px 4px 5px;text-align:center;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,40,.45);position:relative;top:0;display:flex;flex-direction:column;gap:4px;align-items:center;font:inherit;color:#fff}
.tile:active{top:2px}.tile .tn{font-size:8px;white-space:nowrap;overflow:hidden;max-width:100%}
.tile.dk{background:var(--dk);border-color:#3c3f52;color:#5d6079;cursor:default}
.tile.dk .stars i.f,.tile.dk .stars i.h{opacity:.55}
.chip{font:inherit;font-size:7px;padding:4px 5px 3px;border:2px solid #fff;background:var(--bl);color:#fff;cursor:pointer;touch-action:manipulation}
.chip.on{background:var(--yl);text-shadow:1px 1px 0 #7a7300}
.modal{position:absolute;inset:0;background:rgba(0,0,30,.6);display:flex;align-items:center;justify-content:center;z-index:60;pointer-events:auto}
.mp{background:var(--bl);border:2px solid #fff;box-shadow:0 4px 0 rgba(0,0,40,.5);padding:10px;display:flex;flex-direction:column;gap:7px;max-width:620px;max-height:350px}
input.txt{font:inherit;font-size:10px;background:var(--nv);border:2px solid #fff;color:#fff;padding:6px 7px;outline:none;width:100%;text-transform:uppercase;-webkit-user-select:text;user-select:text}
.sw{width:15px;height:15px;border:2px solid #000;cursor:pointer;display:inline-block}.sw.on{outline:2px solid #fff}
.ava{image-rendering:pixelated;display:block}
.toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:var(--nv);border:2px solid #fff;padding:6px 9px;z-index:90;font-size:8px;pointer-events:none;animation:fin .2s;white-space:nowrap}
@keyframes fin{from{opacity:0}}
@keyframes pulse{50%{opacity:.35}}.blink{animation:pulse 1s steps(2) infinite}
/* timeline */
.tl{background:var(--yl);height:66px;position:relative;margin:0 -10px;color:#fff;text-shadow:1px 1px 0 #6d6700;cursor:pointer}
.tl .ln{position:absolute;left:0;right:0;top:36px;height:4px;background:#fff}
.tl .ln i{position:absolute;left:0;top:0;bottom:0;background:var(--gr)}
.tl .nd{position:absolute;top:0;width:200px;transform:translateX(-50%);text-align:center;display:flex;flex-direction:column;align-items:center}
.tl .nd .a{font-size:8px;margin-top:5px;white-space:nowrap}.tl .nd .b{font-size:8px;margin-top:3px;white-space:nowrap}
.tl .nd .dot{width:22px;height:12px;border-radius:50%;background:#ddd;border:2px solid #fff;margin-top:4px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.tl .nd .dot.w{background:var(--gr)}.tl .nd .dot.l{background:var(--rd)}.tl .nd .dot.c{background:#fff;width:26px;height:14px}
.tl .nd .r{font-size:8px;margin-top:3px}
/* in-game layer */
.gl{position:absolute;inset:0;pointer-events:none}
.gl .bt,.gl .pe{pointer-events:auto}
.gtop{position:absolute;left:0;right:0;top:0;height:16px;background:#000;display:flex;align-items:center;padding:0 6px;font-size:8px;line-height:1;white-space:nowrap}
.gtop .a{flex:1}.gtop .b{flex:1;text-align:center}.gtop .c{flex:1;text-align:right;padding-right:34px}
.gbot{position:absolute;left:0;right:0;bottom:0;height:18px;background:#0b2a10;display:flex;align-items:center;gap:6px;padding:0 6px;font-size:8px;white-space:nowrap}
.gl .gpause,body.mobile .gl .gpause{position:absolute;right:2px;top:1px;width:28px;height:14px;padding:0;font-size:7px;line-height:1;border-width:1px;box-shadow:none;display:flex;align-items:center;justify-content:center;z-index:30}
.gpause::after{content:'';position:absolute;left:-12px;right:-3px;top:-2px;bottom:-14px}
.gctrl{position:absolute;right:6px;bottom:22px;display:flex;gap:5px;align-items:flex-end}
.ghint{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:7px;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;color:#fff;pointer-events:none}
.gban{position:absolute;left:0;right:0;top:20%;text-align:center;pointer-events:none}
.gban div{display:inline-block;font-size:16px;color:#fff;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 3px 0 #000;animation:fin .15s;line-height:1.3}
.gban small{display:block;font-size:8px;margin-top:5px}
.gov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,30,.45);pointer-events:auto;z-index:20}
.gov .mp{width:470px}
.pbp{font-size:7px;line-height:1.9;height:118px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.pbp div{border-bottom:1px solid rgba(255,255,255,.18);animation:fin .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bracket{display:flex;gap:5px;align-items:stretch}.bracket .rd{display:flex;flex-direction:column;justify-content:space-around;gap:4px;flex:1}
.bm{border:2px solid #fff;font-size:7px;background:var(--bl3)}.bm div{display:flex;justify-content:space-between;padding:3px 4px 2px;gap:4px}
.bm div.w{color:var(--yl2)}.bm div.me{background:#3b6cf0}
#fw{position:absolute;inset:0;width:640px;height:360px;image-rendering:pixelated;pointer-events:none}
body.mobile .bt{padding:8px 9px 7px}body.mobile .chip{padding:6px 7px 5px}
</style>
</head>
<body>
<div id="root"><div id="stage"><canvas id="cv" width="640" height="360"></canvas><div id="ui"></div></div></div>
<script>
'use strict';
/* =====================================================================
   RETRO FOOTBALL — core: data, players, rosters, league, sim, offseason
   ===================================================================== */
const $=(s,r)=>(r||document).querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,u)=>a+(b-a)*u;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const fmtM=v=>Math.round(v)+'M';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const _SH=new Map();
function shade(hex,amt){const key=hex+amt;let v=_SH.get(key);if(v)return v;let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');const n=parseInt(c,16);const r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);v='#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);_SH.set(key,v);return v;}
function lum(hex){const n=parseInt(hex.replace('#',''),16);return((n>>16)*0.299+((n>>8)&255)*0.587+(n&255)*0.114);}
function colDist(a,b){const x=parseInt(a.slice(1),16),y=parseInt(b.slice(1),16);return Math.hypot((x>>16)-(y>>16),((x>>8)&255)-((y>>8)&255),(x&255)-(y&255));}
const ROMAN=n=>{const m=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(const[v,r]of m)while(n>=v){s+=r;n-=v;}return s;};

/* ---------- CONFIG (edit names here) ---------- */
const CFG={champ:'SUPER BOWL',game:'RETRO FOOTBALL',startYear:2026,saveKey:'pixelGridiron_v2',cap:150,capMax:260,capStep:5,capCost:10};
const DIVS=['EAST','NORTH','SOUTH','WEST'];
const TEAM_DATA=[
 ['Buffalo','BUF','#1f4fbf','#e23a3a'],['Miami','MIA','#0f9a9a','#f58a2a'],['New England','NE','#14284b','#d02a3a'],['New Jersey','NJ','#1c6b3e','#ffffff'],
 ['Baltimore','BAL','#3d2585','#d4af37'],['Cincinnati','CIN','#f36b21','#1a1a1a'],['Cleveland','CLE','#5a2d14','#ff6a1f'],['Pittsburgh','PIT','#1c1c1c','#ffb81c'],
 ['Houston','HOU','#0d2a4f','#d0303e'],['Indianapolis','IND','#1a4ea8','#ffffff'],['Jacksonville','JAX','#00788a','#e0b33a'],['Tennessee','TEN','#16335c','#5aa5e6'],
 ['Denver','DEN','#f2611f','#13284a'],['Kansas City','KC','#d81e3a','#ffc22e'],['Las Vegas','LV','#2a2a2a','#b8bec4'],['San Diego','SD','#1189d6','#ffcb1f'],
 ['Dallas','DAL','#123a7a','#c3c9cf'],['New York','NY','#173a8c','#c8202e'],['Philadelphia','PHI','#0b5961','#c3c9cf'],['Washington','WAS','#6a1a1a','#ffbe2a'],
 ['Chicago','CHI','#13223f','#f06424'],['Detroit','DET','#1a82c4','#c9ced3'],['Green Bay','GB','#24493c','#ffbf2a'],['Minnesota','MIN','#5a2e96','#ffcb2f'],
 ['Atlanta','ATL','#b0203a','#1a1a1a'],['Carolina','CAR','#1a92d6','#1a1a1a'],['New Orleans','NO','#1c1c1c','#d6bf8a'],['Tampa Bay','TB','#d61a1a','#3c3833'],
 ['Arizona','ARI','#a3264a','#ffffff'],['Los Angeles','LA','#13409e','#ffd21f'],['San Francisco','SF','#b3141a','#c4a46a'],['Seattle','SEA','#0f2a4e','#77c43a'],
];
const TEAMS=TEAM_DATA.map((d,i)=>({id:i,city:d[0],abbr:d[1],c1:d[2],c2:d[3],conf:i<16?'AFC':'NFC',div:DIVS[Math.floor(i/4)%4],di:Math.floor(i/4)}));
const FN=['James','Michael','Chris','Marcus','Tyler','Jordan','Brandon','Derrick','Andre','Malik','Jalen','Darius','Trevor','Kyle','Ryan','Josh','Cody','Austin','Devin','Terrell','Isaiah','Elijah','Caleb','Mason','Logan','Hunter','Garrett','Cole','Blake','Drew','Shane','Trey','Dante','Xavier','Jamal','Rashad','Corey','Lamar','Deshawn','Tavon','Keenan','Quincy','Reggie','Victor','Omar','Luis','Nate','Sam','Ben','Luke','Jake','Zach','Connor','Brett','Grant','Mitch','Wes','Spencer','Tanner','Bryce','Chase','Colby','Dalton','Eli','Felix','Gavin','Hayden','Ian','Jace','Kendall','Lance','Miles','Noah','Owen','Preston','Quentin','Reid','Seth','Troy','Ty','Vince','Wade','Zane','Aaron','Brady','Carson','Damon','Emmett','Gus','Hank','Ivan','Jerome','Kareem','Leon','Mario','Nico','Otis','Percy','Roman','Tre','Jaylen','Cam','Desmond','Rico','Andy','Brock'];
const LN=['Smith','Johnson','Williams','Brown','Jones','Miller','Davis','Garcia','Wilson','Moore','Taylor','Anderson','Thomas','Jackson','White','Harris','Martin','Thompson','Robinson','Clark','Lewis','Walker','Hall','Allen','Young','King','Wright','Scott','Green','Baker','Adams','Nelson','Hill','Campbell','Mitchell','Roberts','Carter','Phillips','Evans','Turner','Parker','Collins','Edwards','Stewart','Morris','Murphy','Cook','Rogers','Morgan','Cooper','Peterson','Reed','Bailey','Bell','Kelly','Howard','Ward','Cox','Richardson','Wood','Watson','Brooks','Bennett','Gray','Hughes','Price','Sanders','Myers','Long','Ross','Foster','Powell','Jenkins','Perry','Russell','Sullivan','Barnes','Fisher','Henderson','Coleman','Simmons','Patterson','Reynolds','Hamilton','Graham','Wallace','Woods','Cole','West','Owens','Marshall','Ellis','Hayes','Gibson','Bryant','Stone','Holmes','Burke','Fuller','Lane','Banks','Dixon','Pierce','Hunt','Webb','Tucker','Porter','Hicks','Crawford','Boyd','Mason','Warren','Dunn','Black','Rice','Wagner','Knight','Weaver','Holt','Cross','Shaw','Vaughn','Steele','Frost','Rhodes','Quinn','Blair','Nash','Barrett','Booker','Calloway','Darby','Ewing','Gaines','Hollins','Ivory','Kearse','Mabry','Newsome','Oakes','Pruitt','Sutton','Tatum','Upshaw','Vance','Whitfield','Yates'];
const POSL=['QB','RB','WR','TE','OL','DL','LB','DB','K'];
const OFFP=['QB','RB','WR','TE','OL'],DEFP=['DL','LB','DB'];
const sideOf=pos=>pos==='K'?'K':OFFP.includes(pos)?'O':'D';
const POSNAME={QB:'QUARTERBACK',RB:'RUNNING BACK',WR:'WIDE RECEIVER',TE:'TIGHT END',OL:'OFFENSIVE LINE',K:'KICKER',DL:'DEFENSIVE LINE',LB:'LINEBACKER',DB:'DEFENSIVE BACK'};
const POSDEF={QB:['str','acc','spd'],RB:['spd','str','cat'],WR:['cat','str','spd','stm'],TE:['cat','str','blk','spd'],OL:['blk','str','stm'],DL:['tkl','str','spd'],LB:['tkl','str','spd'],DB:['spd','str','stm'],K:['str','kac']};
const ATTRDESC={QB:{str:'HOW FAR HE CAN THROW',acc:'HOW CLOSE THROWS LAND TO YOUR TARGET',spd:'HOW FAST HE SCRAMBLES'},K:{str:'HOW FAR HE CAN KICK',kac:'HOW STRAIGHT HIS KICKS GO'}};
const ATTR={arm:'STRENGTH',acc:'ACCURACY',spd:'SPEED',str:'STRENGTH',cat:'CATCHING',stm:'STAMINA',blk:'BLOCKING',tkl:'TACKLING',kpw:'STRENGTH',kac:'ACCURACY'};
const DEF_ATTR={spd:4,str:4,stm:4,cat:3,blk:3,tkl:3,arm:3,acc:3,kpw:3,kac:3};
const FILL=3;
const NUMR={QB:[1,19],RB:[20,39],WR:[10,19,80,89],TE:[80,89],OL:[60,79],K:[2,9],DL:[90,99],LB:[40,59],DB:[20,39]};
const SKIN=['#f6d0a8','#e8b88a','#c98e5e','#a8703f','#7c4a26','#5a341a'];
const HAIRC=['#16100c','#3a2414','#6b4420','#c8a050','#8a3a1a','#cfcfcf'];
const ROUNDS=['WILD CARD','DIVISIONAL','CONF. CHAMPIONSHIP',CFG.champ];
const AI_T=['QB','RB','WR','WR','TE','OL','DL','LB','DB','K','OL','DB'];
let L=null;

/* ---------- players ---------- */
const attr=(p,k)=>{if(!p)return FILL;const v=p.a[k];return v==null?DEF_ATTR[k]:v;};
function covOf(p){if(!p)return FILL;if(p.pos==='DB')return(p.a.spd+p.a.stm)/2+0.5;if(p.pos==='LB')return(p.a.spd+p.a.tkl)/2-0.5;if(p.pos==='DL')return 2.5;return 3;}
function eff(p,k){const b=k==='cov'?covOf(p):attr(p,k);if(!p)return b;return b*(0.82+0.18*p.cond/100)*(0.96+p.mor/100*0.06);}
function ovr(p){const ks=POSDEF[p.pos];let s=0;for(const k of ks)s+=p.a[k];return s/ks.length;}
const starsOf=p=>clamp(Math.round(ovr(p))/2,0.5,5);
function salFor(st,age){let s=1+st*st*1.25;if(age>=31)s*=0.85;return Math.round(s*10)/10;}
function newStats(){return{gp:0,cmp:0,att:0,pyd:0,ptd:0,pint:0,car:0,ryd:0,rtd:0,rec:0,wyd:0,wtd:0,tkl:0,sck:0,dint:0,fgm:0,fga:0,fum:0};}
const xpNeed=l=>120+l*100;
const pname=p=>p?p.fn[0]+'.'+p.ln:'';
const fullname=p=>p.fn+' '+p.ln;
function genLooks(p){p.skin=ri(0,SKIN.length-1);p.hair=ri(0,6);p.beard=Math.random()<0.45?ri(1,2):0;p.hc=p.skin>=3?(Math.random()<.85?0:ri(0,5)):ri(0,5);}
function genPlayer(pos,q,age){
 age=age||ri(22,32);
 const p={id:L.nid++,fn:pick(FN),ln:pick(LN),pos,age,a:{},lvl:1,xp:0,sp:0,sal:0,yrs:ri(1,4),mor:ri(55,85),cond:100,inj:0,num:0,team:-1,s:newStats(),c:newStats(),pot:0,seasons:0,peak:0};
 genLooks(p);
 for(const k of POSDEF[pos])p.a[k]=clamp(Math.round(q+rnd(-1.4,1.4)),1,10);
 const r=NUMR[pos];p.num=(r.length>2&&Math.random()<.5)?ri(r[2],r[3]):ri(r[0],r[1]);
 p.pot=clamp(ovr(p)+(age<=24?rnd(0.5,3):age<=27?rnd(0,1.2):0),1,10);
 p.lvl=clamp(Math.round((age-21)/2)+1,1,8);p.seasons=Math.max(0,age-22);p.peak=ovr(p);
 p.sal=salFor(starsOf(p),age);
 return p;
}
const P=id=>L.pmap[id];
function indexPlayers(){L.pmap={};for(const p of L.players)L.pmap[p.id]=p;}
function addPlayer(p){L.players.push(p);L.pmap[p.id]=p;return p;}
function removePlayer(p){const i=L.players.indexOf(p);if(i>=0)L.players.splice(i,1);delete L.pmap[p.id];}
const rosterOf=t=>L.players.filter(p=>p.team===t);
const rmax=()=>L.settings.rmax;
const capUsed=t=>rosterOf(t).reduce((s,p)=>s+p.sal,0);
const capRoom=()=>L.cap-capUsed(L.user);
const ccCost=p=>Math.max(2,Math.round(starsOf(p)*starsOf(p)*1.1));
const extCost=p=>Math.max(1,Math.round(starsOf(p)*1.8));

/* ---------- lineup (10/12 stars + filler) ---------- */
const SLOTS=['QB','RB','WR','WR','TE','OL','OL','DL','DL','LB','LB','DB','DB','DB','K'];
const ALTS={WR:['TE','RB'],TE:['WR'],RB:['WR'],DL:['LB'],LB:['DL','DB'],DB:['LB'],OL:['TE','DL'],QB:[],K:[]};
function lineup(t){
 const r=rosterOf(t).filter(p=>p.inj<=0&&!p.bench),used=new Set(),res={QB:[],RB:[],WR:[],TE:[],OL:[],DL:[],LB:[],DB:[],K:[]},slot=[];
 for(const s of SLOTS){let best=null;for(const p of r){if(used.has(p.id)||p.pos!==s)continue;if(!best||ovr(p)>ovr(best))best=p;}if(best)used.add(best.id);slot.push(best);}
 SLOTS.forEach((s,i)=>{if(slot[i])return;let best=null;for(const p of r){if(used.has(p.id)||!ALTS[s].includes(p.pos))continue;if(!best||ovr(p)>ovr(best))best=p;}if(best&&ovr(best)-1.5>FILL){used.add(best.id);slot[i]=best;}});
 SLOTS.forEach((s,i)=>res[s].push(slot[i]||null));
 return res;
}
function starterSet(t){const lu=lineup(t),s=new Set();for(const k in lu)for(const p of lu[k])if(p)s.add(p.id);return s;}
function slotVal(p,pos){if(!p)return FILL;let v=ovr(p)*(0.85+0.15*p.cond/100)*(0.96+p.mor/100*0.06);if(p.pos!==pos)v-=1.5;return v;}
const OFFW={QB:[.3],RB:[.12],WR:[.14,.14],TE:[.1],OL:[.1,.1]},DEFW={DL:[.15,.15],LB:[.14,.14],DB:[.14,.14,.14]};
function diffMult(){const d=L.settings.diff;return d===0?0.92:d===1?1:d===2?1.07:1+(L.dyn-10)*0.012;}
function diffAdj(){const d=L.settings.diff;return d===0?-0.8:d===1?0:d===2?0.7:(L.dyn-10)*0.13;}
const starsTen=v=>clamp(Math.round((v-2)/1.15*2)/2,0.5,5);
function teamRatings(t){
 const lu=lineup(t);let o=0,d=0;
 for(const k in OFFW)OFFW[k].forEach((w,i)=>o+=w*slotVal(lu[k][i],k));
 for(const k in DEFW)DEFW[k].forEach((w,i)=>d+=w*slotVal(lu[k][i],k));
 if(t===L.user){if(L.oc)o+=L.oc.stars*0.18;if(L.dc)d+=L.dc.stars*0.18;}
 else{const m=diffMult();o*=m;d*=m;}
 const k=slotVal(lu.K[0],'K');
 return{off:o*10,def:d*10,k:k*10,ovr:(o+d)*5,offS:starsTen(o),defS:starsTen(d)};
}

/* ---------- teams ---------- */
const T=id=>TEAMS[id];
function teamName(t){const d=T(t);if(t===L.user&&L.custom&&L.custom.nick)return d.city+' '+L.custom.nick;return d.city;}
function teamCol(t){if(L&&t===L.user&&L.custom&&L.custom.c1)return{c1:L.custom.c1,c2:L.custom.c2};return{c1:T(t).c1,c2:T(t).c2};}
const abbr=t=>T(t).abbr;
function zeroRec(){return{w:0,l:0,t:0,pf:0,pa:0,dw:0,dl:0,dt:0,cw:0,cl:0,ct:0,strk:0};}
function pct(w,l,t){const g=w+l+t;return g?(w+t*.5)/g:0;}
const tpct=R=>pct(R.w,R.l,R.t);
const recStr=t=>{const R=L.teams[t];return R.w+'-'+R.l+(R.t?'-'+R.t:'');};
function standCmp(a,b){const A=L.teams[a],B=L.teams[b];return(tpct(B)-tpct(A))||(pct(B.dw,B.dl,B.dt)-pct(A.dw,A.dl,A.dt))||(pct(B.cw,B.cl,B.ct)-pct(A.cw,A.cl,A.ct))||((B.pf-B.pa)-(A.pf-A.pa))||(B.pf-A.pf)||(a-b);}
const divTeams=d=>[0,1,2,3].map(i=>d*4+i);
const divStand=d=>divTeams(d).sort(standCmp);
function confSeeds(c){const base=c==='AFC'?0:4;const win=[0,1,2,3].map(k=>divStand(base+k)[0]).sort(standCmp);const rest=[];for(let k=0;k<4;k++)rest.push(...divStand(base+k).slice(1));rest.sort(standCmp);return[...win,...rest.slice(0,3)];}
const divPlace=t=>divStand(T(t).di).indexOf(t)+1;
const ord=n=>n+(n%100>=11&&n%100<=13?'TH':['TH','ST','ND','RD'][n%10]||'TH');

/* ---------- coordinators ---------- */
const CO_COST=[0,6,12,20,30,42];
function genCoord(side){const st=clamp(Math.round(1+Math.pow(Math.random(),1.3)*4.4),1,5);const c={id:L.nid++,fn:pick(FN),ln:pick(LN),side,stars:st,cost:CO_COST[st],yrs:ri(2,4)};genLooks(c);c.hair=pick([0,1,2,2,5]);return c;}
function refreshStaff(){L.staff={OC:[genCoord('OC'),genCoord('OC'),genCoord('OC')],DC:[genCoord('DC'),genCoord('DC'),genCoord('DC')]};}

/* ---------- league creation ---------- */
function createLeague(ut,coach,opt){
 L={v:2,nid:1,season:1,year:CFG.startYear,week:1,phase:'FOUND',user:ut,coach:(coach||'COACH').toUpperCase().slice(0,14),custom:null,cc:20,fan:50,cap:CFG.cap,
  fac:{stad:1,train:1,rehab:1},oc:null,dc:null,staff:null,players:[],pmap:{},teams:TEAMS.map(t=>Object.assign({id:t.id,tq:rnd(4.3,6.9)},zeroRec())),
  divRank:[],sched:[],po:null,news:[],hist:[],hof:[],settings:{qlen:240,sound:true,diff:opt.diff,rmax:opt.rmax},dyn:10,draft:null,off:null,lastPost:null,lastOffer:1,jobs:null,titles:0,champShow:false,career:[],picks:[1,1,1]};
 L.settings.dir=opt.dir||'S';
 for(let d=0;d<8;d++)L.divRank.push(shuffle(divTeams(d)));
 for(const t of L.teams){if(t.id===ut)continue;fillAIRoster(t.id);}
 const n=rmax()-5,pool=['QB',...shuffle(['RB','WR','WR','TE','OL','DL','LB','DB','K','OL','DB'])].slice(0,n);
 for(const pos of pool){const p=genPlayer(pos,rnd(3.6,5.4),ri(22,30));p.team=ut;p.yrs=ri(1,3);addPlayer(p);}
 for(let i=0;i<34;i++)addFA();
 refreshStaff();buildSchedule();
 news('Welcome to '+teamName(ut)+', Coach '+L.coach+'!');
 setupDraft(true);
}
function fillAIRoster(t){
 const tq=L.teams[t].tq;let r=rosterOf(t);
 for(const pos of AI_T.slice(0,rmax())){if(rosterOf(t).length>=rmax())break;const need=AI_T.slice(0,rmax()).filter(x=>x===pos).length;if(r.filter(p=>p.pos===pos).length>=need)continue;
  const fa=faList().find(p=>p.pos===pos&&Math.abs(ovr(p)-tq)<1.6&&Math.random()<0.6);
  if(fa){fa.team=t;fa.yrs=ri(1,3);}else{const p=genPlayer(pos,clamp(tq+rnd(-1.3,1.3),1.5,9.5));p.team=t;addPlayer(p);}r=rosterOf(t);}
 while(rosterOf(t).length<rmax()){const p=genPlayer(pick(AI_T),clamp(tq+rnd(-1.5,1),1.5,9));p.team=t;addPlayer(p);}
 r=rosterOf(t);if(r.length>rmax()){const st=starterSet(t);const cut=r.filter(p=>!st.has(p.id)).sort((a,b)=>ovr(a)-ovr(b));for(let i=0;i<r.length-rmax()&&i<cut.length;i++){cut[i].team=-1;cut[i].yrs=1;}}
}
function addFA(q){const pos=pick(['QB','RB','WR','WR','TE','OL','OL','K','DL','DL','LB','DB','DB']);let qq=q;if(qq==null){qq=rnd(2.6,5.8);if(Math.random()<.12)qq=rnd(6,7.6);}const p=genPlayer(pos,qq,ri(23,33));p.team=-1;p.yrs=ri(1,3);return addPlayer(p);}
const faList=()=>L.players.filter(p=>p.team===-1).sort((a,b)=>ovr(b)-ovr(a));

/* ---------- schedule: 17 games / 18 weeks / 1 bye ---------- */
function buildSchedule(){
 const s=L.season-1,D=L.divRank,R=[];
 const dp=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
 for(let rep=0;rep<2;rep++)for(let r=0;r<3;r++){const g=[];for(let d=0;d<8;d++)for(const[a,b]of dp[r]){const A=D[d][a],B=D[d][b];g.push(rep===0?[A,B]:[B,A]);}R.push({g,div:1});}
 const k=1+(s%3),others=[1,2,3].filter(x=>x!==k);
 for(let m=0;m<4;m++){const g=[];for(let c=0;c<2;c++)for(let dd=0;dd<4;dd++){const d2=dd^k;if(dd>d2)continue;const A=D[c*4+dd],B=D[c*4+d2];for(let i=0;i<4;i++){const x=A[i],y=B[(i+m)%4];g.push((i+m)%2?[x,y]:[y,x]);}}R.push({g});}
 for(let m=0;m<4;m++){const g=[];for(let dd=0;dd<4;dd++){const A=D[dd],B=D[4+((dd+s)%4)];for(let i=0;i<4;i++){const x=A[i],y=B[(i+m)%4];g.push((i+m+s)%2?[x,y]:[y,x]);}}R.push({g});}
 for(const kk of others){const g=[];for(let c=0;c<2;c++)for(let dd=0;dd<4;dd++){const d2=dd^kk;if(dd>d2)continue;const A=D[c*4+dd],B=D[c*4+d2];for(let i=0;i<4;i++)g.push((i+s+kk)%2?[A[i],B[i]]:[B[i],A[i]]);}R.push({g});}
 const g17=[];for(let dd=0;dd<4;dd++){const A=D[dd],B=D[4+((dd+s+2)%4)];for(let i=0;i<4;i++)g17.push(s%2?[A[i],B[i]]:[B[i],A[i]]);}
 shuffle(g17);
 const divR=shuffle(R.filter(r=>r.div)),oth=shuffle(R.filter(r=>!r.div));
 const order=[...oth.slice(0,6),divR[0],...oth.slice(6,8),divR[1],...oth.slice(8),divR[2],divR[3],divR[4],divR[5]];
 const b1=ri(6,8),b2=ri(10,13);let oi=0;const weeks=[];
 for(let w=1;w<=18;w++){if(w===b1)weeks.push(g17.slice(0,8));else if(w===b2)weeks.push(g17.slice(8));else weeks.push(order[oi++].g);}
 L.sched=weeks.map(gs=>gs.map(([h,a])=>({h,a,hs:null,as:null})));
}
function teamGame(wk,t){const w=L.sched[wk-1];return w?w.find(g=>g.h===t||g.a===t)||null:null;}

/* ---------- simulation ---------- */
function simPts(off,def,home){let pts=0;const n=ri(10,12),edge=(off-def)/100+(home?0.02:0);for(let i=0;i<n;i++){const r=Math.random(),pTD=clamp(0.2+edge*0.55,0.07,0.42),pFG=0.14+edge*0.05;if(r<pTD)pts+=Math.random()<0.94?7:(Math.random()<.5?6:8);else if(r<pTD+pFG)pts+=3;else if(Math.random()<0.008)pts+=2;}return pts;}
function simScore(h,a,po){const H=teamRatings(h),A=teamRatings(a);let hs=simPts(H.off,A.def,true),as=simPts(A.off,H.def,false);if(hs===as&&(po||Math.random()<0.85)){if(Math.random()<0.5+(H.ovr-A.ovr)/200)hs+=Math.random()<.6?3:6;else as+=Math.random()<.6?3:6;}return[hs,as];}
function applyResult(g){
 const H=L.teams[g.h],A=L.teams[g.a],hs=g.hs,as=g.as;H.pf+=hs;H.pa+=as;A.pf+=as;A.pa+=hs;
 const res=hs>as?1:hs<as?-1:0,div=T(g.h).di===T(g.a).di,conf=T(g.h).conf===T(g.a).conf;
 const add=(R,r)=>{if(r>0){R.w++;if(div)R.dw++;if(conf)R.cw++;R.strk=R.strk>0?R.strk+1:1;}else if(r<0){R.l++;if(div)R.dl++;if(conf)R.cl++;R.strk=R.strk<0?R.strk-1:-1;}else{R.t++;if(div)R.dt++;if(conf)R.ct++;R.strk=0;}};
 add(H,res);add(A,-res);
}
function curGames(){if(L.phase==='REG')return L.sched[L.week-1]||[];if(L.phase==='PO')return L.po.rounds[L.po.cur]||[];return[];}
function userGame(){return curGames().find(g=>(g.h===L.user||g.a===L.user)&&g.hs==null)||null;}
function finishGame(g,hs,as){g.hs=hs;g.as=as;if(L.phase==='REG')applyResult(g);}
function simWeekOthers(){for(const g of curGames())if(g.hs==null){const[hs,as]=simScore(g.h,g.a,L.phase==='PO');finishGame(g,hs,as);}}
function weeklyUpkeep(bye){
 for(const p of L.players){if(p.inj>0)p.inj--;p.cond=Math.min(100,p.cond+(bye?26:13)+L.fac.rehab*1.6);}
 for(const p of L.players)if(p.team>=0&&p.team!==L.user&&Math.random()<0.005)p.inj=ri(1,3);
 const fa=faList();for(let i=0;i<3&&fa.length>30;i++){const x=pick(fa);if(x)removePlayer(x);}
 for(let i=0;i<3;i++)addFA();
 for(const p of rosterOf(L.user))p.mor=clamp(p.mor+(65-p.mor)*0.06,0,100);
}
function advanceWeek(){
 simWeekOthers();
 if(L.phase==='REG'){
  const wk=L.week,ug=teamGame(wk,L.user);
  const big=L.sched[wk-1].filter(g=>g!==ug).sort((x,y)=>Math.abs(x.hs-x.as)-Math.abs(y.hs-y.as))[0];
  if(big)news('WK'+wk+': '+abbr(big.h)+' '+big.hs+', '+abbr(big.a)+' '+big.as);
  weeklyUpkeep(!ug);L.week++;
  if(L.week>18)startPlayoffs();
 }else if(L.phase==='PO'){weeklyUpkeep(false);advancePO();}
 save();
}
function startPlayoffs(){
 L.phase='PO';const A=confSeeds('AFC'),N=confSeeds('NFC');
 L.po={seeds:{AFC:A,NFC:N},cur:0,rounds:[],champ:null,runner:null,elim:{}};
 const wc=[];for(const[c,S]of[['AFC',A],['NFC',N]])wc.push(mkG(S[1],S[6],c,S),mkG(S[2],S[5],c,S),mkG(S[3],S[4],c,S));
 L.po.rounds.push(wc);
 news(inPlayoffs(L.user)?'PLAYOFFS! '+teamName(L.user)+' are the '+T(L.user).conf+' #'+(L.po.seeds[T(L.user).conf].indexOf(L.user)+1)+' seed.':teamName(L.user)+' missed the playoffs.');
}
function mkG(h,a,c,S){return{h,a,hs:null,as:null,conf:c,hseed:S?S.indexOf(h)+1:0,aseed:S?S.indexOf(a)+1:0};}
const winnerOf=g=>g.hs>g.as?g.h:g.a,loserOf=g=>g.hs>g.as?g.a:g.h;
function inPlayoffs(t){return L.po&&[...L.po.seeds.AFC,...L.po.seeds.NFC].includes(t);}
function aliveInPO(t){if(!inPlayoffs(t))return false;return L.po.elim[t]==null&&L.po.champ==null;}
function advancePO(){
 const r=L.po.cur,gs=L.po.rounds[r];
 for(const g of gs)L.po.elim[loserOf(g)]=r;
 if(r<2){const nx=[];for(const c of['AFC','NFC']){const S=L.po.seeds[c];let alive=gs.filter(g=>g.conf===c).map(winnerOf);if(r===0)alive.push(S[0]);alive.sort((x,y)=>S.indexOf(x)-S.indexOf(y));if(alive.length===4)nx.push(mkG(alive[0],alive[3],c,S),mkG(alive[1],alive[2],c,S));else nx.push(mkG(alive[0],alive[1],c,S));}L.po.rounds.push(nx);L.po.cur++;}
 else if(r===2){const a=winnerOf(gs.find(g=>g.conf==='AFC')),n=winnerOf(gs.find(g=>g.conf==='NFC'));const h=L.year%2?a:n,aw=h===a?n:a;L.po.rounds.push([{h,a:aw,hs:null,as:null,conf:'SB'}]);L.po.cur++;news(abbr(a)+' vs '+abbr(n)+' in the '+champName()+'!');}
 else{const g=gs[0];L.po.champ=winnerOf(g);L.po.runner=loserOf(g);news(teamName(L.po.champ)+' win '+champName()+'!');if(L.po.champ===L.user){L.titles++;L.champShow=true;}endSeason();}
}
const champName=()=>CFG.champ+' '+ROMAN(59+L.season);

/* ---------- offseason ---------- */
function seasonResultText(){
 const t=L.user;if(!L.po)return'';
 if(L.po.champ===t)return'CHAMPIONS';if(L.po.runner===t)return'LOST '+CFG.champ;
 if(!inPlayoffs(t))return'MISSED PLAYOFFS';return'LOST '+ROUNDS[L.po.elim[t]];
}
function endSeason(){
 L.phase='OFF';const R=L.teams[L.user],res=seasonResultText();
 let bonus=6;if(inPlayoffs(L.user))bonus+=8;if(L.po.champ===L.user)bonus+=20;L.cc+=bonus;
 L.hist.unshift({year:L.year,team:L.user,w:R.w,l:R.l,t:R.t,res,champ:L.po.champ,pf:R.pf,pa:R.pa});
 L.off={step:'sum',bonus,changes:[],retired:[],hof:[],expiring:[],keep:[]};
 save();
}
function progressPlayer(p){
 const ch={},ks=POSDEF[p.pos];
 let n=p.age<=24?ri(1,3):p.age<=27?ri(0,2):p.age<=29?ri(0,1):p.age<=31?-ri(0,1):-ri(1,3);
 for(let i=0;i<Math.abs(n);i++){const k=pick(ks),b=p.a[k];if(n>0){if(ovr(p)<p.pot+0.4)p.a[k]=Math.min(10,p.a[k]+1);}else p.a[k]=Math.max(1,p.a[k]-1);if(p.a[k]!==b)ch[k]=(ch[k]||0)+(p.a[k]-b);}
 p.peak=Math.max(p.peak||0,ovr(p));return ch;
}
function runOffseasonAging(){
 const O=L.off;O.changes=[];O.retired=[];O.hof=[];
 for(const p of L.players.slice()){
  for(const k in p.s)p.c[k]+=p.s[k];p.s=newStats();
  p.age++;p.seasons++;p.inj=0;p.cond=100;
  const ch=progressPlayer(p);
  if(p.team===L.user&&Object.keys(ch).length)O.changes.push({id:p.id,ch});
  const o=ovr(p);
  if((p.age>=34&&Math.random()<.55)||p.age>=36||(p.age>=31&&o<3.5&&Math.random()<.4)){
   if(p.team===L.user){O.retired.push(fullname(p)+' ('+p.pos+', '+p.age+')');
    const c=p.c,big=c.pyd>=12000||c.ryd>=5000||c.wyd>=6000||c.ptd+c.rtd+c.wtd>=45||c.sck>=40||c.dint>=20;
    if((p.peak>=8&&p.seasons>=4)||big){L.hof.unshift({name:fullname(p),pos:p.pos,yrs:p.seasons,team:abbr(L.user),peak:Math.round(p.peak*10)/20,c:Object.assign({},c),year:L.year});O.hof.push(fullname(p));}}
   removePlayer(p);continue;}

  const t=pick(L.teams.filter(x=>x.id!==L.user)).id;delete p.scout;p.team=t;

 if(L.phase==='REG'){const w=L.week;nodes.push(w>1?wk(w-1):null,wk(w),w<18?wk(w+1):{a:T(t).conf+' WILD CARD',b:'',res:null});}
 else if(L.phase==='PO'){const r=L.po.cur,g=L.po.rounds[r].find(x=>x.h===t||x.a===t);
  const pr=r>0?L.po.rounds[r-1].find(x=>x.h===t||x.a===t):null;
  const lbl=i=>i===3?champName():T(t).conf+' '+ROUNDS[i];
  const nd=(gg,i)=>{if(!gg)return{a:lbl(i),b:'',res:null};const home=gg.h===t,op=home?gg.a:gg.h;let res=null;if(gg.hs!=null){const us=home?gg.hs:gg.as,th=home?gg.as:gg.hs;res={c:us>th?'w':'l',txt:(us>th?'W ':'L ')+us+'-'+th};}return{a:lbl(i),b:(home?'vs ':'at ')+T(op).city.toUpperCase(),res};};
  nodes.push(r>0?nd(pr,r-1):{a:'WEEK 18',b:'',res:null},nd(g,r),r<3?{a:lbl(r+1),b:'',res:null}:null);}
 return nodes;
}

function simStats(us,th){
 const lu=lineup(L.user),ps={},S=p=>p?(ps[p.id]=ps[p.id]||{xp:0}):null,add=(p,k,v)=>{const s=S(p);if(s)s[k]=(s[k]||0)+v;};
 const tds=Math.floor(us/7),py=Math.round(rnd(140,300)*(0.7+us/60)),ry=Math.round(rnd(50,140));
 const qb=lu.QB[0];add(qb,'pyd',py);add(qb,'att',ri(20,34));add(qb,'cmp',ri(13,24));
 const recs=[lu.WR[0],lu.WR[1],lu.TE[0],lu.RB[0]];let left=py;recs.forEach((p,i)=>{const y=i===3?left:Math.round(left*rnd(0.25,0.45));left-=y;add(p,'wyd',Math.max(0,y));add(p,'rec',ri(1,6));});
 add(lu.RB[0],'ryd',ry);add(lu.RB[0],'car',ri(10,22));
 for(let i=0;i<tds;i++){const r=Math.random();if(r<0.6){add(qb,'ptd',1);add(pick(recs.filter(Boolean))||null,'wtd',1);}else add(lu.RB[0],'rtd',1);}
 if(Math.random()<0.4)add(qb,'pint',1);
 for(const k of['DL','LB','DB'])for(const p of lu[k]){add(p,'tkl',ri(1,6));if(k==='DL'&&Math.random()<0.4)add(p,'sck',1);if(k==='DB'&&Math.random()<0.15)add(p,'dint',1);}
 const K=lu.K[0];const fg=Math.floor((us%7)/3);add(K,'fga',fg);add(K,'fgm',fg);
 for(const id in ps){const s=ps[id];s.xp=Math.round((s.pyd||0)*0.1+(s.ryd||0)*0.18+(s.wyd||0)*0.14+((s.ptd||0)+(s.rtd||0)+(s.wtd||0))*8+(s.tkl||0)*2+(s.sck||0)*6+(s.dint||0)*8+(s.fgm||0)*5);}
 void th;return ps;
}

ACT.rnav=d=>{let t=UI.sub.t!=null?UI.sub.t:L.user;t=(t+ +d.d+32)%32;UI.sub.t=t;render();};
ACT.rinfo=()=>modal(`<div class="mp" style="width:440px">${ttl('ROSTER',true)}<div style="line-height:2">YOU CAN HAVE ${rmax()} STAR PLAYERS. EVERY OTHER SPOT ON THE FIELD IS A GENERIC BACKUP (1.5 STARS).<br>OFFENSE STARS COME FROM QB, RB, WR, TE AND OL. DEFENSE STARS COME FROM DL, LB AND DB.<br>THE GREEN BAR IS CONDITION. TIRED PLAYERS PLAY WORSE.<br>TAP A PLAYER TO UPGRADE, EXTEND OR RELEASE.</div><button class="bt" data-a="close">OK</button></div>`);
function pmHTML(p,o){
 o=o||{};const mine=p.team===L.user,t=p.team>=0?p.team:L.user,need=xpNeed(p.lvl),st=p.s;
 const sl=p.pos==='QB'?`${st.cmp}/${st.att} ${st.pyd} YDS ${st.ptd} TD ${st.pint} INT`:(p.pos==='RB')?`${st.ryd} RUSH YDS ${st.rtd} TD ${st.wyd} REC YDS`:(p.pos==='WR'||p.pos==='TE')?`${st.rec} REC ${st.wyd} YDS ${st.wtd} TD`:p.pos==='K'?`${st.fgm}/${st.fga} FG`:p.pos==='OL'?`${st.gp} GAMES`:`${st.tkl} TCK ${st.sck} SACK ${st.dint} INT`;
 const rows=POSDEF[p.pos].map(k=>`<div class="row" style="gap:6px"><span style="width:118px">${ATTR[k]}</span>${pips(p.a[k])}${mine?`<button class="bt" style="padding:2px 5px 1px" data-a="spAdd" data-id="${p.id}" data-k="${k}" ${p.sp>0&&p.a[k]<10?'':'disabled'}>+</button>`:''}</div>`).join('');
 let btns='';
 if(o.sign){const c=ccCost(p),full=rosterOf(L.user).length>=rmax(),ok=L.cc>=c&&capRoom()>=p.sal;btns=`<button class="bt" data-a="close">BACK</button><button class="bt y" data-a="sign" data-id="${p.id}" ${ok?'':'disabled'}>SIGN · ${c} <i class="cc"></i></button>${full?'<span class="s7 rdt">ROSTER FULL: YOU WILL RELEASE SOMEONE</span>':''}${capRoom()<p.sal?'<span class="s7 rdt">NOT ENOUGH CAP</span>':''}`;}
 else if(mine)btns=`<button class="bt" data-a="close">BACK</button>${p.yrs<=1&&L.phase!=='OFF'?`<button class="bt g" data-a="extend" data-id="${p.id}" ${L.cc>=extCost(p)?'':'disabled'}>EXTEND · ${extCost(p)} <i class="cc"></i></button>`:''}<button class="bt r" data-a="release" data-id="${p.id}">RELEASE</button>`;
 else btns=`<button class="bt" data-a="close">BACK</button>`;
 return`<div class="mp" style="width:560px"><div class="row stretch" style="gap:12px">
  <div class="col" style="align-items:center;gap:6px;width:110px"><div class="pcard ${sideOf(p.pos)}" style="width:100px;cursor:default"><div class="ph" style="height:78px"><span class="pos">${p.pos}</span><span class="fc">${face(p.mor)}</span><img class="ava" src="${portrait(p,t,3)}" width="72" height="72"></div></div>
   <div class="s10">#${p.num}</div><div class="s7">AGE ${p.age}</div><div class="s7">${p.seasons} YRS PRO</div></div>
  <div class="col grow" style="gap:6px">
   <div class="row"><div class="s10">${esc(fullname(p).toUpperCase())}</div><div class="sp"></div>${stars(starsOf(p),'lg')}</div>
   <div class="row s7"><span>${POSNAME[p.pos]}</span><div class="sp"></div><span>LEVEL ${p.lvl}</span></div>
   <div class="row" style="gap:6px"><div class="bar grow" style="height:9px"><i style="width:${clamp(p.xp/need*100,0,100)}%;background:var(--cy)"></i></div><span class="s7">${p.xp}/${need} XP</span></div>
   ${mine&&p.sp>0?`<div class="yl blink s7">${p.sp} SKILL POINT${p.sp>1?'S':''} TO SPEND!</div>`:''}
   <div class="col" style="gap:5px">${rows}</div>
   <div class="row s7" style="gap:10px"><span>CONDITION ${Math.round(p.cond)}%</span><span>MORALE ${Math.round(p.mor)}% ${face(p.mor)}</span>${p.inj>0?`<span class="rdt">INJURED ${p.inj} WK</span>`:''}</div>
   <div class="row s7" style="gap:10px"><span>SALARY ${p.sal.toFixed(1)}M</span><span>CONTRACT ${p.yrs} YR${p.yrs===1?'':'S'}</span>${p.potg?'<span>POTENTIAL '+p.potg+'</span>':''}</div>
   <div class="s7 dim">${L.year} SEASON: ${sl}</div>
  </div></div><div class="row end" style="gap:8px">${btns}</div></div>`;
}
/* ---------- full-screen player page ---------- */
const MORW=m=>m>=90?'EXCEPTIONAL':m>=75?'GREAT':m>=60?'GOOD':m>=40?'OKAY':m>=20?'UNHAPPY':'FURIOUS';
const CNDW=p=>p.inj>0?'INJURED ('+p.inj+' WK)':p.cond>=95?'PERFECT':p.cond>=80?'GOOD':p.cond>=60?'TIRED':p.cond>=40?'EXHAUSTED':'WORN OUT';
const VALW=p=>{const r=tradeValue(p);return r?'RND '+r+' PICK':'NONE';};
const potStars=p=>clamp(Math.round(p.pot)/2,0.5,5);
const PENCIL='<svg width="14" height="14" viewBox="0 0 8 8" shape-rendering="crispEdges"><path fill="#fff" d="M6 0h1v1h1v1h-1v1h-1v1h-1v1h-1v1h-1v1h-2v-2h1v-1h1v-1h1v-1h1v-1h1z"/></svg>';
function plist(t){return rosterOf(t).sort((a,b)=>POSL.indexOf(a.pos)-POSL.indexOf(b.pos)||ovr(b)-ovr(a));}
SCR.player=()=>{

 const met=p.met===L.season*100+L.week;
 return`<div class="screen">

  <div class="box col" style="flex:1;gap:7px;padding:12px 10px 0"><span class="lbl">${POSNAME[p.pos]}</span>
   <div class="row stretch" style="gap:6px"><div class="col" style="gap:7px;flex:1">
    ${ln('AGE',p.age)}${ln('CONTRACT','$'+Math.round(p.sal)+'M ('+p.yrs+'Y)')}${ln('MORALE',MORW(p.mor)+' '+face(p.mor))}${ln('CONDITION',CNDW(p))}${ln('VALUE',VALW(p))}${p.bench?'<span class="yl">BENCHED</span>':''}
   </div><div class="col" style="align-items:center;gap:4px"><img class="ava" src="${portrait(p,t,2)}" width="48" height="48" style="border:2px solid #fff;background:${sideOf(p.pos)==='D'?'#e88686':sideOf(p.pos)==='K'?'#d6a067':'#8cc8f5'}"><span>#${p.num}</span></div></div>
   <div class="row ctr" style="gap:26px;margin-top:4px"><div class="col" style="align-items:center;gap:4px"><span>RATING</span>${stars(starsOf(p),'lg')}</div><div class="col" style="align-items:center;gap:4px"><span>POTENTIAL</span>${stars(potStars(p),'lg')}</div></div>
   <div class="sp"></div>
   <div class="box" style="margin:0 -10px;border-width:2px 0 0 0;padding:10px 8px 8px"><span class="lbl">XP LEVEL ${p.lvl}</span><div class="bar" style="height:14px"><i style="width:${clamp(p.xp/need*100,0,100)}%"></i></div>${mine&&p.sp>0?`<div class="yl blink s7" style="text-align:center;margin-top:4px">${p.sp} SKILL POINT${p.sp>1?'S':''}: TAP + TO UPGRADE</div>`:''}</div>
  </div>
  <div class="box col" style="flex:1;gap:9px;padding:12px 10px 8px"><span class="lbl">ATTRIBUTES</span>${attrs}<div class="sp"></div><div class="s7 dim">${p.pos==='QB'?'QB STRENGTH = HOW FAR HE CAN THROW':p.pos==='K'?'K STRENGTH = HOW FAR HE CAN KICK':'&nbsp;'}</div></div>
  <button class="bt ico" style="align-self:center" data-a="pnav" data-d="1">&gt;</button>
 </div>
 <div class="row" style="gap:8px"><button class="bt ico" data-a="pBack">${ICON.back}</button><div class="sp"></div>
  ${mine?`<button class="bt" style="width:100px" data-a="pBench">${p.bench?'UNBENCH':'BENCH'}</button>`:''}
  <button class="bt" style="width:100px" data-a="pStats">STATS</button>
  ${mine?`<button class="bt" style="width:100px" data-a="pMeet" ${met||L.cc<3?'disabled':''}>MEETING</button><button class="bt" style="width:100px" data-a="pTrade">TRADE</button>`:''}
 </div></div>`;
};
ACT.pc=d=>{const back=UI.scr==='player'?UI.sub.back:UI.scr,bs=UI.scr==='player'?UI.sub.bs:Object.assign({},UI.sub);UI.modal=null;go('player',{id:+d.id,back,bs});};
ACT.pBack=()=>go(UI.sub.back||'roster',UI.sub.bs||{});
ACT.pnav=d=>{const p=P(UI.sub.id),l=plist(p.team>=0?p.team:L.user),i=l.indexOf(p);if(i<0||!l.length)return;UI.sub.id=l[(i+ +d.d+l.length)%l.length].id;render();};
ACT.pSp=d=>{const p=P(UI.sub.id);if(p.sp>0&&p.a[d.k]<10){p.a[d.k]++;p.sp--;p.peak=Math.max(p.peak||0,ovr(p));sfx('coin');save();render();}};
ACT.pBench=()=>{const p=P(UI.sub.id);p.bench=!p.bench;if(p.bench)p.mor=clamp(p.mor-10,0,100);save();render();toast(p.bench?'BENCHED: HE WILL NOT PLAY':'BACK IN THE LINEUP');};
ACT.pMeet=()=>{const p=P(UI.sub.id);if(L.cc<3)return;L.cc-=3;p.met=L.season*100+L.week;const g=p.mor<50?25:15;p.mor=clamp(p.mor+g,0,100);sfx('coin');save();render();toast('MEETING WENT WELL: MORALE +'+g);};
ACT.pStats=()=>{const p=P(UI.sub.id),s=p.s,c=p.c;const row=(l,f)=>`<tr><td>${l}</td><td class="r">${f(s)}</td><td class="r">${f(c)+f(s)}</td></tr>`;
 const R=[['GAMES',x=>x.gp]];if(p.pos==='QB')R.push(['COMPLETIONS',x=>x.cmp],['ATTEMPTS',x=>x.att],['PASS YARDS',x=>x.pyd],['PASS TDS',x=>x.ptd],['INTERCEPTIONS',x=>x.pint],['RUSH YARDS',x=>x.ryd]);
 else if(['RB','WR','TE'].includes(p.pos))R.push(['CARRIES',x=>x.car],['RUSH YARDS',x=>x.ryd],['RUSH TDS',x=>x.rtd],['RECEPTIONS',x=>x.rec],['REC YARDS',x=>x.wyd],['REC TDS',x=>x.wtd],['FUMBLES',x=>x.fum]);
 else if(p.pos==='K')R.push(['FG MADE',x=>x.fgm],['FG ATTEMPTS',x=>x.fga]);
 else if(p.pos!=='OL')R.push(['TACKLES',x=>x.tkl],['SACKS',x=>x.sck],['INTERCEPTIONS',x=>x.dint]);
 modal(`<div class="mp" style="width:380px">${ttl('STATS',true)}<table class="tbl"><tr><th></th><th class="r">${L.year}</th><th class="r">CAREER</th></tr>${R.map(r=>row(r[0],r[1])).join('')}</table><div class="row end"><button class="bt" data-a="close">OK</button></div></div>`);};
ACT.pTrade=()=>{const p=P(UI.sub.id),r=tradeValue(p);modal(`<div class="mp" style="width:420px;align-items:center;text-align:center">${ttl('TRADE',true)}<div>${esc(fullname(p).toUpperCase())}</div><div class="s7 dim" style="line-height:2">${r?'OTHER TEAMS WILL GIVE YOU A ROUND '+r+' DRAFT PICK FOR HIM.':'NO TEAM WANTS TO TRADE FOR HIM. YOU CAN STILL RELEASE HIM.'}</div><div class="row"><button class="bt" data-a="close">CANCEL</button><button class="bt r" data-a="release2" data-id="${p.id}">RELEASE</button>${r?`<button class="bt y" data-a="pTrade2">TRADE FOR RND ${r}</button>`:''}</div></div>`);};
ACT.pTrade2=()=>{const p=P(UI.sub.id),r=tradePlayer(p);if(!r)return;sfx('coin');save();UI.modal=null;toast('TRADED FOR A ROUND '+r+' PICK');go('roster');};
ACT.pRename=()=>{const p=P(UI.sub.id);modal(`<div class="mp" style="width:380px">${ttl('RENAME',true)}<div>FIRST NAME</div><input class="txt" id="rnF" maxlength="12" value="${esc(p.fn.toUpperCase())}"><div>LAST NAME</div><input class="txt" id="rnL" maxlength="14" value="${esc(p.ln.toUpperCase())}"><div class="row end"><button class="bt" data-a="close">CANCEL</button><button class="bt y" data-a="pRename2">SAVE</button></div></div>`);};
ACT.pRename2=()=>{const p=P(UI.sub.id),f=($('#rnF').value||'').trim(),l=($('#rnL').value||'').trim();const cap=x=>x.charAt(0).toUpperCase()+x.slice(1).toLowerCase();if(f)p.fn=cap(f);if(l)p.ln=cap(l);save();closeModal();};
ACT.spAdd=d=>{const p=P(+d.id);if(p.sp>0&&p.a[d.k]<10){p.a[d.k]++;p.sp--;p.peak=Math.max(p.peak||0,ovr(p));sfx('coin');save();modal(pmHTML(p));}};
ACT.extend=d=>{const p=P(+d.id),c=extCost(p);if(L.cc<c)return;L.cc-=c;p.yrs+=3;p.sal=salFor(starsOf(p),p.age);p.mor=clamp(p.mor+15,0,100);news(fullname(p)+' signs a 3-year extension.');save();sfx('coin');modal(pmHTML(p));};
ACT.release=d=>{const p=P(+d.id);modal(`<div class="mp" style="width:380px;align-items:center;text-align:center">${ttl('RELEASE',true)}<div>RELEASE ${esc(fullname(p).toUpperCase())}?</div><div class="s7 dim">HE BECOMES A FREE AGENT. TEAM MORALE DROPS A LITTLE.</div><div class="row"><button class="bt" data-a="pc" data-id="${p.id}">CANCEL</button><button class="bt r" data-a="release2" data-id="${p.id}">RELEASE</button></div></div>`);};
ACT.release2=d=>{const p=P(+d.id);p.team=-1;p.yrs=ri(1,2);for(const q of rosterOf(L.user))q.mor=clamp(q.mor-3,0,100);news('You released '+p.pos+' '+fullname(p)+'.');save();UI.modal=null;if(UI.after){const f=UI.after;UI.after=null;f();}else if(UI.scr==='player')go('roster');else render();};
function needSpotThen(fn){if(rosterOf(L.user).length<rmax())return fn();UI.after=fn;modal(`<div class="mp" style="width:600px">${ttl('ROSTER FULL',true)}<div style="text-align:center">TAP A PLAYER TO RELEASE AND MAKE ROOM</div><div class="row ctr" style="flex-wrap:wrap;gap:6px">${rosterOf(L.user).map(p=>pcard(p,L.user,{sm:true,act:'relPick'})).join('')}</div><div class="row end"><button class="bt" data-a="cancelAfter">CANCEL</button></div></div>`);}
ACT.relPick=d=>{ACT.release2(d);};
ACT.cancelAfter=()=>{UI.after=null;closeModal();};

ACT.viewT=d=>go('roster',{t:+d.t});
SCR.standings=()=>{
 const c=UI.sub.c||T(L.user).conf,base=c==='AFC'?0:4,seeds=confSeeds(c);

ACT.sc=d=>{UI.sub.c=d.c;render();};
SCR.schedule=()=>{
 const t=L.user;let rows='';
 for(let w=1;w<=18;w++){const g=teamGame(w,t);if(!g){rows+=`<tr class="${w===L.week&&L.phase==='REG'?'me':''}"><td>WEEK ${w}</td><td colspan="2" class="dim">BYE</td></tr>`;continue;}
  const home=g.h===t,op=home?g.a:g.h;let res='';if(g.hs!=null){const us=home?g.hs:g.as,th=home?g.as:g.hs;res=`<span class="${us>th?'grt':us<th?'rdt':'yl'}">${us>th?'W':us<th?'L':'T'} ${us}-${th}</span>`;}
  rows+=`<tr class="${w===L.week&&L.phase==='REG'?'me':''}"><td>WEEK ${w}</td><td>${home?'VS':'AT'} ${esc(T(op).city.toUpperCase())} <span class="dim">${recStr(op)}</span></td><td class="r">${res}</td></tr>`;}
 return`<div class="screen"><div class="row"><button class="bt ico" data-a="go" data-s="hub">${ICON.back}</button><div class="grow">${ttl(L.year+' SCHEDULE')}</div><div style="width:32px"></div></div><div class="box grow scroll" style="padding:4px 8px"><table class="tbl">${rows}</table></div></div>`;
};
SCR.bracket=()=>{
 if(!L.po)return SCR.schedule();
 const bx=g=>{if(!g)return`<div class="bm"><div class="dim">TBD</div><div class="dim">TBD</div></div>`;const ln=(t,s,sd)=>`<div class="${g.hs!=null&&winnerOf(g)===t?'w':''} ${t===L.user?'me':''}"><span>${sd?sd+' ':''}${abbr(t)}</span><span>${s==null?'':s}</span></div>`;return`<div class="bm">${ln(g.a,g.as,g.aseed)}${ln(g.h,g.hs,g.hseed)}</div>`;};
 const R=L.po.rounds,col=(i,c)=>{const gs=R[i]?R[i].filter(g=>g.conf===c):[];let h=`<div class="rd">`;for(let k=0;k<[3,2,1][i];k++)h+=bx(gs[k]);return h+'</div>';};
 return`<div class="screen"><div class="row"><button class="bt ico" data-a="go" data-s="hub">${ICON.back}</button><div class="grow">${ttl('PLAYOFFS')}</div><div style="width:32px"></div></div>
 <div class="row s7"><span>AFC</span><div class="sp"></div><span>NFC</span></div>
 <div class="bracket grow">${col(0,'AFC')}${col(1,'AFC')}${col(2,'AFC')}<div class="rd"><div class="s7 yl" style="text-align:center">${champName()}</div>${bx(R[3]?R[3][0]:null)}${L.po.champ!=null?`<div class="s7" style="text-align:center">CHAMPION: ${abbr(L.po.champ)}</div>`:''}</div>${col(2,'NFC')}${col(1,'NFC')}${col(0,'NFC')}</div></div>`;
};
SCR.hof=()=>{

 pool.sort((a,b)=>(b.scout[0]+b.scout[1])-(a.scout[0]+a.scout[1]));
 const rows=pool.map(p=>`<tr><td><span class="${sideOf(p.pos)==='D'?'rdt':sideOf(p.pos)==='K'?'yl':'cyt'}">${p.pos}</span></td><td>${esc(pname(p).toUpperCase())}</td><td class="c">${p.age}</td><td>${stars(p.scout[0],'xs')}${p.scout[1]>p.scout[0]?' - '+stars(p.scout[1],'xs'):''}</td><td class="c">${p.potg}</td><td class="r">${D.done?'':`<button class="bt" style="padding:3px 6px 2px" data-a="dpick" data-id="${p.id}">DRAFT</button>`}</td></tr>`).join('');

 const log=D.log.slice(0,14).map(x=>{const p=P(x.id);return p?`<div style="white-space:nowrap;overflow:hidden">${x.t===L.user?'<span class="yl">':''}R${x.r} ${abbr(x.t)}: ${p.pos} ${esc(p.ln.toUpperCase())} ${x.t===L.user?'</span>':''}</div>`:'';}).join('');
 const pk=D.rounds.join(' - ');
 return`<div class="screen">
 <div class="row">${coinBox()}<div class="grow">${ttl(D.founding?'DRAFT':L.year+' DRAFT')}</div><div class="coin">PICKS ${pk}</div></div>
 <div class="row ctr" style="gap:12px">${D.done?'<span class="yl">DRAFT COMPLETE</span>':`<span class="yl blink">ROUND ${D.round+1} · YOU ARE ON THE CLOCK</span><span>PICK ${D.slot+1} · ${D.left} LEFT THIS ROUND</span>`}<span class="dim">${D.pool.length} PLAYERS LEFT</span></div>
 <div class="row ctr" style="gap:3px">${['ALL',...POSL].map(x=>`<span class="chip ${f===x?'on':''}" data-a="dff" data-f="${x}">${x}</span>`).join('')}</div>
 <div class="row grow stretch" style="gap:8px">
  <div class="box grow scroll" style="padding:4px 6px"><table class="tbl"><tr><th>POS</th><th>NAME</th><th class="c">AGE</th><th>SCOUTED</th><th class="c">POT</th><th></th></tr>${rows||'<tr><td colspan="6" class="dim">NO PLAYERS LEFT AT THIS POSITION</td></tr>'}</table></div>
  <div class="col" style="width:178px;gap:10px">

};

 UI.modal=null;modal(`<div class="mp" style="width:420px;align-items:center;text-align:center">${ttl('DRAFTED!',true)}<div class="row ctr" style="gap:12px">${pcard(p,L.user,{act:'close'})}<div class="col" style="align-items:flex-start;gap:5px">${POSDEF[p.pos].map(k=>`<div class="row s7" style="gap:5px"><span style="width:100px">${ATTR[k]}</span>${pips(p.a[k])}</div>`).join('')}<div class="s7">POTENTIAL ${p.potg}</div></div></div><button class="bt y" data-a="close">NICE</button></div>`);});};

const PRESS=[
 {w:'win',q:'GREAT WIN TODAY, COACH. WHO DESERVES THE CREDIT?',a:[['THE PLAYERS EARNED THIS ONE.',()=>teamMorAdd(6),'+ TEAM MORALE'],['OUR GAME PLAN WAS PERFECT.',()=>fanAdd(5),'+ FANS'],['WE STILL LEFT POINTS OUT THERE.',()=>{teamMorAdd(-3);fanAdd(3);},'+ FANS, - MORALE']]},
 {w:'loss',q:'TOUGH LOSS. WHAT WENT WRONG OUT THERE?',a:[['THAT ONE IS ON ME.',()=>teamMorAdd(6),'+ TEAM MORALE'],['WE NEED MORE FROM OUR PLAYERS.',()=>{teamMorAdd(-6);fanAdd(3);},'+ FANS, - MORALE'],['NO COMMENT.',()=>fanAdd(-4),'- FANS']]},
 {w:'any',pl:1,q:'IS {P} THE KEY TO THIS TEAM?',a:[['ABSOLUTELY. HE IS A STAR.',p=>{p.mor=clamp(p.mor+15,0,100);},'+ {P} MORALE'],['NOBODY IS BIGGER THAN THE TEAM.',()=>teamMorAdd(3),'+ TEAM MORALE'],['HE STILL HAS A LOT TO PROVE.',p=>{p.mor=clamp(p.mor-15,0,100);fanAdd(3);},'- {P} MORALE, + FANS']]},
 {w:'any',q:'THE FANS WANT A DEEP PLAYOFF RUN. CAN YOU DELIVER?',a:[['MARK MY WORDS: WE WILL.',()=>fanAdd(7),'++ FANS'],['ONE GAME AT A TIME.',()=>teamMorAdd(3),'+ TEAM MORALE'],['ASK ME IN JANUARY.',()=>{},'NO EFFECT']]},
 {w:'win',q:'YOUR OFFENSE LOOKED UNSTOPPABLE. WHAT IS THE SECRET?',a:[['HARD WORK IN PRACTICE.',()=>{for(const p of rosterOf(L.user))gainXP(p,10);},'+10 XP TO EVERYONE'],['WE HAVE THE BEST PLAYERS.',()=>teamMorAdd(6),'+ TEAM MORALE'],['GREAT COACHING, OBVIOUSLY.',()=>{fanAdd(4);teamMorAdd(-3);},'+ FANS, - MORALE']]},
 {w:'loss',pl:1,q:'SHOULD {P} BE WORRIED ABOUT HIS JOB?',a:[['NO. I FULLY TRUST HIM.',p=>{p.mor=clamp(p.mor+15,0,100);},'+ {P} MORALE'],['EVERYONE IS BEING EVALUATED.',p=>{p.mor=clamp(p.mor-8,0,100);teamMorAdd(2);},'- {P} MORALE'],['NEXT QUESTION.',()=>fanAdd(-2),'- FANS']]},
];
const teamMorAdd=v=>{for(const p of rosterOf(L.user))p.mor=clamp(p.mor+v,0,100);};
const fanAdd=v=>{L.fan=clamp(L.fan+v,2,100);};
function gainXP(p,x){const side=sideOf(p.pos),co=side==='O'?L.oc:side==='D'?L.dc:null;const mult=1+0.12*(L.fac.train-1)+(co?co.stars*0.08:0);p.xp+=Math.round(x*mult);let up=0;while(p.xp>=xpNeed(p.lvl)&&p.lvl<30){p.xp-=xpNeed(p.lvl);p.lvl++;p.sp++;up++;}return up;}
function gameRating(p,s,res){
 const pos=p.pos;let r=5;
 if(pos==='QB')r=3+(s.pyd||0)/70+(s.ptd||0)*1.1-(s.pint||0)*1.4+(s.ryd||0)/40;
 else if(pos==='RB')r=3+((s.ryd||0)+(s.wyd||0))/32+((s.rtd||0)+(s.wtd||0))*1.2-(s.fum||0)*2;
 else if(pos==='WR'||pos==='TE')r=3+(s.wyd||0)/26+(s.wtd||0)*1.3+(s.rec||0)*0.2-(s.fum||0)*2;
 else if(pos==='K')r=4+(s.fgm||0)*1.2-((s.fga||0)-(s.fgm||0))*1.5;

function simOppDrive(s0){

 const edge=clamp((R.off-U.def-8)/100,-0.35,0.35),ql=L.settings.qlen,lines=[];
 let s=s0,down=1,togo=Math.min(10,100-s),q=M.qtr,clk=M.clock,n=0,res=null,landX=0,head='',sc0=M.sc[0],sc1=M.sc[1];
 const QB=od.QB[0],RB=od.RB[0],TG=[od.WR[0],od.WR[0],od.WR[1],od.TE[0],RB].filter(Boolean),K=od.K[0];
 const md=M.dep,pool={sack:[md.DL[0],md.DL[1],md.DL[0],md.DL[1],md.LB[0]],int:[md.DB[0],md.DB[1],md.DB[2],md.DB[0],md.LB[0],md.LB[1]],tkl:[md.LB[0],md.LB[1],md.LB[0],md.LB[1],md.DB[0],md.DB[1],md.DB[2],md.DL[0],md.DL[1]]};
 const pd=k=>pick(pool[k].filter(Boolean))||null;
 const credit=(p,k,x)=>{if(!p)return;if(k)cr(p,k,1);xpG(p,x);};
 const push=(t,fx,cls)=>lines.push({t,s:clamp(s,0,100),q,clk:Math.max(0,Math.round(clk)),fx,cls});
 const nmo=p=>p?nm(p):abbr(op),nmd=p=>p?nm(p):'THE DEFENSE';
 const tryFG=()=>{const fd=100-s+17;const p=clamp(0.98-(fd-20)*0.017,0.35,0.98),made=Math.random()<p;push(nmo(K)+' '+fd+' YD FIELD GOAL · '+(made?'GOOD!':'NO GOOD'),made?()=>{M.sc[1]+=3;}:null,made?'bad':'good');clk-=5;res=made?'fg':'fgmiss';head=made?abbr(op)+' FIELD GOAL':'FIELD GOAL MISSED!';if(made)sc1+=3;};
 while(!res&&n<70){
  n++;
  if(clk<=0){if(q===1||q===3){q++;clk+=ql;push('END OF QUARTER',null,'dim');}else{const lead=sc1-sc0;if(100-s+17<=53&&(q===2||(lead<=0&&lead>=-3)))tryFG();else{res='clock';head=q===2?'END OF HALF':'END OF GAME';}break;}}
  const lead=sc1-sc0;
  if(q>=4&&lead>0&&clk<=125){push(nmo(QB)+' TAKES A KNEE',null,'dim');clk-=40;s=Math.max(1,s-1);continue;}
  const hurry=(q===2||q>=4)&&clk<120&&(q===2||lead<=0);
  if(down===4){
   const fd=100-s+17,desp=q>=4&&lead<0&&clk<240;
   if(!desp&&fd<=54){tryFG();break;}
   if(!desp&&!(togo<=2&&s>=40&&s<=72&&Math.random()<0.5)){const dist=Math.round(clamp(40+gauss()*5+attr(od.K[0],'str')*0.6,28,62));let land=s+dist,tb='';if(land>=100){land=80;tb=' · TOUCHBACK';}push(abbr(op)+' PUNTS '+dist+' YDS'+tb,null);clk-=8;res='punt';landX=110-land;head='PUNT';s=land;break;}
  }
  const pass=Math.random()<(down===3&&togo>4?0.82:hurry?0.8:down===1?0.48:0.55);
  let y=0,t='',cls='',ro=hurry?14:30;
  if(pass){
   const r=Math.random(),sk=clamp(0.065-edge*0.09,0.02,0.13),ip=clamp(0.027-edge*0.045,0.008,0.065),cp=clamp(0.64+edge*0.6,0.42,0.84);
   if(r<sk){y=-ri(3,9);const d=pd('sack');credit(d,'sck',10);credit(d,'tkl',0);t=nmo(QB)+' SACKED BY '+nmd(d)+' ('+y+')';cls='good';}
   else if(r<sk+ip){const d=pd('int');credit(d,'dint',14);t='INTERCEPTED! '+nmd(d)+' PICKS OFF '+nmo(QB);s=Math.min(99,s+ri(5,25));
    if(Math.random()<0.06){res='pick6';head='PICK SIX!';push(t+' · TOUCHDOWN!',()=>{M.sc[0]+=6;M.ts.td++;},'good');}
    else{const ret=ri(0,18);s=Math.max(1,s-ret);res='int';head='INTERCEPTION!';push(t+(ret?' · RETURNED '+ret+' YDS':''),null,'good');}
    clk-=6;break;}
   else if(r<sk+ip+cp){y=passY(edge);const w=pick(TG);t=nmo(QB)+' TO '+nmo(w)+' FOR '+y;if(s+y<100)credit(pd('tkl'),'tkl',3);}
   else{const d=pd('int');t=nmo(QB)+' INCOMPLETE'+(d&&Math.random()<0.3?' · BROKEN UP BY '+nm(d):'');ro=6;}
  }else{
   if(Math.random()<clamp(0.014-edge*0.02,0.004,0.03)){const d=pd('tkl');credit(d,'tkl',5);s+=ri(0,4);res='fum';head='FUMBLE RECOVERED!';push('FUMBLE! '+nmd(d)+' FORCES IT · '+abbr(L.user)+' RECOVER!',null,'good');clk-=6;break;}
   y=runY(edge);const ball=Math.random()<0.86?RB:QB;t=nmo(ball)+' RUN FOR '+y;if(s+y<100)credit(pd('tkl'),'tkl',3);
  }
  s+=y;clk-=ro;
  if(s>=100){s=100;const g2=Math.random()<0.95;push(t+' · TOUCHDOWN!',()=>{M.sc[1]+=6;},'bad');push('EXTRA POINT '+(g2?'IS GOOD':'NO GOOD'),g2?()=>{M.sc[1]+=1;}:null,g2?'':'good');res='td';head=abbr(op)+' TOUCHDOWN';sc1+=g2?7:6;break;}
  if(s<=0){s=0;push(t+' · SAFETY!',()=>{M.sc[0]+=2;},'good');res='safety';head='SAFETY!';break;}
  togo-=y;
  if(togo<=0){down=1;togo=Math.min(10,100-s);t+=' · 1ST DOWN';}
  else{down++;if(down>4){push(t+' · TURNOVER ON DOWNS!',null,'good');res='downs';head='DEFENSE HOLDS!';break;}}
  push(t,null,cls);
 }
 if(!res){res='clock';head='END OF DRIVE';}

}
function oppDrive(s,pre){

}

 return`<div class="mp"><div class="row"><div class="grow">${ttl(esc(T(op).city.toUpperCase())+' BALL',true)}</div>${o.done?'':'<button class="bt" data-a="gSkip">SKIP</button>'}</div>

 ${[1,2,3,4,5,6,7,8,9].map(i=>`<div style="position:absolute;left:${(10+i*10)/120*100}%;top:0;bottom:0;width:1px;background:rgba(255,255,255,${i===5?.9:.45})"></div>`).join('')}

/* ---------- set up a play ---------- */

 const qb=mkF(d.QB[0],'O','QB',los-4.6,by),rb=mkF(d.RB[0],'O','RB',los-5.2,by+1.9);
 const w1=mkF(d.WR[0],'O','WR',los-0.8,clamp(by-14,3,50)),w2=mkF(d.WR[1],'O','WR',los-0.8,clamp(by+14,3,50)),te=mkF(d.TE[0],'O','TE',los-0.9,by+3.5);
 const ol=[mkF(d.OL[0],'O','OL',los-0.7,by-1.7),mkF(null,'O','OL',los-0.7,by),mkF(d.OL[1],'O','OL',los-0.7,by+1.7)];
 const dl=[mkF(od.DL[0],'D','DL',los+0.9,by-1),mkF(od.DL[1],'D','DL',los+0.9,by+1)];
 const lb=[mkF(od.LB[0],'D','LB',los+4.6,by-3.6),mkF(od.LB[1],'D','LB',los+4.6,by+3.8)];
 const c1=mkF(od.DB[0],'D','DB',los+rnd(1.6,6),w1.y),c2=mkF(od.DB[1],'D','DB',los+rnd(1.6,6),w2.y),sf=mkF(od.DB[2],'D','S',Math.min(119,los+rnd(11,15)),by+rnd(-4,4));
 c1.man=w1;c2.man=w2;lb[1].man=te;lb[0].man=rb;
 if(Math.random()<0.16+(L.settings.diff===3?(L.dyn-10)*0.012:L.settings.diff*0.05))lb[0].blitz=true;
 for(const f of[c1,c2,lb[0],lb[1],sf])f.acc=10+A(f,'cov')*1.3;
 setRoute(w1,'WR',pick(Object.keys(RT.WR)),1);setRoute(w2,'WR',pick(Object.keys(RT.WR)),-1);
 setRoute(te,'TE',pick(Object.keys(RT.TE)),-1);setRoute(rb,'RB',pick(Object.keys(RT.RB)),-1);
 M.O=[...ol,te,w1,w2,rb,qb];M.D=[...dl,...lb,c1,c2,sf];
 M.qb=qb;M.rb=rb;M.w1=w1;M.w2=w2;M.te=te;M.kr=null;M.ball=null;M.carrier=null;M.aim=null;M.thrown=false;M.comp=null;M.primary=null;M.intBy=null;M.tbOK=false;M.fair=false;
}
function snap(type){
 if(M.phase!=='pre')return;
 M.play=type;M.phase='live';M.pt=0;M.banT=0;M.thrown=false;M.ball=null;M.carrier=null;M.comp=null;M.primary=null;M.handed=false;M.scramble=false;M.steer=null;M.plays++;M.went4=false;
 if(M.runoff>0){M.clock-=Math.min(M.runoff*0.5,Math.max(0,M.clock-1));M.runoff=0;}
 sfx('whistle');
 if(type==='run'){for(const f of M.O)if(f.role==='WR'||f.role==='TE')f.route=null;M.rb.route=null;}
}
function setCarrier(f){M.carrier=f;M.aim=null;f.route=null;f.ty=f.y;M.input=ptr.down?'run':null;for(const o of M.O)if(o!==f&&o.role!=='OL')o.blk=null;if(f.role!=='QB'||M.scramble)M.carries++;if(ptr.down)M.steer={y0:ptr.y,ty0:f.y,stepped:true,ly:ptr.y,lt:performance.now()};}
function tuck(){if(!M||M.phase!=='live'||M.play!=='pass'||M.thrown||M.carrier)return;M.scramble=true;setCarrier(M.qb);pop('QB KEEPER',M.qb.x,M.qb.y,'#ffe94a');}

/* ---------- throwing ---------- */
function leadPoint(f,q,arm){let tx=f.x,ty=f.y;for(let k=0;k<3;k++){const d=Math.hypot(tx-q.x,ty-q.y),Tf=flightT(d,arm);tx=f.x+f.vx*Tf;ty=f.y+f.vy*Tf;}return{x:tx,y:ty};}
const flightT=(d,arm)=>0.1+d/(21+arm*1.5)+d*0.004;
/* slingshot pass model: drag direction = aim (opposite of the pull), drag length = power */
const PULL_MIN=10,PULL_MAX=200;
function throwModel(pull,str){
 const p=clamp((pull-PULL_MIN)/(PULL_MAX-PULL_MIN),0,1),maxR=18+str*4;
 const d=4+Math.pow(p,1.35)*(maxR-4),v=8+p*(12+str*1.2),T=0.12+d/v,peak=clamp(0.35+1.25*T*T,0.5,6);
 return{p,d,T,peak,maxR};
}
function aimInfo(a){
 const q=M.qb,sxv=a.sx-a.cx,syv=a.sy-a.cy,pull=Math.hypot(sxv,syv),str=A(q,'str');
 let ux=sxv/PXY*M.dir,uy=syv/PYY;const ul=Math.hypot(ux,uy)||1;ux/=ul;uy/=ul;
 const tm=throwModel(pull,str);
 const tx=q.x+ux*tm.d,ty=clamp(q.y+uy*tm.d,-3,56.3);
 const run=pull>=14&&ux<-0.55;
 let press=1;for(const f of M.D)if(!f.eng&&f.stun<=0&&d2(f,q)<2.6){press=1.55;break;}
 const mv=Math.hypot(q.vx,q.vy)>1.5?1.2:1;
 const sd=(0.2+tm.d*0.024)*(1.5-A(q,'acc')*0.1)*press*mv;
 return{tx,ty,d:tm.d,T:tm.T,peak:tm.peak,p:tm.p,run,sd,pull,str};
}
function throwBall(ai){
 const q=M.qb,tx=ai.tx+gauss()*ai.sd,ty=ai.ty+gauss()*ai.sd*0.8;
 M.ball={x0:q.x+0.3,y0:q.y-0.1,x1:tx,y1:ty,T:ai.T,t:0,z0:2.1,z1:0.9,peak:ai.peak};
 M.thrown=true;M.aim=null;M.input=null;q.throwT=0.3;sfx('kick');
 const Tf=M.ball.T;let best=null,bt=1e9;for(const f of M.O){if(!SKILL.includes(f.role)||f.stun>0)continue;const dd=Math.hypot(f.x+f.vx*Tf-tx,f.y+f.vy*Tf-ty);if(dd<bt){bt=dd;best=f;}}
 M.primary=bt<2.5?best:null;if(M.primary)M.primary.dove=false;
 M.D.filter(f=>f.role!=='DL'&&!f.blitz).sort((a,b)=>Math.hypot(a.x-tx,a.y-ty)-Math.hypot(b.x-tx,b.y-ty)).slice(0,2).forEach((f,i)=>{if(Math.hypot(f.x-tx,f.y-ty)<14){f.hawk=true;f.react=0.46-A(f,'cov')*0.02+i*0.2;}});
}
function ballPos(b){const u=clamp(b.t/b.T,0,1);return{x:lerp(b.x0,b.x1,u),y:lerp(b.y0,b.y1,u),z:lerp(b.z0,b.z1,u)+4*b.peak*u*(1-u),u};}

/* ---------- live play update ---------- */
function upLive(dt){
 M.pt+=dt;M.clock-=dt;
 const b=M.ball;
 if(M.play==='run'&&!M.carrier&&!M.handed&&M.pt>0.32&&d2(M.rb,M.qb)<1.7){M.handed=true;setCarrier(M.rb);}
 for(const f of M.O){
  tickF(f,dt);if(f.stun>0||(f.down>0&&f!==M.carrier&&!f.dive))continue;
  if(f===M.carrier){upCarrier(f,dt);if(M.phase!=='live')return;continue;}
  if(f.role==='QB'){if(M.play==='pass'&&!M.thrown&&!M.carrier){upQB(f,dt);if(M.phase!=='live')return;}else steer(f,f.x,f.y,0,18,dt);continue;}
  if(f.role==='OL'){upOL(f,dt);continue;}
  if(M.play==='run'&&f===M.rb&&!M.handed){steer(f,M.qb.x+0.4,M.qb.y,f.spd*0.75,40,dt);continue;}
  if(M.play==='ret'&&f===M.kr&&!M.caught){steer(f,M.land.x,M.land.y,f.spd,f.acc,dt);f.face=1;continue;}
  if(M.carrier||M.play==='run'||M.play==='ret'){upBlocker(f,dt);continue;}
  if(b&&f===M.primary){upChase(f,dt);continue;}
  followRoute(f,dt);
 }
 for(const f of M.D){tickF(f,dt);if(f.stun>0)continue;upDef(f,dt);}
 separate(M.O);separate(M.D);
 for(const f of[...M.O,...M.D]){if(f!==M.carrier)f.y=clamp(f.y,-1,54.3);f.x=clamp(f.x,-2,121);}
 if(b){
  b.t+=dt;const bp=ballPos(b);
  if(b.ret){
   if(b.t>=b.T){const kr=M.kr;if(d2(kr,{x:b.x1,y:b.y1})<2.6){M.ball=null;M.caught=true;
     if(M.retKind==='punt'&&!M.fair&&Math.random()<0.02){M.ts.to++;cr(kr.pl,'fum',1);return endPlay('fumble',kr.x,kr.y,'MUFFED PUNT!');}
     setCarrier(kr);if(M.fair)return endPlay('fair',kr.x,kr.y);if(b.x1<10&&M.retKind==='ko'){M.tbOK=true;M.caughtInEZ=true;}sfx('catch');}
    else{b.T+=0.25;b.x1=kr.x;b.y1=kr.y;}}
  }else{
   if(bp.z<3.9&&bp.u>0.12&&!b.done)catchCheck(b,bp);
   if(M.phase!=='live')return;
   if(M.ball&&M.ball.t>=M.ball.T){const bb=M.ball;M.ball=null;const oob=bb.y1<0||bb.y1>53.33||bb.x1>120;return endPlay('inc',M.los,M.ballY,bb.tip?'TIPPED · INCOMPLETE':oob?'OUT OF BOUNDS':'INCOMPLETE');}
  }
 }
 contacts();
}
function upQB(f,dt){
 if(M.pt<0.5)steer(f,M.los-6.6,M.ballY,7,34,dt);
 else steer(f,f.x,f.y,0,20,dt);
 f.face=1;f.y=clamp(f.y,1,52.3);
 if(f.x>M.los-0.2)tuck();
}
function routeBreak(f){if(f.ri>=f.rlen)return;for(const d of M.D){if(d.man!==f)continue;const pb=0.32+(A(f,'spd')+A(f,'cat')*0.5-A(d,'cov')*1.5)*0.045;if(Math.random()<clamp(pb,0.1,0.75))d.beat=0.4+Math.random()*0.35;}}
function followRoute(f,dt){
 if(f.route&&f.ri<f.route.length){const w=f.route[f.ri];if(Math.hypot(w.x-f.x,w.y-f.y)<0.7){f.ri++;routeBreak(f);}
  if(f.ri<f.route.length){const w2=f.route[f.ri];steer(f,w2.x,w2.y,f.spd,f.acc*1.25,dt);return;}}
 if(f.route&&f.route.length&&f.route[f.route.length-1].stop){steer(f,f.x,f.y,0,f.acc,dt);if(M.qb)f.face=M.qb.x<f.x?-1:1;return;}
 steer(f,f.x+5,clamp(f.y,2,51.3),f.spd,f.acc,dt);
}
function engage(b,d){
 const run=M.play!=='pass'||!!M.carrier,bk=A(b,'blk'),st=A(d,'str');
 let h=b.role==='OL'?(run?0.9+(bk-st)*0.16+rnd(0,0.9):1.5+(bk-st)*0.22+rnd(0,1.4)):0.7+(bk-st)*0.1+rnd(0,0.6);
 d.eng=b;d.engT=clamp(h,0.4,4.2);b.blk=d;
}
function holdBlock(f,d,dt){const h=M.carrier||M.qb||f;const dx=h.x-d.x,dy=h.y-d.y,l=Math.hypot(dx,dy)||1;steer(f,d.x+dx/l*0.95,d.y+dy/l*0.95,4.5,30,dt);}
function upOL(f,dt){
 if(f.blk&&(f.blk.stun>0||(f.blk.eng&&f.blk.eng!==f)||(f.blk.shed>0&&f.blk.eng!==f)))f.blk=null;
 if(!f.blk){let best=null,bd=4.5;for(const d of M.D){if(d.eng||d.shed>0||d.stun>0)continue;if(M.O.some(o=>o!==f&&o.blk===d))continue;const dd=d2(f,d);if(dd<bd){bd=dd;best=d;}}f.blk=best;}
 const d=f.blk;
 if(!d){steer(f,f.x+(M.play==='pass'&&!M.carrier?-0.4:0.6),f.y,1.6,10,dt);return;}
 if(d.eng===f)holdBlock(f,d,dt);else{steer(f,d.x-0.6,d.y,f.spd,30,dt);if(d2(f,d)<1.1&&!d.eng&&d.shed<=0)engage(f,d);}
}
function upBlocker(f,dt){
 if(f.blk&&((f.blk.eng&&f.blk.eng!==f)||f.blk.stun>0||(f.blk.shed>0&&f.blk.eng!==f)))f.blk=null;
 const ref=M.carrier||(M.play==='ret'?M.kr:M.rb)||f;

  }else if(M.phase==='live'){
   if(M.play==='pass'&&!M.thrown&&!M.carrier){b.push(`<button class="bt" data-a="gTuck">QB RUN</button>`);if(M.plays<5)hint='PULL BACK &amp; RELEASE TO THROW · LONGER PULL = HARDER THROW · PULL FORWARD TO RUN';}
   else if(M.play==='ret'&&M.retKind==='punt'&&!M.caught&&!M.fair)b.push(`<button class="bt" data-a="gFair">FAIR CATCH</button>`);
   if(M.tbOK)b.push(`<button class="bt" data-a="gKnee">TAKE A KNEE</button>`);
   if(M.carrier&&M.carries<=5)hint=IS_MOBILE?'DRAG UP/DOWN TO MOVE · TAP TO DIVE':'DRAG OR ARROWS / W S TO MOVE · CLICK OR SPACE TO DIVE';
  }
  ctrl=b.join('');
 }
 setH('gctrl',ctrl);setH('ghint',hint);
 setH('gban',M.banT>0&&M.ban?`<div>${esc(M.ban.t)}${M.ban.sub?`<small>${esc(M.ban.sub)}</small>`:''}</div>`:'');
 setH('gov',M.ov?`<div class="gov">${M.ov.html()}</div>`:'');
 setH('gpz',M.paused?`<div class="gov" style="z-index:40"><div class="mp" style="width:300px;align-items:center;text-align:center">${ttl('PAUSED',true)}<button class="bt y big" data-a="gResume">RESUME</button><button class="bt" data-a="gSnd">SOUND: ${L.settings.sound?'ON':'OFF'}</button>${IS_MOBILE?'<button class="bt" data-a="fs">FULL SCREEN</button>':''}<button class="bt r" data-a="gSim">SIM REST OF GAME</button></div></div>`:'');
}

/* ---------- actions ---------- */
ACT.gAct=d=>{if(!M||!M.ov||!M.ov.acts)return;const f=M.ov.acts[+d.i];M.ov=null;if(f)f();};
ACT.gSkip=()=>{if(M&&M.ov&&M.ov.type==='drive')while(!M.ov.done)revealLine();};
ACT.gDriveGo=()=>{if(!M||!M.ov||M.ov.type!=='drive'||!M.ov.done)return;const o=M.ov;M.ov=null;afterOpp(o);};
ACT.gRun=()=>{if(M)snap('run');};
ACT.gCP=()=>{if(M)changePlay();};
function changePlay(){if(!M||M.phase!=='pre'||!(M.cp>0)||M.conv)return;M.cp--;const pk=(f,k,ins)=>{const names=Object.keys(RT[k]).filter(n=>n!==f.rname);const sx=f.x,sy=f.y;setRoute(f,k,pick(names),ins);f.x=sx;f.y=sy;};pk(M.w1,'WR',1);pk(M.w2,'WR',-1);pk(M.te,'TE',-1);pk(M.rb,'RB',-1);sfx('tick');}
ACT.gFG=()=>{if(M)startKick('fg');};
ACT.gKneel=()=>{if(M)kneel();};
ACT.gTO=()=>{if(M)timeout();};
ACT.gTuck=()=>{if(M)tuck();};
ACT.gFair=()=>fairCatch();
ACT.gKnee=()=>takeKnee();
ACT.gPause=()=>{if(M)M.paused=true;};
ACT.gResume=()=>{if(M)M.paused=false;};
ACT.gSnd=()=>{L.settings.sound=!L.settings.sound;save();};
ACT.gSim=()=>{if(M){M.paused=false;simRest();}};

/* ---------- input (mouse + touch, single active pointer) ---------- */
function cpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*CW/r.width,y:(e.clientY-r.top)*CH/r.height};}
cv.addEventListener('pointerdown',e=>{
 if(!M||M.paused||M.ov)return;e.preventDefault();audio();
 if(ptr.down&&ptr.id!==e.pointerId)return;
 const p=cpos(e),now=performance.now();try{cv.setPointerCapture(e.pointerId);}catch(_){}
 Object.assign(ptr,{down:true,id:e.pointerId,x:p.x,y:p.y,sx:p.x,sy:p.y,t0:now,moved:0,hist:[{x:p.x,y:p.y,t:now}]});
 if(M.phase==='pre'){snap('pass');M.aim={sx:p.x,sy:p.y,cx:p.x,cy:p.y};M.input='aim';return;}
 if(M.phase==='live'){
  if(M.play==='pass'&&!M.thrown&&!M.carrier){M.aim={sx:p.x,sy:p.y,cx:p.x,cy:p.y};M.input='aim';return;}
  if(M.carrier){const c=M.carrier;M.steer={y0:p.y,ty0:c.ty==null?c.y:c.ty,stepped:false,ly:p.y,lt:now};M.input='run';}return;}
 if(M.phase==='kick'&&M.kick&&M.kick.st==='aim'){M.kick.sw={sx:p.x,sy:p.y,cx:p.x,cy:p.y};M.input='kick';}
},{passive:false});
cv.addEventListener('pointermove',e=>{
 if(!M||!ptr.down||e.pointerId!==ptr.id)return;e.preventDefault();const p=cpos(e),now=performance.now();
 ptr.x=p.x;ptr.y=p.y;ptr.moved=Math.max(ptr.moved,Math.hypot(p.x-ptr.sx,p.y-ptr.sy));
 ptr.hist.push({x:p.x,y:p.y,t:now});while(ptr.hist.length&&now-ptr.hist[0].t>130)ptr.hist.shift();
 if(M.aim){M.aim.cx=p.x;M.aim.cy=p.y;}
 if(M.kick&&M.kick.sw){M.kick.sw.cx=p.x;M.kick.sw.cy=p.y;}
 const c=M.carrier;
 if(c&&M.steer&&M.phase==='live'&&M.input==='run'){const st=M.steer,dy=p.y-st.y0;if(Math.abs(dy)>6)st.stepped=true;
  c.ty=clamp(st.ty0+dy/PYY*1.25,-1.5,54.8);
  const vel=Math.abs(p.y-st.ly)/Math.max(1,now-st.lt);if(vel>0.55&&c.jk<=0)c.jk=0.25;st.ly=p.y;st.lt=now;}
},{passive:false});
function ptrUp(e){
 if(!ptr.down||(e&&e.pointerId!==ptr.id))return;ptr.down=false;ptr.id=null;if(!M)return;
 const inp=M.input;M.input=null;
 if(M.aim){const a=M.aim;M.aim=null;if(inp==='aim'&&M.phase==='live'&&M.play==='pass'&&!M.thrown&&!M.carrier){const ai=aimInfo(a);if(ai.pull>=PULL_MIN){if(ai.run)tuck();else throwBall(ai);}}return;}
 if(M.kick&&M.kick.sw){const s=M.kick.sw;M.kick.sw=null;kickRelease(s.cx-s.sx,s.cy-s.sy);return;}
 if(M.steer){const st=M.steer;M.steer=null;if(!st.stepped&&M.carrier&&M.phase==='live'&&performance.now()-ptr.t0<260&&ptr.moved<14)dive(M.carrier);}
}
cv.addEventListener('pointerup',ptrUp);
cv.addEventListener('pointercancel',e=>{if(e.pointerId!==ptr.id)return;ptr.down=false;ptr.id=null;if(M){M.aim=null;M.steer=null;M.input=null;if(M.kick)M.kick.sw=null;}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
const KM={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down'};
addEventListener('keydown',e=>{
 if(e.target&&e.target.tagName==='INPUT')return;
 const k=KM[e.code];if(k)keys[k]=true;
 if(UI.scr!=='game'||!M)return;
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
 if(e.repeat)return;audio();
 const c=e.code;
 if(c==='Escape'){M.paused=!M.paused;return;}
 if(M.paused)return;
 if(M.ov){if(c==='Space'||c==='Enter'){if(M.ov.type==='drive'){if(!M.ov.done)ACT.gSkip();else ACT.gDriveGo();}else if(M.ov.acts)ACT.gAct({i:0});}return;}
 if(M.phase==='pre'){if(c==='Space'||c==='Enter')snap('pass');else if(c==='KeyR')snap('run');else if(c==='KeyF')startKick('fg');else if(c==='KeyT')timeout();else if(c==='KeyC')changePlay();return;}
 if(M.phase==='live'){
  if(M.carrier){if(c==='Space')dive(M.carrier);else if(c==='KeyK')takeKnee();}
  else if(M.play==='pass'&&!M.thrown){if(c==='KeyR'||c==='Space')tuck();}
  else if(M.play==='ret'&&c==='KeyF')fairCatch();
  return;}
 if(M.phase==='kick'&&M.kick&&M.kick.st==='aim'&&(c==='Space'||c==='Enter')){const pw=clamp(kickNeed()+0.08,0.3,1.04);kickRelease(0,-pw*170);}
});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)keys[k]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;ptr.down=false;ptr.id=null;});

/* ---------- main loop ---------- */
let lastT=performance.now();
function loop(now){
 const dt=Math.min(0.033,(now-lastT)/1000);lastT=now;
 if(UI.scr==='game'&&M){try{if(!M.paused)step(dt);if(M){draw();hud();}}catch(err){console.error(err);}}
 requestAnimationFrame(loop);
}

/* =====================================================================
   BOOT · scaling · mobile
   ===================================================================== */
function fit(){
 const vv=window.visualViewport,w=vv?vv.width:innerWidth,h=vv?vv.height:innerHeight;
 const s=Math.min(w/640,h/360);$('#stage').style.transform='scale('+s+')';
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,250));
if(window.visualViewport)visualViewport.addEventListener('resize',fit);
fit();
document.addEventListener('touchmove',e=>{if(!e.target.closest||!e.target.closest('.scroll'))e.preventDefault();},{passive:false});
if(document.fonts&&document.fonts.load){document.fonts.load('8px "Press Start 2P"').then(()=>{if(UI.scr!=='game')render();}).catch(()=>{});}
go('title');
requestAnimationFrame(loop);
</script>
